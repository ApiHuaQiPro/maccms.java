; APPK-2 C-10 —— 对照环境 PHP 运行参数（技术设计 v15 §7.3 ENV-8、§6.21）
;
; 用法（PRE-2 / S3-05 / T3 的 PHP 侧，工作目录 = 仓库根）：
;
;   /d/Tools/php/7.3/php.exe -c tests/compare/APPK-2/php.ini \
;       -d extension_dir=<PHP 7.3 的 ext 目录> \
;       -S 127.0.0.1:18180 -t .compare/APPK-2/php-site
;
; 为什么必须显式给 -c：PHP 默认会去找它自带的 php.ini，本机那份与线上不一定一致，
; 两侧（PHP 侧 / Java 侧）只要运行参数不同，比出来的差异就可能是环境差异。
;
; 本文件只写“会改变输出字节或错误可见性”的键。其余键保持 PHP 7.3 默认值——
; 不要在这里顺手加 opcache、xdebug 一类扩展设置：它们既不改输出，又会引入
; “本机有、线上没有”的分叉。
;
; 值来由（逐条对应技术设计）：
;   date.timezone=PRC         旧站 application/config.php 的默认时区；缺失会让 date() 与
;                             数据库时间相差 8 小时，直接落到页面输出上。
;   default_charset=UTF-8     旧库仍是 utf8（非 utf8mb4），页面 meta 与响应头都依赖它。
;   display_errors=Off        与线上一致：错误只进日志，不进页面；打开会把 PHP notice
;                             混进 HTML，造成两侧误判。
;   log_errors=On             错误必须有地方可查（ENV-8 的日志口径）。
;   error_reporting=E_ALL     只在日志里看得到全部错误，不由 display_errors 决定。
;   precision=14              浮点转字符串的位数；旧站在模板里直接输出评分、价格一类浮点数。
;   serialize_precision=-1    与 precision 一致地序列化浮点（PHP 7.1+ 语义）。
;   short_open_tag=Off        线上是 Off；打开会让模板里的 <? 被当 PHP 执行。
;   memory_limit=256M         旧站模板渲染与采集的峰值需求。
;   expose_php=Off            不在响应头里暴露版本，两侧一致。
;
; 不在这里写的、但 ENV-8 要求随命令一起给的：
;   extension_dir  由 -d 传入（本机 PHP 的 ext 目录随安装位置变，写死在仓库里就会换机即坏）。
;   LC_ALL=C       由 launch 命令的环境变量给（SNAPD-4 的排序/本地化口径）。

[PHP]
engine = On
short_open_tag = Off
precision = 14
serialize_precision = -1
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
expose_php = Off
max_execution_time = 60
max_input_time = 60
max_input_vars = 1000
memory_limit = 256M
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
report_memleaks = On
html_errors = Off
variables_order = "GPCS"
request_order = "GP"
post_max_size = 32M
default_charset = "UTF-8"
default_mimetype = "text/html"
upload_max_filesize = 32M
file_uploads = On
allow_url_fopen = On
allow_url_include = Off
date.timezone = PRC
default_language = "en"

[Session]
session.save_handler = files
session.use_strict_mode = 0
session.use_cookies = 1
session.use_only_cookies = 1
session.name = PHPSESSID
session.auto_start = 0
session.cookie_lifetime = 0
session.cookie_path = /
session.cookie_domain =
session.cookie_httponly =
session.serialize_handler = php
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440
session.cache_limiter = nocache
session.cache_expire = 180
