# spike：不配置任何数据源，不读取数据库相关环境变量
spring.main.banner-mode=off
server.address=127.0.0.1
server.port=18291
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
# Thymeleaf 保持 Boot 默认值（cache=true、servlet.produce-partial-output-while-processing=true）；
# 关闭"边处理边输出"的效果在 PartialOutputOffHttpTest 中单独实测
# Thymeleaf 的 TemplateEngine 在抛出前会自行以 ERROR 记录异常 message（含 cause 链 message），
# 违反"日志不记录异常 message"（docs/architecture/02-agent-development-rules.md 第 4 节），故关闭该 logger；
# 渲染失败统一由 SpikePageController 只记录异常类型链。实测见 RealHttpRenderingTest。
logging.level.org.thymeleaf.TemplateEngine=off
