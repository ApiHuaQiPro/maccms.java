      description: |
        单表名（`ids=mac_vod`）或逗号分隔串；也可用 `ids[]=` 数组形式（单值或数组）。缺失或为空 → DBT_SELECT_OPTIMIZE_TABLE / DBT_SELECT_REPAIR_TABLE；
        每项须在 26 张白名单内（规则同 `TableIdsForm.ids`）
      x-business-rule: { empty: "DBT_SELECT_OPTIMIZE_TABLE / DBT_SELECT_REPAIR_TABLE", item-whitelist: "附表 A 26 张表", maxItems: 26 }
    TemplateFnameQuery:
      name: fname
      in: query
      required: false
      schema: { $ref: "#/components/schemas/PhpValue" }
      description: |
        单值形态：template/ 区域内的相对路径，如 `./template/default_pc/html/index/index.html`（PHP 原样参数）。缺失或为空 → 不删任何文件、返回 del_ok
        （SCH-1，同 PHP）；超过 512 字符或不合规 → 该项静默跳过。POST 时表单 `fname` 存在则以表单为准（ADM-5）
      x-business-rule: { empty: "del_ok（不删）", maxLength: 512, on-fail: "静默跳过该项" }
    TemplateFnameArrayQuery:
      name: "fname[]"
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 600
        items: { $ref: "#/components/schemas/PhpText" }
      description: 数组形态（同 PHP `fname[]=`，与单值形态二选一，同时出现时按 PHP 后者覆盖前者）。空数组 → del_ok；超过 200 项 → TPL_PARAM_ERR（不删任何文件）；各项规则同单值（空项、超过 512 字符或不合规 → 静默跳过）
      x-business-rule: { maxItems: 200, on-fail: TPL_PARAM_ERR, item: "同 TemplateFnameQuery" }
    MakeAction:
      name: makeAction
      in: path
      required: true
      schema: { type: string, enum: [index, map, rss, type, topic_index, topic_info, info, label, make, opt] }
      description: 路由判别值（SCH-1，不是业务入参）：生成动作（`make` = 按 `ac` 分派，同 PHP `Make::make`；`opt` = 生成管理页本身，只读页面，忽略 `MakeParams`）；其他值不属于本 operation（ADM-1 → 404）
    MakeQuery:
      name: make
      in: query
      required: false
      style: form
      explode: true
      schema: { $ref: "#/components/schemas/MakeParams" }
      description: "`MakeParams` 各字段以独立查询参数出现（form/explode 展开，参数名即字段名）"
    CollectApiQuery:
      name: collect
      in: query
      required: false
      style: form
      explode: true
      schema: { $ref: "#/components/schemas/CollectApiParams" }
      description: "`CollectApiParams` 各字段以独立查询参数出现（form/explode 展开，参数名即字段名）"
    CollectTestQuery:
      name: collect
      in: query
      required: false
      style: form
      explode: true
      schema: { $ref: "#/components/schemas/CollectTestParams" }
      description: "`CollectTestParams` 各字段以独立查询参数出现（form/explode 展开，参数名即字段名）"
    ImagesSyncQuery:
      name: sync
      in: query
      required: false
      style: form
      explode: true
      schema: { $ref: "#/components/schemas/ImagesSyncParams" }
      description: "`ImagesSyncParams` 各字段以独立查询参数出现（form/explode 展开，参数名即字段名）"
    CounterName:
      name: counter
      in: path
      required: true
      schema: { type: string, enum: [hits, digg, score, referer] }
      description: 路由判别值（SCH-1，不是业务入参）：计数器（短地址 `/ajax/{counter}`、`.html` 后缀同样受理）；其他值不属于本 operation（基线其他 ajax 动作或 API-005）
    TimmingName:
      name: name
      in: query
      required: false
      schema: { $ref: "#/components/schemas/PhpValue" }
      description: 只执行同名任务（同基线 `TimmingService.run`：trim + urldecode 后宽松比较）；缺失、空串、`"0"` 或数组 = 全部到期任务；不匹配任何任务名 = 不执行任务（SCH-1，不是错误）
      x-business-rule: { empty: "全部到期任务", match: "任务名宽松比较" }
    TimmingEnforce:
      name: enforce
      in: query
      required: false
      schema: { $ref: "#/components/schemas/PhpValue" }
      description: 宽松比较等于 1 = 无视时间表强制执行（同基线）；缺失、其他值或数组 = 按时间表（SCH-1，不是错误）。鉴权未通过时同样 403、不执行
      x-business-rule: { enum: ["1"], otherwise: "按时间表" }
  responses:
    AdminAction:
      description: |
        后台动作类 operation 的 200（ADM-2）。Ajax → JSON：成功 `LegacyJson`（code=1），失败 `Error`（code=0，含 `ADMIN_PERMISSION_DENIED`、
        Ajax 下的 `ADMIN_SOURCE_REJECTED` 及各 operation 的 `x-error-codes-ref`）；非 Ajax → HTML 跳转提示页 `AdminJumpPage`，`msg` 文本与 JSON 相同。
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/LegacyJson"
              - $ref: "#/components/schemas/Error"
          examples:
            ok: { value: { code: 1, msg: "删除成功", data: "", url: "/admin.php/admin/database/index.html?group=import", wait: 3 } }
            locked: { value: { code: 0, msg: "已有数据库操作在执行", data: "", url: "", wait: 3 } }
            token: { value: { code: 0, msg: "请不要重复提交表单", data: "", url: "", wait: 3 } }
        text/html:
          schema: { $ref: "#/components/schemas/AdminJumpPage" }
    AdminPage:
      description: 后台页面类 operation 的 200（ADM-2）：非 Ajax → 整页 HTML；Ajax → 整页 HTML 的 JSON 字符串；无权限时为 `AdminAction` 同款失败体
      content:
        text/html:
          schema: { $ref: "#/components/schemas/AdminHtml" }
        application/json:
          schema:
            oneOf:
              - { type: string, description: 整页 HTML 的 JSON 字符串（Ajax） }
              - $ref: "#/components/schemas/Error"
    AdminUnauthenticated:
      description: 未登录，或会话里的管理员已停用/改密/删除（会话随之作废）；Ajax 请求同样 302（ADM-1，`ADMIN_UNAUTHENTICATED`）
      headers:
        Location:
          description: "`<adminEntry>/admin/index/login.html`"
          schema: { type: string }
        Cache-Control:
          schema: { type: string, enum: [no-store] }
    AdminSourceRejected:
      description: 非 Ajax 请求未通过来源校验 SRC-1/SRC-2（ADM-3，`ADMIN_SOURCE_REJECTED`）：HTTP 403 提示页（标题“跳转提示”，正文“非法请求”），不执行任何动作。Ajax 请求为 200 JSON，见 `AdminAction`
      content:
        text/html:
          schema: { $ref: "#/components/schemas/AdminHtml" }
    CounterJson:
      description: PHP JSON（字段同基线 B11 ajax 分支），`application/json; charset=utf-8`；GET/POST、ajax/非 ajax 都相同
      content:
        application/json:
          schema:
            type: object
            required: [code, msg]
            properties:
              code: { type: integer, description: "1 成功；其他值同基线 B11（如 1002 保存失败）" }
              msg: { type: string }
              data: { description: 计数结果等（同基线） }
    AdminProgress:
      description: |
        后台进度/结果页类 operation 的 200（静态生成、在线采集、定时采集、图片同步，结构同 PHP 逐行输出 + 跳转脚本）：通过入参校验 → `text/html` 进度页；
        入参校验失败、权限不足等 → ADM-2 动作类失败体（Ajax 为 JSON `Error`，非 Ajax 为 `AdminJumpPage`），`msg` 为固定文本、不含 URL 与路径
      content:
        text/html:
          schema: { $ref: "#/components/schemas/AdminHtml" }
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            param: { value: { code: 0, msg: "参数错误", data: "", url: "", wait: 3 } }
            rejected: { value: { code: 0, msg: "采集链接有误或不能为本地链接", data: "", url: "", wait: 3 } }
    CollectTestJson:
      description: API-041 的 200：PHP `return json(model('Collect')->vod($param))`，Ajax 与非 Ajax 相同
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CollectTestResult" }
          examples:
            rejected: { value: { code: 1001, msg: "采集链接有误或不能为本地链接" } }
            fetch: { value: { code: 1001, msg: "连接API接口失败，通常为服务器网络不稳定、IP被封、禁用相关函数！" } }
    MethodNotAllowed:
      description: |
        ADM-6：请求方法不在该后台路径列出的方法内（`ADMIN_METHOD_NOT_ALLOWED`）。不读会话、不校验令牌、不取锁、不执行；HEAD 请求同样 405、无正文
      headers:
        Allow:
          description: 该路径受理的方法，逗号分隔（取自 `x-method-policy`，如 `POST` 或 `GET, POST`）
          schema: { type: string }
        Cache-Control:
          schema: { type: string, enum: [no-store] }
      content:
        text/plain:
          schema: { type: string, enum: ["Method Not Allowed"] }
    TimmingForbidden:
      description: TimmingAccess 未通过（`TIMMING_FORBIDDEN`）
      headers:
        Cache-Control:
          schema: { type: string, enum: [no-store] }
      content:
        text/html:
          schema: { type: string, enum: ["定时任务入口只接受本机请求或携带部署口令的请求，未执行任何任务"] }
          example: 定时任务入口只接受本机请求或携带部署口令的请求，未执行任何任务
  schemas:
    AdminHtml:
      type: string
      description: "后台 HTML（text/html; charset=utf-8；B12 后台响应头 no-store、nosniff、noindex、Referrer-Policy=same-origin）"
    AdminJumpPage:
      type: string
      description: |
        PHP `$this->success()/error()` 的非 Ajax 形态（B12 `AdminResponses.jump` → `admin/pages/jump`）：HTTP 200，HTML 内含成功/失败标识、`msg`、
        跳转地址（成功为 `url`，失败为“返回上一页”）与 3 秒自动跳转；不回显 SQL、文件路径、连接串
    LegacyJson:
      type: object
      description: PHP `$this->success()/error()` 的 Ajax JSON（`json_encode(…, JSON_UNESCAPED_UNICODE)`），HTTP 200
      required: [code, msg]
      properties:
        code: { type: integer, enum: [0, 1], description: 1 成功、0 失败 }
        msg: { type: string }
        data: { description: 成功时的附加数据（各接口说明），失败时为空串 }
        url: { type: string }
        wait: { type: integer, example: 3 }
    Error:
      description: 本项目的错误体 = PHP 失败 JSON（code=0），见 info.description「通用约定」
      allOf:
        - $ref: "#/components/schemas/LegacyJson"
        - type: object
          properties:
            code: { type: integer, enum: [0] }
    PwdResult:
      type: object
      required: [code, msg]
      additionalProperties: false
      properties:
        code: { type: integer, enum: [1, 1001, 1002, 1003, 1011, 1012, 1013, 1014, 1021, 1022] }
        msg: { type: string, description: "成功为 ok；其他为 LegacyLang 文本或模型返回消息" }
    PhpText:
      type: string
      maxLength: 8192
      description: SCH-1 / TRN-1 单值传输形态：任意字符串（含空串、`"0"`、任意字符），只设传输上限 8192 个字符；业务条件见引用处的 `description` / `x-business-rule`
    PhpValue:
      description: |
        SCH-1 输入字段的传输形态：单值（`name=v`）或数组（`name[]=v`，≤ 600 项，可为空数组），值不做任何格式或枚举限制。
        只受理单值的字段收到数组 → 按缺失处理（ADM-5）；业务条件与失败结果见引用处
      oneOf:
        - $ref: "#/components/schemas/PhpText"
        - type: array
          maxItems: 600
          items: { $ref: "#/components/schemas/PhpText" }
    PhpLongValue:
      description: SCH-1 长文本字段（`sql`、`fcontent`）的传输形态：单值 ≤ 8388608 个字符（受表单正文 8 MiB 约束），或数组（按缺失处理）
      oneOf:
        - { type: string, maxLength: 8388608 }
        - type: array
          maxItems: 600
          items: { $ref: "#/components/schemas/PhpText" }
    PwdForm:
      type: object
      description: API-002 POST 正文；字段与规则同查询参数 `PwdMid`、`PwdType`、`PwdId`、`PwdValue`（SCH-1，不满足 → 1001）
      properties:
        mid:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          x-business-rule: { enum: ["1", "2"], on-fail: PWD_PARAM_ERR }
        type:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          x-business-rule: { enum: ["1", "4", "5"], on-fail: PWD_PARAM_ERR }
        id:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          x-business-rule: { empty: PWD_PARAM_ERR, maxLength: 20, on-fail: PWD_PARAM_ERR }
        pwd:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          x-business-rule: { empty: PWD_PARAM_ERR, maxLength: 255, on-fail: PWD_PARAM_ERR }
    TableIdsForm:
      type: object
      description: B 类（无令牌）。`ids` 也可在查询串（ADM-5）
      properties:
        ids:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          description: |
            表名数组（`ids[]=`）或逗号分隔串（单值或数组）。缺失、空串或空数组 → DBT_SELECT_OPTIMIZE_TABLE / DBT_SELECT_REPAIR_TABLE；
            每项必须是 1～64 个 `[A-Za-z0-9_]` 字符且在附表 A 的 26 张表白名单内，最多 26 项，否则 → DBT_TABLE_NOT_ALLOWED（不执行）
          x-business-rule: { empty: "DBT_SELECT_OPTIMIZE_TABLE / DBT_SELECT_REPAIR_TABLE", maxItems: 26, item-pattern: "^[A-Za-z0-9_]{1,64}$", item-whitelist: "附表 A 26 张表", on-fail: DBT_TABLE_NOT_ALLOWED }
    SqlForm:
      type: object
      description: A 类。字段都可缺失（SCH-1）：`__token__` 缺失/为空/数组 → FORM_TOKEN_INVALID；`sql` 缺失、数组或 trim 后为空 → 不执行、返回 `run_ok`
      properties:
        __token__:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          x-business-rule: { empty: FORM_TOKEN_INVALID, match: "会话令牌，一次性", on-fail: FORM_TOKEN_INVALID }
        sql:
          allOf: [{ $ref: "#/components/schemas/PhpLongValue" }]
          description: "整段 SQL；`{pre}` 替换为表前缀；不回显。超过 1 MiB（1048576 字节）→ DBT_SQL_STRUCTURE_REFUSED，不发送"
          x-business-rule: { empty: "run_ok（不执行）", maxBytes: 1048576, on-fail: DBT_SQL_STRUCTURE_REFUSED }
    BackupIdForm:
      type: object
      description: A 类（API-014）。字段都可缺失（SCH-1）：`__token__` 缺失/为空/数组 → FORM_TOKEN_INVALID；`id` 见字段说明
      properties:
        __token__:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          x-business-rule: { empty: FORM_TOKEN_INVALID, match: "会话令牌，一次性", on-fail: FORM_TOKEN_INVALID }
        id:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          description: 备份时间戳（Unix 秒）；缺失、空串、`"0"`、数组形态、不是 1～20 位十进制数字串 → DBT_SELECT_FILE
          x-business-rule: { empty: DBT_SELECT_FILE, pattern: "^[0-9]{1,20}$", on-fail: DBT_SELECT_FILE }
    ExportForm:
      type: object
      description: B 类（同 B15，无令牌；CSRF-EX-1）。字段可缺失（SCH-1）
      properties:
        ids:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          description: 同 B15 导出（表名数组或单值）；缺失、空串或空数组 → DBT_SELECT_EXPORT_TABLE；数组超过 26 项或任一项不在白名单 → DBT_TABLE_NOT_ALLOWED
          x-business-rule: { empty: DBT_SELECT_EXPORT_TABLE, maxItems: 26, item-whitelist: "附表 A 26 张表", on-fail: DBT_TABLE_NOT_ALLOWED }
        start:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          description: 同 B15（分卷游标，取值与容错按 B15）
    BackupDeleteForm:
      type: object
      description: B 类（同 B15，无令牌；CSRF-EX-1）。字段可缺失（SCH-1）
      properties:
        id:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          description: 规则同 `BackupIdQuery`（缺失、空串、`"0"`、数组、不是 1～20 位十进制数字串 → DBT_SELECT_DEL_FILE）；与查询串同时出现时以表单为准
          x-business-rule: { empty: DBT_SELECT_DEL_FILE, pattern: "^[0-9]{1,20}$", on-fail: DBT_SELECT_DEL_FILE }
    TemplateDeleteForm:
      type: object
      description: B 类（同 PHP，无令牌；CSRF-EX-1）。字段可缺失（SCH-1）：缺失、空串、空数组 → 不删任何文件、返回 del_ok
      properties:
        fname:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          description: template/ 区域内的相对路径，单值（`fname=`）或数组（`fname[]=`，最多 200 项，超过 → TPL_PARAM_ERR，不删任何文件）；空项、单项超过 512 字符或不合规 → 静默跳过
          x-business-rule: { empty: "del_ok（不删）", maxItems: 200, maxItems-on-fail: TPL_PARAM_ERR, item-maxLength: 512, item-on-fail: "静默跳过该项" }
    RecoverForm:
      type: object
      description: A 类（API-017）。字段都可缺失（SCH-1）：`__token__` 缺失/为空/数组 → FORM_TOKEN_INVALID；`run`、`target` 缺失、为空、数组或不合字段规则 → DBT_PARAM_ERR
      properties:
        __token__:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          x-business-rule: { empty: FORM_TOKEN_INVALID, match: "会话令牌，一次性", on-fail: FORM_TOKEN_INVALID }
        run:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          description: 运行记录编号（`RunId` 规则：1～64 个 `[A-Za-z0-9-]` 字符）；不满足 → DBT_PARAM_ERR
          x-business-rule: { empty: DBT_PARAM_ERR, pattern: "^[A-Za-z0-9-]{1,64}$", on-fail: DBT_PARAM_ERR }
        target:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          description: AUTO_BACKUP = 还原前自动备份（回到还原前数据）；SOURCE = 重跑原备份（完成这次还原）；缺失、为空、数组或其他值 → DBT_PARAM_ERR
          x-business-rule: { enum: [AUTO_BACKUP, SOURCE], on-fail: DBT_PARAM_ERR }
    AcknowledgeForm:
      type: object
      description: A 类（API-018）。字段都可缺失（SCH-1）：`__token__` 缺失/为空/数组 → FORM_TOKEN_INVALID；`run` 缺失、为空、数组或不合 `RunId` 规则 → DBT_PARAM_ERR
      properties:
        __token__:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          x-business-rule: { empty: FORM_TOKEN_INVALID, match: "会话令牌，一次性", on-fail: FORM_TOKEN_INVALID }
        run:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          description: 同 `RecoverForm.run`
          x-business-rule: { empty: DBT_PARAM_ERR, pattern: "^[A-Za-z0-9-]{1,64}$", on-fail: DBT_PARAM_ERR }
        accepted_as_is:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          description: 页面勾选“接受当前数据”= 1；缺失按 0；出现但不是 `"0"`/`"1"`（含空串、数组）→ DBT_PARAM_ERR；RECOVERED 以外的待处理状态必须为 1（否则 DBT_ACK_CONFIRM_REQUIRED）
          x-business-rule: { missing: "按 0", enum: ["0", "1"], on-fail: DBT_PARAM_ERR }
    TemplateSaveForm:
      type: object
      description: |
        A 类（API-020 POST）。字段都可缺失（SCH-1），判定顺序见 operation：`fpath` 规则同 GET（TPL_PARAM_ERR）→ `fname` 扩展名（TPL_EXT_NOT_ALLOWED）→
        `__token__`（FORM_TOKEN_INVALID）→ `fname` 缺失或为空（TPL_NAME_REQUIRED）→ 区域 / 内容 / 版本
      properties:
        __token__:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          x-business-rule: { empty: FORM_TOKEN_INVALID, match: "会话令牌，一次性", on-fail: FORM_TOKEN_INVALID }
        fpath:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          description: 同 GET `fpath`；缺失、空串、`"0"`、数组 → TPL_PARAM_ERR（`param_err`+`1`）；路径不合规或超过 512 字符 → TPL_PARAM_ERR（`param_err`+`2`）
          x-business-rule: { empty: "TPL_PARAM_ERR（+1）", maxLength: 512, on-fail: "TPL_PARAM_ERR（+2）" }
        fname:
          allOf: [{ $ref: "#/components/schemas/PhpValue" }]
          description: "扩展名须为 html/htm/js/xml（不符 → TPL_EXT_NOT_ALLOWED）；缺失或为空 → TPL_NAME_REQUIRED；超过 512 字符或数组 → TPL_PARAM_ERR"
          x-business-rule: { empty: TPL_NAME_REQUIRED, ext: [html, htm, js, xml], ext-on-fail: TPL_EXT_NOT_ALLOWED, maxLength: 512, on-fail: TPL_PARAM_ERR }
