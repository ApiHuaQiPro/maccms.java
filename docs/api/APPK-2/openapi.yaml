          required: true
          schema: { type: string }
          description: |
            路由判别值（SCH-1，不是业务入参）：PHP `switch` 宽松比较数值等于 5（`5`、`05`、`5.0` 等）的请求属于本 operation；缺失或其他值不属于本 operation，
