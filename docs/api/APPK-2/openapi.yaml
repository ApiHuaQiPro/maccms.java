        3. 读站点根 `application/install/sql/install.sql` 原始字节算 SHA-256，≠ `48dbe0fbd138f670919208d8bcc0ffe28d09b507c527d2a6a1a8f7b77ffa3aa4`
           → 提示“文件哈希不一致”，不执行（CRLF 检出的同一文件也走这一支）；
