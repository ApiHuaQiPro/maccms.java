  /database/import:
    servers: *adminServers
    post:
      tags: [admin-database]
      operationId: adminDatabaseImport
      x-api-id: API-014
      x-trace: [FR-9, AC-11, AC-16, DBT-3, DBT-5, V-31]
      x-csrf-class: A
      summary: 还原备份（DBT-3，只还原数据 + 还原前自动备份 + 运行记录；POST + __token__，A 类）
      description: |
        PHP 为 `import($id)`（GET/POST 均可，无令牌）。Java 本期**只接受 POST + `__token__`**（A 类）：备份列表页的“还原”按钮随 C-54 改为带
        `__token__` 的表单提交（`import.jte` 属 C-54 修改范围）。本路径只列 POST；GET、HEAD 等其他方法 → HTTP 405（ADM-6，`x-method-policy`），
        不校验令牌、不取锁、不执行。一次请求同步完成整次还原，持锁直到写完最终记录（DBT-5 ④）；不使用 PHP 分段续传参数（`part`/`start` 被忽略）。

        **顺序**：令牌（FORM_TOKEN_INVALID）→ `id` 缺失、为空、为 `"0"`、数组或不是 1～20 位十进制数字串 → DBT_SELECT_FILE（SCH-1）→ 备份目录不合法 → BAD_BACKUP_PATH → 取锁（拿不到 → DBT_LOCKED）
        → 中断判定（⑩）→ 状态检查（待处理/RECOVERED → DBT_PENDING）→ 预检（任一不通过 → 整批拒绝、0 条语句、记录不变）：
        (a) 分卷齐全（`count($list) === $last[0]`，否则 DBT_FILE_DAMAGE）；(b) 全部分卷可读、`.gz` 可解压（DBT_FILE_DAMAGE）；
        (c) 全部语句按 `mac_parse_sql` 切分完成，还原表集合（备份中 DROP TABLE/CREATE TABLE/INSERT INTO 出现过的全部表）都在 26 张白名单内
        （DBT_TABLE_NOT_ALLOWED）；(d) 站点已关闭（`site.site_status=0`，DBT_SITE_NOT_CLOSED）；(e) 自动备份目录存在且可写
        （DBT_BACKUP_DIR_NOT_WRITABLE）；(f) `backup.lock` 不存在（DBT_BACKUP_LOCK_EXISTS）。
        → 写 `RUNNING`（op=IMPORT，phase=AUTO_BACKUP，source_backup，tables）→ 还原前自动备份（导出还原表集合，记 export_files、backup_lock，
        完成后记 auto_backup 各分卷 SHA-256）→ phase=RESTORE 落盘 → 逐表 `DELETE FROM 表` + 该表全部 INSERT（每条单独一次 JDBC 调用，
        每完成一张表更新 tables_done/table_current/inserted_current）；DROP/CREATE 及其他非 DML 语句跳过并计数。

        **结果**：全部成功 → `DONE` outcome=OK，`admin/database/import_ok`（`data` 为 `ImportResult`：总数、已执行、跳过数）；自动备份失败 → `DONE`
        outcome=FAILED_BEFORE_WRITE（数据未动，DBT_AUTO_BACKUP_FAILED）；确定未生效 → `FAILED`（待处理，DBT_IMPORT_FAILED）；结果不确定 → `UNKNOWN`
        （待处理，DBT_IMPORT_UNKNOWN）。第一处失败立即停止。待处理时页面按 `x-page-banner` 提供 recover（API-017）与“我已处理”（API-018）。
        确认步骤页面写明“请确认没有其他管理员在编辑内容、api.php/timming 定时任务已停”（RISK-T19，运维约定）。
      security: [{ adminSession: [] }]
      x-permission: database/import
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/BackupIdForm" }
      responses:
        "200": { $ref: "#/components/responses/AdminAction" }
        "302": { $ref: "#/components/responses/AdminUnauthenticated" }
        "403": { $ref: "#/components/responses/AdminSourceRejected" }
      x-error-codes-ref: [FORM_TOKEN_INVALID, DBT_SELECT_FILE, BAD_BACKUP_PATH, DBT_LOCKED, DBT_PENDING, DBT_FILE_DAMAGE, DBT_TABLE_NOT_ALLOWED, DBT_SITE_NOT_CLOSED, DBT_BACKUP_DIR_NOT_WRITABLE, DBT_BACKUP_LOCK_EXISTS, DBT_AUTO_BACKUP_FAILED, DBT_IMPORT_FAILED, DBT_IMPORT_UNKNOWN, ADMIN_UNAUTHENTICATED, ADMIN_PERMISSION_DENIED, ADMIN_SOURCE_REJECTED, INPUT_LIMIT_EXCEEDED]
      x-idempotency: 无并发写入时数据结果幂等（每表先清空再插入）；服务端不自动重试；令牌一次性；失败后经 recover（API-017）恢复，不能直接再次还原（DBT_PENDING）

