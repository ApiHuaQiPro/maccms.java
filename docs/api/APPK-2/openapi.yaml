        op: { type: string, enum: [OPTIMIZE, REPAIR, SQL, IMPORT, EXPORT] }
        phase: { type: string, enum: ["", AUTO_BACKUP, RESTORE], description: 仅 IMPORT；recover 不分阶段 }
        state: { $ref: "#/components/schemas/RunState" }
        outcome: { $ref: "#/components/schemas/RunOutcome" }
        admin_id: { type: integer, minimum: 1 }
        started_at: { type: integer, description: Unix 秒 }
        finished_at: { type: integer, description: Unix 秒，未结束为 0 }
        total: { type: integer, minimum: 0 }
        executed: { type: integer, minimum: 0 }
        failed_index: { type: integer, minimum: 0 }
        failure_class: { type: string, enum: ["", NOT_APPLIED, UNKNOWN] }
        sqlstate: { type: string, maxLength: 5 }
        error_code: { type: integer }
        tables: { type: array, items: { type: string }, description: DBT-1 选中的表或 DBT-3 还原表集合 }
        table_results:
          type: array
          description: 仅 DBT-1，逐表结果
          items:
            type: object
            properties:
              table: { type: string }
              ok: { type: boolean }
              sqlstate: { type: string }
        tables_done: { type: integer, minimum: 0 }
        table_current: { type: string }
        inserted_current: { type: integer, minimum: 0 }
        source_backup: { type: string, description: "原备份时间戳前缀 Ymd-His（仅 IMPORT）" }
        auto_backup:
          type: object
          description: 仅 IMPORT；phase=RESTORE 时必然完整
          properties:
            stamp: { type: string, description: Ymd-His }
            tables: { type: array, items: { type: string } }
            files:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        export_files: { type: array, items: { type: string }, description: 本次已创建（或即将创建）的分卷文件名，中断清理只删这些 }
        backup_lock: { type: string, description: 本次写入 backup.lock 的值；清理时内容相同才删，否则记 LOCK_KEPT }
        recovery:
          type: object
          properties:
            attempt: { type: integer, minimum: 0 }
            target: { type: string, enum: ["", AUTO_BACKUP, SOURCE] }
            last_result: { type: string, enum: ["", RECOVERED, RECOVERY_FAILED, RECOVERY_UNKNOWN, INTERRUPTED] }
        interrupted:
          type: object
          description: 中断判定记录（每条记录只判定一次）
          properties:
            at: { type: integer }
            prev_state: { type: string }
            prev_phase: { type: string }
            cleanup: { type: string, enum: ["", NONE, OK, LOCK_KEPT, FAILED] }
            residual_files: { type: array, items: { type: string } }
        ack:
          type: object
          properties:
            at: { type: integer }
            admin_id: { type: integer }
            accepted_as_is: { type: boolean }

x-csrf-policy:
  description: |
    REV-API-2 / SEC-1、SEC-3、SEC-4：本文件全部后台 operation 的 CSRF 分类（ADM-3、ADM-4）。每个有副作用的后台 operation 恰好属于 A 或 B；
    C 为只读或副作用确定且不受参数影响的页面。所有后台请求都先过 SRC-1；B 类另过 SRC-2。各 operation 的 `x-csrf-class` 与本表一致。
  classes:
    A: "只接受 POST + 必填 __token__（一次性），失败 FORM_TOKEN_INVALID；该路径未列出的方法 → 405（ADM-6），不执行"
    B: "方法与入参同 PHP/B15、无令牌；SRC-1 + SRC-2 + SameSite=Strict + x-permission（CSRF-EX-1）"
    C: "只读页面 / 只读取数；SRC-1"
  operations:
    - { api: API-010, op: "GET database/index", class: C }
    - { api: API-011, op: "GET|POST database/optimize", class: B, basis: "PHP optimize($ids) 不验令牌；export.jte:44 .j-ajax $.get；C-54 不改 export 页" }
    - { api: API-012, op: "GET|POST database/repair", class: B, basis: "同 API-011（export.jte:45）" }
    - { api: API-013, op: "GET database/sql", class: C }
    - { api: API-013, op: "POST database/sql", class: A, basis: "PHP Database::sql 校验 Token" }
    - { api: API-014, op: "POST database/import", class: A, basis: "本契约补定（v1.0.0 起）：还原为最高影响写操作；import.jte 属 C-54 修改范围，按钮改为带令牌表单" }
    - { api: API-015, op: "GET database/export", class: C, note: "同 B15：不导出，固定 DBT_BACKUP_ERR（无副作用）" }
    - { api: API-015, op: "POST database/export", class: B, basis: "DBT-4“导出入参同 B15”；B15 只收 POST、无令牌" }
    - { api: API-016, op: "GET|POST database/del", class: B, basis: "C-54/DBT-4“入参与 JSON 结构不变”；import.jte:37 .j-tr-del $.get" }
    - { api: API-017, op: "POST database/recover", class: A, basis: "C-54“POST + 表单令牌”" }
    - { api: API-018, op: "POST database/acknowledge", class: A, basis: "C-54“POST + 表单令牌”" }
    - { api: API-020, op: "GET template/info", class: C }
    - { api: API-020, op: "POST template/info", class: A, basis: "PHP Template::info 与 B15 均校验令牌" }
    - { api: API-021, op: "GET|POST template/del", class: B, basis: "§6.11“删除 同 PHP”；template/index.jte:41 .j-tr-del $.get" }
    - { api: API-022, op: "GET template/wizard", class: C }
    - { api: API-023, op: "GET template/ads", class: C, note: "目录不存在时建桌面 ads 目录（同 PHP，确定性）" }
    - { api: API-024, op: "GET|POST make/*", class: B, basis: "§6.12 入参同 PHP Make；make/opt #form1 POST 提交、进度页 GET 逐页跳转" }
    - { api: API-025, op: "GET|POST index/clear", class: B, basis: "基线 AdminController.clear 不限方法" }
    - { api: API-040, op: "GET collect/api", class: B, basis: "§6.15 入参同 PHP Collect::api" }
    - { api: API-041, op: "GET|POST collect/test", class: C, note: "只取数不入库；collect-info.js $.post 调用；出站受 OUT-1 约束" }
    - { api: API-042, op: "GET collect/timing", class: B, basis: "§6.15 同 PHP Collect::timing" }
    - { api: API-043, op: "GET|POST images/sync", class: B, basis: "§6.15 同 PHP Images::sync；images/opt 表单 POST、进度页 GET" }
  exceptions:
    - id: CSRF-EX-1
      scope: B 类全部 operation
      statement: 与 PHP 相同不带表单令牌（沿用 PHP 的无令牌入参），由来源校验替代令牌作为 CSRF 防护
      upstream: 技术设计 v8（G1 PASS，Issue G1 放行评论 01a1950e-30b9-7799-a09c-53ef45eff652）对这些入口规定“入参与 JSON 结构不变 / 同 PHP / 同 B15”；来源校验为基线 D-B12-3 已有设计
      controls: ["SRC-1：Sec-Fetch-Site / Origin / Referer 必须同源（基线）", "SRC-2：B 类三个来源头都缺失也拒绝（本契约补定）", "会话 cookie SameSite=Strict、HttpOnly、Path=后台入口", "x-permission 权限码", "后台响应 Referrer-Policy: same-origin（保证自身请求带 Referer）"]
      residual: 不依赖令牌；跨站与同站其他子域发起的请求都被拒绝。已知限制：既不发 Sec-Fetch-Site、又被用户设置为完全不发 Referer 的旧浏览器无法使用 B 类动作（返回“非法请求”，不执行）
      change-path: 若评审或发起人要求 B 类也加令牌，须先修订技术设计（页面与 static/js/admin_common.js 的调用方式），再升本契约版本
    - id: CSRF-NA-1
      scope: API-001、API-002、API-007（前台公开接口）
      statement: 不依赖登录会话授权，CSRF 不适用（与 PHP 相同）；API-002 的频率由会话 5 秒与 PasswordAttempts 限制
    - id: CSRF-INS-1
      scope: API-030（安装向导第 5 步，匿名写入口）
      statement: 不属于后台 A/B/C 分类；由 INS-SEC-1～INS-SEC-5 防护：仅安装模式装配、install.lock 关闭入口、只收 POST 表单、绑定会话的一次性 `__token__`、会话 cookie SameSite=Strict

