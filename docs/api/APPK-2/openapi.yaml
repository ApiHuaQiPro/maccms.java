      summary: 定时采集（GET，B 类；从 NOT_PROVIDED 移除，按 PHP Collect::timing 调用 NET-1）
      description: 基线返回“未提供”提示（D-B19-15），本期按 PHP `Collect::timing`（Collect.php:172-179）执行；入参与输出同 PHP（B 类，SRC-1 + SRC-2）。
      security: [{ adminSession: [] }]
      x-permission: collect/timing
      responses:
        "200":
          description: 同 PHP（HTML 进度页；参数错误等按 ADM-2 动作类失败体）
          content:
            text/html:
              schema: { $ref: "#/components/schemas/AdminHtml" }
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "302": { $ref: "#/components/responses/AdminUnauthenticated" }
        "403": { $ref: "#/components/responses/AdminSourceRejected" }
      x-error-codes-ref: [ADMIN_UNAUTHENTICATED, ADMIN_PERMISSION_DENIED, ADMIN_SOURCE_REJECTED]
  /images/sync:
    servers: *adminServers
    get:
      tags: [admin-collect]
      operationId: adminImagesSync
      x-api-id: API-043
      x-trace: [FR-11, AC-13, AC-16, NET-3]
      x-csrf-class: B
      summary: 远程图片同步（GET，B 类；改调 integration.image，按 PHP Image::down_load 下载、校验并写 mac_annex）
      description: |
        入参与输出同 PHP `Images::sync`（Images.php:45 起），进度页以 GET 逐页跳转（B 类，SRC-1 + SRC-2）。下载经 `OutboundHttpClient`，
        类型与大小校验、落盘目录按 `upload` 配置，写入经 `LegacySiteFiles` 的 `upload/` 写区域；`mac_annex` 写入须在 WriteRegistry 登记（AC-16）。
      security: [{ adminSession: [] }]
      x-permission: images/sync
      responses:
        "200":
          description: 同 PHP（HTML 进度页；参数错误等按 ADM-2 动作类失败体）
          content:
            text/html:
              schema: { $ref: "#/components/schemas/AdminHtml" }
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "302": { $ref: "#/components/responses/AdminUnauthenticated" }
        "403": { $ref: "#/components/responses/AdminSourceRejected" }
      x-error-codes-ref: [ADMIN_UNAUTHENTICATED, ADMIN_PERMISSION_DENIED, ADMIN_SOURCE_REJECTED]
  /api.php/timming/index:
    get:
      tags: [api]
      operationId: apiTimming
      x-api-id: API-044
      x-trace: [FR-11, AC-13, NET-2, SEC-3]
      summary: 定时任务入口新增 collect 任务类型（鉴权 TimmingAccess 不变）
      description: |
        入参、鉴权（SEC-3，`TimmingAccess` 不改）与输出同基线 `TimmingController`（`TimmingController.java:44-53`）；任务类型 `collect` 从 `TimmingTasks`
        的拒绝项移除，按 PHP `api/Timming` 的 collect 分支调用 NET-1。其他任务类型不变。
        **地址与方法**：基线同时映射 `/api.php/timming`、`/api.php/timming/`、`/api.php/timming/index`、`/api.php/timming/index/`、`/api.php/timming/index.html`，
        方法 GET、HEAD、POST，行为相同；参数**只取查询串**（`name`、`enforce`），POST 正文忽略。HEAD 由框架按 GET 处理、无正文，不单列。
        **鉴权（服务端 `TimmingAccess.allowed` 判定，先于任何任务读取）**，满足其一即放行：
        1. OpenAPI `timmingKey`：部署方配置了 `MACCMS_TIMMING_TOKEN`（≥32 个可见 ASCII 字符），请求头 `X-Maccms-Timming-Token` 与之相同（SHA-256 摘要定长比较）；
        2. 本机回环来源：`ClientIpResolver`（B06 可信代理规则）解析出的客户端地址是回环地址，且请求带任一转发头时连接对端必须是已登记的可信代理。
           这是服务端对来源地址的判定，**不是匿名放行**：公网或局域网来源不带有效口令一律 403。OpenAPI 无法表达来源地址条件，故 `security` 只声明
           `timmingKey`；不带口令的本机调用（如本机 cron `curl http://127.0.0.1/...`）由第 2 条放行。
        两条都不满足 → HTTP 403，`TIMMING_FORBIDDEN` 固定正文，不读任务表、不执行任何任务、不回写 `timming.php`（含 `enforce=1`）。
      security: [{ timmingKey: [] }]
      x-security-note: 口令头鉴权；本机回环来源由服务端 TimmingAccess 另行放行（见 description 第 2 条），其余 403。
      parameters:
        - $ref: "#/components/parameters/TimmingName"
        - $ref: "#/components/parameters/TimmingEnforce"
      responses:
        "200":
          description: 任务执行输出（同基线，HTML）
          content:
            text/html: { schema: { type: string } }
        "403": { $ref: "#/components/responses/TimmingForbidden" }
      x-error-codes-ref: [TIMMING_FORBIDDEN]
    post:
      tags: [api]
      operationId: apiTimmingPost
      x-api-id: API-044
      x-trace: [FR-11, AC-13, NET-2, SEC-3]
      summary: 定时任务入口（POST，与 GET 等价；参数只取查询串，正文忽略）
      description: 同 GET（鉴权、403、任务行为完全相同）。
      security: [{ timmingKey: [] }]
      x-security-note: 同 GET
      parameters:
        - $ref: "#/components/parameters/TimmingName"
        - $ref: "#/components/parameters/TimmingEnforce"
      responses:
        "200":
          description: 同 GET
          content:
            text/html: { schema: { type: string } }
        "403": { $ref: "#/components/responses/TimmingForbidden" }
      x-error-codes-ref: [TIMMING_FORBIDDEN]

components:
  x-template-asset-content-types:
    css: text/css
    js: application/javascript
    png: image/png
    jpg: image/jpeg
    jpeg: image/jpeg
    gif: image/gif
    ico: image/x-icon
    svg: image/svg+xml
    webp: image/webp
    woff: font/woff
    woff2: font/woff2
    ttf: font/ttf
    eot: application/vnd.ms-fontobject
    swf: application/x-shockwave-flash
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: mac_admin_sid
      description: 后台管理员会话 cookie（B12 AdminSessions.COOKIE，Path=后台入口、HttpOnly、SameSite=Strict）；另按 admin_auth 校验 `x-permission`，所有请求另做来源校验 SRC-1（B 类写操作再加 SRC-2），A 类写操作另校验表单令牌 `__token__`（见 info.description ADM-1～ADM-5 与 `x-csrf-policy`）
    timmingKey:
      type: apiKey
      in: header
      name: X-Maccms-Timming-Token
      description: 基线 TimmingAccess（SEC-3）口令分支：请求头值等于部署配置 MACCMS_TIMMING_TOKEN（SHA-256 摘要定长比较）。本机回环来源是服务端另一条判定（API-044 description），不在 OpenAPI security 中表示；本期不改
  parameters:
    TemplateDir:
      name: dir
      in: path
      required: true
      description: template/ 下的子目录名（单段）
      schema: { type: string, minLength: 1, maxLength: 64, pattern: "^[^/\\\\:\\x00-\\x1f]+$" }
    TemplateAssetPath:
      name: assetPath
      in: path
      required: true
      description: 子目录（css/js/images/ads）起的相对路径，可含多级 `/`（OpenAPI 无法表达跨段路径参数，按 `/template/{dir}/**` 理解）
      schema: { type: string, minLength: 3, maxLength: 512 }
      example: css/style.css
    PwdMid:
      name: mid
      in: query
      required: true
      schema: { type: string, enum: ["1", "2"] }
      description: 1 视频、2 文章；不在枚举内 → 1001
    PwdType:
      name: type
      in: query
      required: true
      schema: { type: string, enum: ["1", "4", "5"] }
      description: 1 详情、4 播放、5 下载（mid=2 时只要求在枚举内）；不在枚举内 → 1001
    PwdId:
      name: id
      in: query
      required: true
      schema: { type: string, maxLength: 20 }
      description: 内容 ID；空或 "0" → 1001
    PwdValue:
      name: pwd
      in: query
      required: true
      schema: { type: string, maxLength: 255 }
      description: 访问密码；空或 "0" → 1001
    BackupIdQuery:
      name: id
      in: query
      required: true
      schema: { type: string, maxLength: 20, pattern: "^[0-9]+$" }
      description: 备份时间戳（Unix 秒，B15 列表中的 id）。服务端对缺失、空串、"0"、非数字串一律返回 DBT_SELECT_DEL_FILE（不取锁、不删文件）
    BackupIdQueryOptional:
      name: id
      in: query
      required: false
      schema: { type: string, maxLength: 20, pattern: "^[0-9]+$" }
      description: POST 时可选；表单 `id` 存在时以表单为准（ADM-5）。表单与查询串都没有有效值 → DBT_SELECT_DEL_FILE
    TableIdsQuery:
      name: ids
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: string
        maxLength: 2048
      description: 单表名（`ids=mac_vod`）或逗号分隔串；也可用 `ids[]=` 数组形式。为空 → DBT_SELECT_OPTIMIZE_TABLE / DBT_SELECT_REPAIR_TABLE；每项须在 26 张白名单内
    TemplateFnameQuery:
      name: fname
      in: query
      required: true
      schema: { type: string, maxLength: 512 }
      description: template/ 区域内的相对路径，如 `./template/default_pc/html/index/index.html`（PHP 原样参数）；也可 `fname[]=` 多值。为空时按 PHP 返回 del_ok、不删任何文件
    TemplateFnameQueryOptional:
      name: fname
      in: query
      required: false
      schema: { type: string, maxLength: 512 }
      description: POST 时可选；表单 `fname` 存在时以表单为准（ADM-5）
    CounterName:
      name: counter
      in: path
      required: true
      schema: { type: string, enum: [hits, digg, score, referer] }
      description: 计数器（短地址 `/ajax/{counter}`、`.html` 后缀同样受理）
    TimmingName:
      name: name
      in: query
      required: false
      schema: { type: string, maxLength: 64 }
      description: 只执行该名称的任务（同基线）；不传为全部到期任务
    TimmingEnforce:
      name: enforce
      in: query
      required: false
      schema: { type: string, enum: ["0", "1"] }
      description: 1 = 无视时间表强制执行（同基线；鉴权未通过时同样 403、不执行）
  responses:
    AdminAction:
      description: |
        后台动作类 operation 的 200（ADM-2）。Ajax → JSON：成功 `LegacyJson`（code=1），失败 `Error`（code=0，含 `ADMIN_PERMISSION_DENIED`、
        Ajax 下的 `ADMIN_SOURCE_REJECTED` 及各 operation 的 `x-error-codes-ref`）；非 Ajax → HTML 跳转提示页 `AdminJumpPage`，`msg` 文本与 JSON 相同。
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/LegacyJson"
              - $ref: "#/components/schemas/Error"
          examples:
            ok: { value: { code: 1, msg: "删除成功", data: "", url: "/admin.php/admin/database/index.html?group=import", wait: 3 } }
            locked: { value: { code: 0, msg: "已有数据库操作在执行", data: "", url: "", wait: 3 } }
            token: { value: { code: 0, msg: "请不要重复提交表单", data: "", url: "", wait: 3 } }
        text/html:
          schema: { $ref: "#/components/schemas/AdminJumpPage" }
    AdminPage:
      description: 后台页面类 operation 的 200（ADM-2）：非 Ajax → 整页 HTML；Ajax → 整页 HTML 的 JSON 字符串；无权限时为 `AdminAction` 同款失败体
      content:
        text/html:
          schema: { $ref: "#/components/schemas/AdminHtml" }
        application/json:
          schema:
            oneOf:
              - { type: string, description: 整页 HTML 的 JSON 字符串（Ajax） }
              - $ref: "#/components/schemas/Error"
    AdminUnauthenticated:
      description: 未登录，或会话里的管理员已停用/改密/删除（会话随之作废）；Ajax 请求同样 302（ADM-1，`ADMIN_UNAUTHENTICATED`）
      headers:
        Location:
          description: "`<adminEntry>/admin/index/login.html`"
          schema: { type: string }
        Cache-Control:
          schema: { type: string, enum: [no-store] }
    AdminSourceRejected:
      description: 非 Ajax 请求未通过来源校验 SRC-1/SRC-2（ADM-3，`ADMIN_SOURCE_REJECTED`）：HTTP 403 提示页（标题“跳转提示”，正文“非法请求”），不执行任何动作。Ajax 请求为 200 JSON，见 `AdminAction`
      content:
        text/html:
          schema: { $ref: "#/components/schemas/AdminHtml" }
    CounterJson:
      description: PHP JSON（字段同基线 B11 ajax 分支），`application/json; charset=utf-8`；GET/POST、ajax/非 ajax 都相同
      content:
        application/json:
          schema:
            type: object
            required: [code, msg]
            properties:
              code: { type: integer, description: "1 成功；其他值同基线 B11（如 1002 保存失败）" }
              msg: { type: string }
              data: { description: 计数结果等（同基线） }
    TimmingForbidden:
      description: TimmingAccess 未通过（`TIMMING_FORBIDDEN`）
      headers:
        Cache-Control:
          schema: { type: string, enum: [no-store] }
      content:
        text/html:
          schema: { type: string, enum: ["定时任务入口只接受本机请求或携带部署口令的请求，未执行任何任务"] }
          example: 定时任务入口只接受本机请求或携带部署口令的请求，未执行任何任务
  schemas:
    AdminHtml:
      type: string
      description: "后台 HTML（text/html; charset=utf-8；B12 后台响应头 no-store、nosniff、noindex、Referrer-Policy=same-origin）"
    AdminJumpPage:
      type: string
      description: |
        PHP `$this->success()/error()` 的非 Ajax 形态（B12 `AdminResponses.jump` → `admin/pages/jump`）：HTTP 200，HTML 内含成功/失败标识、`msg`、
        跳转地址（成功为 `url`，失败为“返回上一页”）与 3 秒自动跳转；不回显 SQL、文件路径、连接串
    LegacyJson:
      type: object
      description: PHP `$this->success()/error()` 的 Ajax JSON（`json_encode(…, JSON_UNESCAPED_UNICODE)`），HTTP 200
      required: [code, msg]
      properties:
        code: { type: integer, enum: [0, 1], description: 1 成功、0 失败 }
        msg: { type: string }
        data: { description: 成功时的附加数据（各接口说明），失败时为空串 }
        url: { type: string }
        wait: { type: integer, example: 3 }
    Error:
      description: 本项目的错误体 = PHP 失败 JSON（code=0），见 info.description「通用约定」
      allOf:
        - $ref: "#/components/schemas/LegacyJson"
        - type: object
          properties:
            code: { type: integer, enum: [0] }
    PwdResult:
      type: object
      required: [code, msg]
      additionalProperties: false
      properties:
        code: { type: integer, enum: [1, 1001, 1002, 1003, 1011, 1012, 1013, 1014, 1021, 1022] }
        msg: { type: string, description: "成功为 ok；其他为 LegacyLang 文本或模型返回消息" }
    PwdForm:
      type: object
      properties:
        mid: { type: string, enum: ["1", "2"] }
        type: { type: string, enum: ["1", "4", "5"] }
        id: { type: string, maxLength: 20 }
        pwd: { type: string, maxLength: 255 }
    TableIdsForm:
      type: object
      description: B 类（无令牌）。`ids` 也可在查询串（ADM-5）
      properties:
        ids:
          description: 表名数组（`ids[]=`）或逗号分隔串；每项必须在附表 A 的 26 张表白名单内，最多 26 项
          oneOf:
            - type: array
              maxItems: 26
              items: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9_]+$" }
            - type: string
              maxLength: 2048
    SqlForm:
      type: object
      required: [__token__, sql]
      properties:
        __token__: { type: string, maxLength: 64 }
        sql: { type: string, maxLength: 1048576, description: "整段 SQL；`{pre}` 替换为表前缀；不回显" }
    BackupIdForm:
      type: object
      required: [__token__, id]
      properties:
        __token__: { type: string, maxLength: 64 }
        id: { type: string, maxLength: 20, pattern: "^[0-9]+$", description: 备份时间戳（Unix 秒） }
    ExportForm:
      type: object
      description: B 类（同 B15，无令牌；CSRF-EX-1）
      properties:
        ids:
          description: 同 B15 导出（表名数组或单值）
          oneOf:
            - type: array
              maxItems: 26
              items: { type: string, maxLength: 64 }
            - type: string
              maxLength: 2048
        start: { type: string, maxLength: 20, description: 同 B15 }
    BackupDeleteForm:
      type: object
      description: B 类（同 B15，无令牌；CSRF-EX-1）
      properties:
        id: { type: string, maxLength: 20, pattern: "^[0-9]+$", description: 备份时间戳（Unix 秒）；与查询串同时出现时以表单为准 }
    TemplateDeleteForm:
      type: object
      description: B 类（同 PHP，无令牌；CSRF-EX-1）
      properties:
        fname:
          description: template/ 区域内的相对路径，单值或数组（`fname[]=`）
          oneOf:
            - { type: string, maxLength: 512 }
            - { type: array, maxItems: 200, items: { type: string, maxLength: 512 } }
    RecoverForm:
      type: object
      required: [__token__, run, target]
      properties:
        __token__: { type: string, maxLength: 64 }
        run: { $ref: "#/components/schemas/RunId" }
        target:
          type: string
          enum: [AUTO_BACKUP, SOURCE]
          description: AUTO_BACKUP = 还原前自动备份（回到还原前数据）；SOURCE = 重跑原备份（完成这次还原）
    AcknowledgeForm:
      type: object
      required: [__token__, run]
      properties:
        __token__: { type: string, maxLength: 64 }
        run: { $ref: "#/components/schemas/RunId" }
        accepted_as_is:
          type: string
          enum: ["0", "1"]
          description: 页面勾选“接受当前数据”= 1；RECOVERED 以外的待处理状态必须为 1
    TemplateSaveForm:
      type: object
      required: [__token__, fname, fcontent]
      properties:
        __token__: { type: string, maxLength: 64 }
        fpath: { type: string, maxLength: 512 }
        fname: { type: string, maxLength: 512, description: "扩展名须为 html/htm/js/xml" }
        fcontent: { type: string, maxLength: 2097152 }
        fversion: { type: string, maxLength: 128, description: 编辑页带出的文件版本（B15 冲突检查，基线参数名），不一致 → TPL_VERSION_CONFLICT }
    RunId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9-]+$"
      description: 运行记录编号（服务端生成，不透明）
    ImportResult:
      type: object
      description: 还原 / recover 的结果数据（LegacyJson.data），页面同样展示这些值
      properties:
        run: { $ref: "#/components/schemas/RunId" }
        state: { $ref: "#/components/schemas/RunState" }
        outcome: { $ref: "#/components/schemas/RunOutcome" }
        total: { type: integer, minimum: 0, description: 将执行的语句总数 }
        executed: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0, description: 跳过的 DROP/CREATE 等非 DML 语句数 }
        failed_index: { type: integer, minimum: 0, description: 失败语句序号（1 起），无失败为 0 }
        failed_table: { type: string }
        failure_class: { type: string, enum: ["", NOT_APPLIED, UNKNOWN] }
        sqlstate: { type: string, maxLength: 5 }
        tables_done: { type: integer, minimum: 0 }
        auto_backup_stamp: { type: string, description: "Ymd-His，DBT-3 首次运行生成；recover 不新建" }
    RunState:
      type: string
      enum: [RUNNING, DONE, FAILED, UNKNOWN, INTERRUPTED, RECOVERING, RECOVERED, RECOVERY_FAILED, RECOVERY_UNKNOWN, RECOVERY_INTERRUPTED]
      description: 待处理 = FAILED、UNKNOWN、INTERRUPTED、RECOVERY_FAILED、RECOVERY_UNKNOWN、RECOVERY_INTERRUPTED、RECOVERED
    RunOutcome:
      type: string
      enum: ["", OK, PARTIAL, FAILED, FAILED_BEFORE_WRITE, INTERRUPTED, INTERRUPTED_BEFORE_WRITE]
      description: 只在 state=DONE 时有意义；PARTIAL 仅 DBT-1（有表失败，详见 table_results）
    DatabaseRun:
      type: object
      description: |
        运行记录文件 `application/data/backup/database/dbtool-run.json`（C-73）的格式。**不是 HTTP 响应**，登记在此供测试与评审核对
        （V-31）；只在持锁时读后写（`LegacySiteFiles.replace` 原子替换），页面可不持锁只读。不写 SQL 原文、数据值、连接串。
      required: [run, op, state, admin_id, started_at]
      properties:
        run: { $ref: "#/components/schemas/RunId" }
        op: { type: string, enum: [OPTIMIZE, REPAIR, SQL, IMPORT, EXPORT] }
        phase: { type: string, enum: ["", AUTO_BACKUP, RESTORE], description: 仅 IMPORT；recover 不分阶段 }
        state: { $ref: "#/components/schemas/RunState" }
        outcome: { $ref: "#/components/schemas/RunOutcome" }
        admin_id: { type: integer, minimum: 1 }
        started_at: { type: integer, description: Unix 秒 }
        finished_at: { type: integer, description: Unix 秒，未结束为 0 }
        total: { type: integer, minimum: 0 }
        executed: { type: integer, minimum: 0 }
        failed_index: { type: integer, minimum: 0 }
        failure_class: { type: string, enum: ["", NOT_APPLIED, UNKNOWN] }
        sqlstate: { type: string, maxLength: 5 }
        error_code: { type: integer }
        tables: { type: array, items: { type: string }, description: DBT-1 选中的表或 DBT-3 还原表集合 }
        table_results:
          type: array
          description: 仅 DBT-1，逐表结果
          items:
            type: object
            properties:
              table: { type: string }
              ok: { type: boolean }
              sqlstate: { type: string }
        tables_done: { type: integer, minimum: 0 }
        table_current: { type: string }
        inserted_current: { type: integer, minimum: 0 }
        source_backup: { type: string, description: "原备份时间戳前缀 Ymd-His（仅 IMPORT）" }
        auto_backup:
          type: object
          description: 仅 IMPORT；phase=RESTORE 时必然完整
          properties:
            stamp: { type: string, description: Ymd-His }
            tables: { type: array, items: { type: string } }
            files:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        export_files: { type: array, items: { type: string }, description: 本次已创建（或即将创建）的分卷文件名，中断清理只删这些 }
        backup_lock: { type: string, description: 本次写入 backup.lock 的值；清理时内容相同才删，否则记 LOCK_KEPT }
        recovery:
          type: object
          properties:
            attempt: { type: integer, minimum: 0 }
            target: { type: string, enum: ["", AUTO_BACKUP, SOURCE] }
            last_result: { type: string, enum: ["", RECOVERED, RECOVERY_FAILED, RECOVERY_UNKNOWN, INTERRUPTED] }
        interrupted:
          type: object
          description: 中断判定记录（每条记录只判定一次）
          properties:
            at: { type: integer }
            prev_state: { type: string }
            prev_phase: { type: string }
            cleanup: { type: string, enum: ["", NONE, OK, LOCK_KEPT, FAILED] }
            residual_files: { type: array, items: { type: string } }
        ack:
          type: object
          properties:
            at: { type: integer }
            admin_id: { type: integer }
            accepted_as_is: { type: boolean }

x-csrf-policy:
  description: |
    REV-API-2 / SEC-1、SEC-3、SEC-4：本文件全部后台 operation 的 CSRF 分类（ADM-3、ADM-4）。每个有副作用的后台 operation 恰好属于 A 或 B；
    C 为只读或副作用确定且不受参数影响的页面。所有后台请求都先过 SRC-1；B 类另过 SRC-2。各 operation 的 `x-csrf-class` 与本表一致。
  classes:
    A: "只接受 POST + 必填 __token__（一次性），失败 FORM_TOKEN_INVALID；GET → 各 operation 写明的固定失败体，不执行"
    B: "方法与入参同 PHP/B15、无令牌；SRC-1 + SRC-2 + SameSite=Strict + x-permission（CSRF-EX-1）"
    C: "只读页面 / 只读取数；SRC-1"
  operations:
    - { api: API-010, op: "GET database/index", class: C }
    - { api: API-011, op: "GET|POST database/optimize", class: B, basis: "PHP optimize($ids) 不验令牌；export.jte:44 .j-ajax $.get；C-54 不改 export 页" }
    - { api: API-012, op: "GET|POST database/repair", class: B, basis: "同 API-011（export.jte:45）" }
    - { api: API-013, op: "GET database/sql", class: C }
    - { api: API-013, op: "POST database/sql", class: A, basis: "PHP Database::sql 校验 Token" }
    - { api: API-014, op: "POST database/import", class: A, basis: "本契约补定（v1.0.0 起）：还原为最高影响写操作；import.jte 属 C-54 修改范围，按钮改为带令牌表单" }
    - { api: API-015, op: "POST database/export", class: B, basis: "DBT-4“导出入参同 B15”；B15 只收 POST、无令牌" }
    - { api: API-016, op: "GET|POST database/del", class: B, basis: "C-54/DBT-4“入参与 JSON 结构不变”；import.jte:37 .j-tr-del $.get" }
    - { api: API-017, op: "POST database/recover", class: A, basis: "C-54“POST + 表单令牌”" }
    - { api: API-018, op: "POST database/acknowledge", class: A, basis: "C-54“POST + 表单令牌”" }
    - { api: API-020, op: "GET template/info", class: C }
    - { api: API-020, op: "POST template/info", class: A, basis: "PHP Template::info 与 B15 均校验令牌" }
    - { api: API-021, op: "GET|POST template/del", class: B, basis: "§6.11“删除 同 PHP”；template/index.jte:41 .j-tr-del $.get" }
    - { api: API-022, op: "GET template/wizard", class: C }
    - { api: API-023, op: "GET template/ads", class: C, note: "目录不存在时建桌面 ads 目录（同 PHP，确定性）" }
    - { api: API-024, op: "GET make/*", class: B, basis: "§6.12 入参同 PHP Make；进度页 GET 逐页跳转" }
    - { api: API-025, op: "GET|POST index/clear", class: B, basis: "基线 AdminController.clear 不限方法" }
    - { api: API-040, op: "GET collect/api", class: B, basis: "§6.15 入参同 PHP Collect::api" }
    - { api: API-041, op: "GET collect/test", class: C }
    - { api: API-042, op: "GET collect/timing", class: B, basis: "§6.15 同 PHP Collect::timing" }
    - { api: API-043, op: "GET images/sync", class: B, basis: "§6.15 同 PHP Images::sync" }
  exceptions:
    - id: CSRF-EX-1
      scope: B 类全部 operation
      statement: 与 PHP 相同不带表单令牌（沿用 PHP 的无令牌入参），由来源校验替代令牌作为 CSRF 防护
      upstream: 技术设计 v8（G1 PASS，Issue G1 放行评论 01a1950e-30b9-7799-a09c-53ef45eff652）对这些入口规定“入参与 JSON 结构不变 / 同 PHP / 同 B15”；来源校验为基线 D-B12-3 已有设计
      controls: ["SRC-1：Sec-Fetch-Site / Origin / Referer 必须同源（基线）", "SRC-2：B 类三个来源头都缺失也拒绝（本契约补定）", "会话 cookie SameSite=Strict、HttpOnly、Path=后台入口", "x-permission 权限码", "后台响应 Referrer-Policy: same-origin（保证自身请求带 Referer）"]
      residual: 不依赖令牌；跨站与同站其他子域发起的请求都被拒绝。已知限制：既不发 Sec-Fetch-Site、又被用户设置为完全不发 Referer 的旧浏览器无法使用 B 类动作（返回“非法请求”，不执行）
      change-path: 若评审或发起人要求 B 类也加令牌，须先修订技术设计（页面与 static/js/admin_common.js 的调用方式），再升本契约版本
    - id: CSRF-NA-1
      scope: API-001、API-002、API-007（前台公开接口）
      statement: 不依赖登录会话授权，CSRF 不适用（与 PHP 相同）；API-002 的频率由会话 5 秒与 PasswordAttempts 限制

x-interrupt-transitions:
  description: DBT-5 ⑩：任一取锁入口（optimize、repair、sql、import、recover、acknowledge、export、del 与页面 probe）读到 RUNNING/RECOVERING 时的唯一改写，完成后才继续本次动作
  rows:
    - { match: "op=OPTIMIZE|REPAIR, state=RUNNING", to: "DONE, outcome=INTERRUPTED（保留 tables_done）", cleanup: 无, pending: false, page: "灰色说明“上次优化/修复在第 k 张表中断，可重新执行”；无 recover/我已处理", log: WARN, verify: "V-31 ⑪" }
    - { match: "op=SQL, state=RUNNING", to: INTERRUPTED, cleanup: 无, pending: true, page: "红色提示条“该语句可能已生效，也可能未生效”+ 核对步骤；只有“我已处理”（须勾选接受当前数据）", log: ERROR, verify: "V-31 ⑫" }
    - { match: "op=IMPORT, phase=AUTO_BACKUP, state=RUNNING", to: "DONE, outcome=INTERRUPTED_BEFORE_WRITE", cleanup: "删 export_files；backup.lock 内容等于 backup_lock 时删", pending: false, page: "灰色说明“上次还原在备份阶段中断，数据未改动，可重新发起”", log: "WARN（清理失败 ERROR）", verify: "V-31 ⑬" }
    - { match: "op=IMPORT, phase=RESTORE, state=RUNNING", to: INTERRUPTED, cleanup: "无（自动备份保留）", pending: true, page: "红色提示条（已完成表、当前表、自动备份时间戳）；recover（AUTO_BACKUP/SOURCE）+ 我已处理（须勾选）", log: ERROR, verify: "V-31 ⑭" }
    - { match: "op=EXPORT, state=RUNNING", to: "DONE, outcome=INTERRUPTED", cleanup: "同 IMPORT/AUTO_BACKUP", pending: false, page: "灰色说明“上次导出中断，不完整的分卷已删除，请重新导出”；清理为 LOCK_KEPT/FAILED 时列出残留文件并提示部署方手动处理", log: "WARN（清理失败 ERROR）", verify: "V-31 ⑮" }
    - { match: "op=IMPORT, state=RECOVERING", to: "RECOVERY_INTERRUPTED（attempt 不变，last_result=INTERRUPTED）", cleanup: 无, pending: true, page: "同 IMPORT/RESTORE", log: ERROR, verify: "V-31 ⑯" }

x-page-banner:
  description: 数据库工具各页面（API-010、API-013 GET）按运行记录显示的提示条与按钮；按钮只按状态机出现
  rows:
    - { when: "probe 拿不到锁", banner: "执行中", buttons: [] }
    - { when: "无记录 / DONE（outcome=OK|FAILED|PARTIAL|FAILED_BEFORE_WRITE）", banner: "无（或上次结果的一行说明）", buttons: [] }
    - { when: "DONE + outcome=INTERRUPTED|INTERRUPTED_BEFORE_WRITE", banner: "灰色说明（见 x-interrupt-transitions）", buttons: [] }
    - { when: "SQL：UNKNOWN / INTERRUPTED", banner: "红色：操作类型、开始时间、管理员、失败分类、核对步骤", buttons: ["我已处理（须勾选接受当前数据）"] }
    - { when: "IMPORT：FAILED / UNKNOWN / INTERRUPTED / RECOVERY_FAILED / RECOVERY_UNKNOWN / RECOVERY_INTERRUPTED", banner: "红色：操作类型、开始时间、管理员、失败序号与分类、已完成表/当前表、自动备份时间戳、恢复次数与最近结果、恢复步骤（DBT-5 ⑦）", buttons: ["recover：还原前自动备份", "recover：重跑原备份", "我已处理（须勾选接受当前数据）"] }
    - { when: "IMPORT：RECOVERED", banner: "红色：恢复已完成，请核对行数后确认", buttons: ["我已处理"] }

