      x-business-rule: { length: "1～64", pattern: "^[^/\\:\x00-\x1f]+$", exists: "template/ 下实际存在的子目录", on-fail: "404 TEMPLATE_ASSET_NOT_FOUND" }
    TemplateAssetPath:
      name: assetPath
      in: path
      required: true
      description: |
        子目录（css/js/images/ads）起的相对路径，可含多级 `/`（OpenAPI 无法表达跨段路径参数，按 `/template/{dir}/**` 理解）。传输形态不设格式（SCH-1）；
        长度不在 3～512 或不满足 operation 放行条件第 2～5 条 → 404。
      schema: { type: string, maxLength: 8192 }
      x-business-rule: { length: "3～512", first-segment: [css, js, images, ads], on-fail: "404 TEMPLATE_ASSET_NOT_FOUND" }
