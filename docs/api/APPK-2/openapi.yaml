    summary: 前台 HTML 页通用响应头与 CSP（OP-T6=b）
    x-trace: [FR-5, AC-5, AC-17, ALIGN-5, DEC-11, OP-T6, V-32]
    applies-to: 前台所有返回 HTML 的响应——全部页面控制器、跳转/提示页（JumpPages）、站点关闭页、404 页、验证码页、浏览器提示页、站点异常页（SitePageResponses 是唯一出口，C-70）
    headers:
      Content-Type: "text/html; charset=utf-8（常量只用 SiteRequests.HTML_UTF8）"
      Content-Security-Policy: "object-src 'none'; base-uri 'self'; frame-ancestors 'self'（逐字，唯一来源 C-75 SiteSecurityHeaders.frontPolicy()，恒有值，没有过渡值）"
    rules:
      - 所有前台 HTML 页都发同一条 CSP，不再有会员页 nonce、播放器 frame 策略（PlayerFramePolicy）、支付网关 form-action 变体。
      - CSP 不限制脚本：模板内联脚本（如 public/jump.html 倒计时）、player.js 的 document.write、支付网关自动提交表单都能运行（V-32 ⑥）。
      - 站点不能被其他源用 iframe 嵌入（frame-ancestors 'self'）；同源嵌入允许。
      - 非 HTML 响应（ajax JSON、RSS/地图 XML、/template/** 静态资源、/api/v1/**）不加该头；RSS/地图与 ajax 的 Content-Type 按 PHP 控制器（PRE-2 基线记录值）。
      - 缓存头按 SitePageResponses 的 CacheMode（NO_CACHE / NO_STORE）与 Vary 规则（C-70、§4.11 方案 E）；本期不改缓存头取值。
