  /index.php/ajax/pwd:
    get:
      tags: [site]
      operationId: checkWatchPassword
      x-api-id: API-002
      x-trace: [FR-5, AC-5, AC-17, ALIGN-4, SEC-9, OP-T4, V-30]
      summary: 观看/播放/下载/文章密码校验（恢复 PHP ajax/pwd，保留 PasswordAttempts，OP-T4=a）
      description: |
        恢复 PHP `Ajax::pwd`（Ajax.php:400-456），基线 Java 此地址返回 404、改用签名 cookie 的表单校验（随 C-68 移除调用点）。
        短地址 `/ajax/pwd` 与 `.html` 后缀按现有前台路由同样受理，行为相同。参数来源同 PHP `$this->_param`/`input('param.')`
        （路由 + GET + POST 合并），所以 GET 与 POST 等价。

        **判定顺序（逐条按 PHP，第一个命中即返回，HTTP 恒为 200）**
        1. 参数校验：`id` 为空、`pwd` 为空、`mid` ∉ {1,2}、`type` ∉ {1,4,5} → 1001（PHP `empty()` 语义：`"0"` 视为空）。
        2. 本会话已通过同一 `mid-type-id` → 1002。
        3. 会话 `last_pwd` 距今 < 5 秒 → 1003；**每次进入这一步都刷新 `last_pwd`（含被拒的调用）**，同 `mac_get_time_span`。
        4. （OP-T4=a / SEC-9）`PasswordAttempts.tryAcquire(用途, id)` 不通过 → 1003（与第 3 步相同的 JSON），不查库。
           限流口径沿用基线常量：同一“用途 + 内容 id”每 60 秒最多 10 次，全站合计每秒最多 30 次，键数上限 10000（不记录 IP、会话或密码）。
           与 PHP 的差异只在“哪一次请求得到 1003”，判 `排除-SEC-9`。
        5. 取数：`mid=1` 查视频（`vod_status` 等过滤同 PHP `Vod::infoData`），失败 → 1011；`mid=2` 查文章，失败 → 1021；
           `msg` 为模型返回的消息。
        6. 比对：`mid=1,type=1` 比 `vod_pwd` → 不符 1012；`type=4` 比 `vod_pwd_play` → 1013；`type=5` 比 `vod_pwd_down` → 1014；
           `mid=2` 比 `art_pwd`（不看 type）→ 1022。比较为 PHP `!=` 弱比较语义（ZValue 规则，数字串按数值比较）。
        7. 通过：会话写 `mid-type-id = '1'`，返回 `{"code":1,"msg":"ok"}`。
        “已通过”与 `last_pwd` 存进程内会话（SessionStore），不进库、不参与页面对照。前端（模板包 JS）据 `code==1` 刷新页面，
        页面控制器按会话“已通过”放行详情/播放/下载内容。
      security: []
      x-security-note: 观看密码本身就是游客的访问凭证，与 PHP 相同无需登录；频率由第 3、4 步限制。
      parameters:
        - $ref: "#/components/parameters/PwdMid"
        - $ref: "#/components/parameters/PwdType"
        - $ref: "#/components/parameters/PwdId"
        - $ref: "#/components/parameters/PwdValue"
      responses:
        "200":
          description: PHP JSON（成功或任一业务错误码，见 `x-error-codes` 1001～1022）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PwdResult" }
              examples:
                ok: { value: { code: 1, msg: ok } }
                frequently: { value: { code: 1003, msg: "<lang index/pwd_frequently>" } }
                wrong: { value: { code: 1012, msg: "<lang pass_err>" } }
      x-error-codes-ref: [PWD_PARAM_ERR, PWD_ALREADY_PASSED, PWD_TOO_FREQUENT, PWD_VOD_NOT_FOUND, PWD_VOD_WRONG, PWD_VOD_PLAY_WRONG, PWD_VOD_DOWN_WRONG, PWD_ART_NOT_FOUND, PWD_ART_WRONG]
      x-idempotency: 非幂等（刷新 last_pwd、消耗 PasswordAttempts 配额、通过时写会话）；客户端不得自动重试。
    post:
      tags: [site]
      operationId: checkWatchPasswordPost
      x-api-id: API-002
      x-trace: [FR-5, AC-5, AC-17, ALIGN-4, SEC-9, OP-T4, V-30]
      summary: 观看密码校验（POST，与 GET 等价）
      security: []
      x-security-note: 同 GET
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/PwdForm" }
      responses:
        "200":
          description: 同 GET
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PwdResult" }
      x-error-codes-ref: [PWD_PARAM_ERR, PWD_ALREADY_PASSED, PWD_TOO_FREQUENT, PWD_VOD_NOT_FOUND, PWD_VOD_WRONG, PWD_VOD_PLAY_WRONG, PWD_VOD_DOWN_WRONG, PWD_ART_NOT_FOUND, PWD_ART_WRONG]
