components:
  x-template-asset-content-types:
    css: text/css
    js: application/javascript
    png: image/png
    jpg: image/jpeg
    jpeg: image/jpeg
    gif: image/gif
    ico: image/x-icon
    svg: image/svg+xml
    webp: image/webp
    woff: font/woff
    woff2: font/woff2
    ttf: font/ttf
    eot: application/vnd.ms-fontobject
    swf: application/x-shockwave-flash
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: mac_admin_sid
      description: 后台管理员会话 cookie（B12 AdminSessions.COOKIE，Path=后台入口、HttpOnly、SameSite=Strict）；另按 admin_auth 校验 `x-permission`，写操作另校验表单令牌 `__token__`
    timmingKey:
      type: apiKey
      in: header
      name: X-Maccms-Timming-Token
      description: 基线 TimmingAccess（SEC-3）：请求头口令等于 MACCMS_TIMMING_TOKEN，或客户端为本机回环（可信代理规则同 B06）；本期不改
  parameters:
    TemplateDir:
      name: dir
      in: path
      required: true
      description: template/ 下的子目录名（单段）
      schema: { type: string, minLength: 1, maxLength: 64, pattern: "^[^/\\\\:\\x00-\\x1f]+$" }
    TemplateAssetPath:
      name: assetPath
      in: path
      required: true
      description: 子目录（css/js/images/ads）起的相对路径，可含多级 `/`（OpenAPI 无法表达跨段路径参数，按 `/template/{dir}/**` 理解）
      schema: { type: string, minLength: 3, maxLength: 512 }
      example: css/style.css
    PwdMid:
      name: mid
      in: query
      required: true
      schema: { type: string, enum: ["1", "2"] }
      description: 1 视频、2 文章；不在枚举内 → 1001
    PwdType:
      name: type
      in: query
      required: true
      schema: { type: string, enum: ["1", "4", "5"] }
      description: 1 详情、4 播放、5 下载（mid=2 时只要求在枚举内）；不在枚举内 → 1001
    PwdId:
      name: id
      in: query
      required: true
      schema: { type: string, maxLength: 20 }
      description: 内容 ID；空或 "0" → 1001
    PwdValue:
      name: pwd
      in: query
      required: true
      schema: { type: string, maxLength: 255 }
      description: 访问密码；空或 "0" → 1001
    BackupIdQuery:
      name: id
      in: query
      required: true
      schema: { type: string, maxLength: 20, pattern: "^[0-9]*$" }
      description: 备份时间戳（Unix 秒，B15 列表中的 id）；POST 表单字段同名同义
  schemas:
    LegacyJson:
      type: object
      description: PHP `$this->success()/error()` 的 Ajax JSON（`json_encode(…, JSON_UNESCAPED_UNICODE)`），HTTP 200
      required: [code, msg]
      properties:
        code: { type: integer, enum: [0, 1], description: 1 成功、0 失败 }
        msg: { type: string }
        data: { description: 成功时的附加数据（各接口说明），失败时为空串 }
        url: { type: string }
        wait: { type: integer, example: 3 }
    Error:
      description: 本项目的错误体 = PHP 失败 JSON（code=0），见 info.description「通用约定」
      allOf:
        - $ref: "#/components/schemas/LegacyJson"
        - type: object
          properties:
            code: { type: integer, enum: [0] }
    PwdResult:
      type: object
      required: [code, msg]
      additionalProperties: false
      properties:
        code: { type: integer, enum: [1, 1001, 1002, 1003, 1011, 1012, 1013, 1014, 1021, 1022] }
        msg: { type: string, description: "成功为 ok；其他为 LegacyLang 文本或模型返回消息" }
    PwdForm:
      type: object
      properties:
        mid: { type: string, enum: ["1", "2"] }
        type: { type: string, enum: ["1", "4", "5"] }
        id: { type: string, maxLength: 20 }
        pwd: { type: string, maxLength: 255 }
    TableIdsForm:
      type: object
      required: [__token__]
      properties:
        __token__: { type: string, maxLength: 64 }
        ids:
          description: 表名数组（`ids[]=`）或逗号分隔串；每项必须在附表 A 的 26 张表白名单内，最多 26 项
          oneOf:
            - type: array
              maxItems: 26
              items: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9_]+$" }
            - type: string
              maxLength: 2048
    SqlForm:
      type: object
      required: [__token__, sql]
      properties:
        __token__: { type: string, maxLength: 64 }
        sql: { type: string, maxLength: 1048576, description: "整段 SQL；`{pre}` 替换为表前缀；不回显" }
    BackupIdForm:
      type: object
      required: [__token__, id]
      properties:
        __token__: { type: string, maxLength: 64 }
        id: { type: string, maxLength: 20, pattern: "^[0-9]+$", description: 备份时间戳（Unix 秒） }
    ExportForm:
      type: object
      properties:
        ids:
          description: 同 B15 导出（表名数组或单值）
          oneOf:
            - type: array
              maxItems: 26
              items: { type: string, maxLength: 64 }
            - type: string
              maxLength: 2048
        start: { type: string, maxLength: 20, description: 同 B15 }
    RecoverForm:
      type: object
      required: [__token__, run, target]
      properties:
        __token__: { type: string, maxLength: 64 }
        run: { $ref: "#/components/schemas/RunId" }
        target:
          type: string
          enum: [AUTO_BACKUP, SOURCE]
          description: AUTO_BACKUP = 还原前自动备份（回到还原前数据）；SOURCE = 重跑原备份（完成这次还原）
    AcknowledgeForm:
      type: object
      required: [__token__, run]
      properties:
        __token__: { type: string, maxLength: 64 }
        run: { $ref: "#/components/schemas/RunId" }
        accepted_as_is:
          type: string
          enum: ["0", "1"]
          description: 页面勾选“接受当前数据”= 1；RECOVERED 以外的待处理状态必须为 1
    TemplateSaveForm:
      type: object
      required: [__token__, fname, fcontent]
      properties:
        __token__: { type: string, maxLength: 64 }
        fpath: { type: string, maxLength: 512 }
        fname: { type: string, maxLength: 512, description: "扩展名须为 html/htm/js/xml" }
        fcontent: { type: string, maxLength: 2097152 }
        fversion: { type: string, maxLength: 128, description: 编辑页带出的文件版本（B15 冲突检查，基线参数名），不一致 → TPL_VERSION_CONFLICT }
    RunId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9-]+$"
      description: 运行记录编号（服务端生成，不透明）
    ImportResult:
      type: object
      description: 还原 / recover 的结果数据（LegacyJson.data），页面同样展示这些值
      properties:
        run: { $ref: "#/components/schemas/RunId" }
        state: { $ref: "#/components/schemas/RunState" }
        outcome: { $ref: "#/components/schemas/RunOutcome" }
        total: { type: integer, minimum: 0, description: 将执行的语句总数 }
        executed: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0, description: 跳过的 DROP/CREATE 等非 DML 语句数 }
        failed_index: { type: integer, minimum: 0, description: 失败语句序号（1 起），无失败为 0 }
        failed_table: { type: string }
        failure_class: { type: string, enum: ["", NOT_APPLIED, UNKNOWN] }
        sqlstate: { type: string, maxLength: 5 }
        tables_done: { type: integer, minimum: 0 }
        auto_backup_stamp: { type: string, description: "Ymd-His，DBT-3 首次运行生成；recover 不新建" }
    RunState:
      type: string
      enum: [RUNNING, DONE, FAILED, UNKNOWN, INTERRUPTED, RECOVERING, RECOVERED, RECOVERY_FAILED, RECOVERY_UNKNOWN, RECOVERY_INTERRUPTED]
      description: 待处理 = FAILED、UNKNOWN、INTERRUPTED、RECOVERY_FAILED、RECOVERY_UNKNOWN、RECOVERY_INTERRUPTED、RECOVERED
    RunOutcome:
      type: string
      enum: ["", OK, PARTIAL, FAILED, FAILED_BEFORE_WRITE, INTERRUPTED, INTERRUPTED_BEFORE_WRITE]
      description: 只在 state=DONE 时有意义；PARTIAL 仅 DBT-1（有表失败，详见 table_results）
    DatabaseRun:
      type: object
      description: |
        运行记录文件 `application/data/backup/database/dbtool-run.json`（C-73）的格式。**不是 HTTP 响应**，登记在此供测试与评审核对
        （V-31）；只在持锁时读后写（`LegacySiteFiles.replace` 原子替换），页面可不持锁只读。不写 SQL 原文、数据值、连接串。
      required: [run, op, state, admin_id, started_at]
      properties:
        run: { $ref: "#/components/schemas/RunId" }
        op: { type: string, enum: [OPTIMIZE, REPAIR, SQL, IMPORT, EXPORT] }
        phase: { type: string, enum: ["", AUTO_BACKUP, RESTORE], description: 仅 IMPORT；recover 不分阶段 }
        state: { $ref: "#/components/schemas/RunState" }
        outcome: { $ref: "#/components/schemas/RunOutcome" }
        admin_id: { type: integer, minimum: 1 }
        started_at: { type: integer, description: Unix 秒 }
        finished_at: { type: integer, description: Unix 秒，未结束为 0 }
        total: { type: integer, minimum: 0 }
        executed: { type: integer, minimum: 0 }
        failed_index: { type: integer, minimum: 0 }
        failure_class: { type: string, enum: ["", NOT_APPLIED, UNKNOWN] }
        sqlstate: { type: string, maxLength: 5 }
        error_code: { type: integer }
        tables: { type: array, items: { type: string }, description: DBT-1 选中的表或 DBT-3 还原表集合 }
        table_results:
          type: array
          description: 仅 DBT-1，逐表结果
          items:
            type: object
            properties:
              table: { type: string }
              ok: { type: boolean }
              sqlstate: { type: string }
        tables_done: { type: integer, minimum: 0 }
        table_current: { type: string }
        inserted_current: { type: integer, minimum: 0 }
        source_backup: { type: string, description: "原备份时间戳前缀 Ymd-His（仅 IMPORT）" }
        auto_backup:
          type: object
          description: 仅 IMPORT；phase=RESTORE 时必然完整
          properties:
            stamp: { type: string, description: Ymd-His }
            tables: { type: array, items: { type: string } }
            files:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        export_files: { type: array, items: { type: string }, description: 本次已创建（或即将创建）的分卷文件名，中断清理只删这些 }
        backup_lock: { type: string, description: 本次写入 backup.lock 的值；清理时内容相同才删，否则记 LOCK_KEPT }
        recovery:
          type: object
          properties:
            attempt: { type: integer, minimum: 0 }
            target: { type: string, enum: ["", AUTO_BACKUP, SOURCE] }
            last_result: { type: string, enum: ["", RECOVERED, RECOVERY_FAILED, RECOVERY_UNKNOWN, INTERRUPTED] }
        interrupted:
          type: object
          description: 中断判定记录（每条记录只判定一次）
          properties:
            at: { type: integer }
            prev_state: { type: string }
            prev_phase: { type: string }
            cleanup: { type: string, enum: ["", NONE, OK, LOCK_KEPT, FAILED] }
            residual_files: { type: array, items: { type: string } }
        ack:
          type: object
          properties:
            at: { type: integer }
            admin_id: { type: integer }
            accepted_as_is: { type: boolean }

x-interrupt-transitions:
  description: DBT-5 ⑩：任一取锁入口（optimize、repair、sql、import、recover、acknowledge、export、del 与页面 probe）读到 RUNNING/RECOVERING 时的唯一改写，完成后才继续本次动作
  rows:
    - { match: "op=OPTIMIZE|REPAIR, state=RUNNING", to: "DONE, outcome=INTERRUPTED（保留 tables_done）", cleanup: 无, pending: false, page: "灰色说明“上次优化/修复在第 k 张表中断，可重新执行”；无 recover/我已处理", log: WARN, verify: "V-31 ⑪" }
    - { match: "op=SQL, state=RUNNING", to: INTERRUPTED, cleanup: 无, pending: true, page: "红色提示条“该语句可能已生效，也可能未生效”+ 核对步骤；只有“我已处理”（须勾选接受当前数据）", log: ERROR, verify: "V-31 ⑫" }
    - { match: "op=IMPORT, phase=AUTO_BACKUP, state=RUNNING", to: "DONE, outcome=INTERRUPTED_BEFORE_WRITE", cleanup: "删 export_files；backup.lock 内容等于 backup_lock 时删", pending: false, page: "灰色说明“上次还原在备份阶段中断，数据未改动，可重新发起”", log: "WARN（清理失败 ERROR）", verify: "V-31 ⑬" }
    - { match: "op=IMPORT, phase=RESTORE, state=RUNNING", to: INTERRUPTED, cleanup: "无（自动备份保留）", pending: true, page: "红色提示条（已完成表、当前表、自动备份时间戳）；recover（AUTO_BACKUP/SOURCE）+ 我已处理（须勾选）", log: ERROR, verify: "V-31 ⑭" }
    - { match: "op=EXPORT, state=RUNNING", to: "DONE, outcome=INTERRUPTED", cleanup: "同 IMPORT/AUTO_BACKUP", pending: false, page: "灰色说明“上次导出中断，不完整的分卷已删除，请重新导出”；清理为 LOCK_KEPT/FAILED 时列出残留文件并提示部署方手动处理", log: "WARN（清理失败 ERROR）", verify: "V-31 ⑮" }
    - { match: "op=IMPORT, state=RECOVERING", to: "RECOVERY_INTERRUPTED（attempt 不变，last_result=INTERRUPTED）", cleanup: 无, pending: true, page: "同 IMPORT/RESTORE", log: ERROR, verify: "V-31 ⑯" }

x-page-banner:
  description: 数据库工具各页面（API-010、API-013 GET）按运行记录显示的提示条与按钮；按钮只按状态机出现
  rows:
    - { when: "probe 拿不到锁", banner: "执行中", buttons: [] }
    - { when: "无记录 / DONE（outcome=OK|FAILED|PARTIAL|FAILED_BEFORE_WRITE）", banner: "无（或上次结果的一行说明）", buttons: [] }
    - { when: "DONE + outcome=INTERRUPTED|INTERRUPTED_BEFORE_WRITE", banner: "灰色说明（见 x-interrupt-transitions）", buttons: [] }
    - { when: "SQL：UNKNOWN / INTERRUPTED", banner: "红色：操作类型、开始时间、管理员、失败分类、核对步骤", buttons: ["我已处理（须勾选接受当前数据）"] }
    - { when: "IMPORT：FAILED / UNKNOWN / INTERRUPTED / RECOVERY_FAILED / RECOVERY_UNKNOWN / RECOVERY_INTERRUPTED", banner: "红色：操作类型、开始时间、管理员、失败序号与分类、已完成表/当前表、自动备份时间戳、恢复次数与最近结果、恢复步骤（DBT-5 ⑦）", buttons: ["recover：还原前自动备份", "recover：重跑原备份", "我已处理（须勾选接受当前数据）"] }
    - { when: "IMPORT：RECOVERED", banner: "红色：恢复已完成，请核对行数后确认", buttons: ["我已处理"] }

