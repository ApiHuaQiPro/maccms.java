  # ───────────────────────────── 安装向导 ─────────────────────────────
  /install.php:
    post:
      tags: [install]
      operationId: installStep5
      x-api-id: API-030
      x-trace: [FR-10, AC-12, INS-1, INS-2, INS-3, INS-4, RISK-15, SEC-BE-2]
      summary: 安装向导第 5 步（POST `?step=5`）：校验安装会话与一次性令牌后，空库 + SHA-256 校验执行 install.sql 并创建首个管理员
      description: |
        PHP `install/controller/Index.php` `step5`（:177-266），表单来自第 3 步页面 `install/view/index/step3.html:66-90`（`action="?step=5" method="post"`）。
        地址：`/install.php`，也受理基线 `InstallEndpoint.PATHS` 的等价写法（`/install.php/index/index[.html]`）；`step` 取查询串（第 3 步表单的 action），
        按 PHP `switch` 宽松比较（`5`、`05`、`5.0` 等数值等于 5）。本 operation 只登记 step=5；其他 step 的页面与第 4 步“测试连接”行为不变（基线 B22）。

        **前置条件（INS-SEC-1～INS-SEC-5，安全修订，均在任何连库、读写文件之前判定）**
        - INS-SEC-1 安装模式：只有以 `MACCMS_INSTALL_MODE=true` 启动的安装应用（`InstallApplication`）装配本入口；正常模式不装配 `/install.php`，
          该地址按前台 API-005 返回 404，不执行任何安装逻辑。
        - INS-SEC-2 安装锁：`application/data/install/install.lock` 存在 → 任何方法、任何 step 都只返回 INSTALL_LOCKED 固定文本（HTTP 200，
          `text/html; charset=utf-8`，旧 install.php:31 原文），不读参数、不建会话。写库阶段在进程内互斥区内**再查一次**安装锁（防并发两次安装）。
        - INS-SEC-3 方法：step=5 只接受 POST 且 `Content-Type: application/x-www-form-urlencoded`；GET/HEAD 或其他正文类型 → INSTALL_ACCESS_DENIED，不执行
          （PHP 对 GET 走“请先测试连接/请填写账号”等分支；Java 收紧为直接拒绝，与基线第 4 步一致）。正文上限 1 MiB（超出 → 500 固定“系统错误”页，同基线）。
        - INS-SEC-4 安装会话与一次性令牌：会话 = 安装应用的 Servlet 会话（cookie `JSESSIONID`，`HttpOnly`、`SameSite=Strict`、`Path=/`）。令牌由第 3 步页面
          签发（128 位随机数的 32 位小写十六进制，存会话 `install.token`，页面隐藏字段 `__token__`）。第 5 步要求：会话存在且持有令牌，表单 `__token__`
          与之定长比较相等；否则 INSTALL_ACCESS_DENIED。令牌在**通过校验的同时从会话删除**（一次性，在连库与写文件之前），因此同一表单重放、并发重复提交
          都只有第一次能进入写库阶段；之后任何失败都须重新打开第 3 步取新令牌。第 4 步只校验、不作废令牌。跨站页面发起的 POST 因 `SameSite=Strict`
          不带会话 cookie → 会话无令牌 → INSTALL_ACCESS_DENIED。
        - INS-SEC-5 向导状态：会话 `install.install_error` 为真（第 2 步环境检测失败）→ INSTALL_ENV_FAILED（`lang(install/init_err)`）；第 4 步尚未成功写出
          `MACCMS_DEPLOY_CONFIG` 的连接信息 → INSTALL_NOT_TESTED（`lang(install/please_test_connect)`）。

        **判定顺序**（前一步不通过即返回，不连库、不写任何文件）：INS-SEC-2 → INS-SEC-3 → INS-SEC-5 环境 → INS-SEC-5 连接信息 → `account`/`password`
        为空（PHP `empty`）→ INSTALL_ADMIN_REQUIRED → `account` 规则 → `password` 规则（INSTALL_ADMIN_INVALID，消息为 ThinkPHP 校验原文）→ INS-SEC-4 令牌 →
        `install_dir` → root 账号（INSTALL_ROOT_REFUSED，`MACCMS_INSTALL_ALLOW_ROOT=true` 时放行）→ 进入互斥区：再查 install.lock（INSTALL_ACCESS_DENIED）→
        INS-2 ①开连接（INSTALL_CONNECT_FAILED）→ ②`mac_` 表数 > 0（INSTALL_TABLES_EXIST）→ ③SHA-256（INSTALL_SQL_HASH_MISMATCH）→ 写 `extra/maccms.php`
        （INSTALL_CONFIG_WRITE_FAILED）→ ④执行 install.sql（INSTALL_SQL_FAILED）→ ⑤初始数据（INSTALL_INIT_DATA_FAILED）、首个管理员（INSTALL_ADMIN_FAILED）→
        ⑥写 install.lock（INSTALL_LOCK_WRITE_FAILED）→ 成功 `lang(install/is_ok)`，`url` 为后台入口。
        INS-2 不变：用第 3 步填写、存于 `MACCMS_DEPLOY_CONFIG` 的账号开连接（只在本请求内使用，用后关闭）；install.sql 原始字节的 SHA-256 须等于
        `48dbe0fbd138f670919208d8bcc0ffe28d09b507c527d2a6a1a8f7b77ffa3aa4`（CRLF 检出也走不一致分支）；按 `mac_parse_sql` 切分逐条执行、不替换前缀；
        不发 `CREATE DATABASE`，不执行该文件之外的任何 DDL。
        **失败后的状态**：写库阶段之前的失败不产生任何写入；之后的失败（④⑤⑥）不写 install.lock，库内可能已有表——再次安装会在 ② 返回 INSTALL_TABLES_EXIST，
        由部署方清空目标库后重新走向导（同 PHP，不自动回滚 DDL）。所有失败消息不含 SQL、连接串、密码与文件绝对路径。
        **响应**：Ajax（ADM-2 同款判定：`X-Requested-With: XMLHttpRequest` 或 `_ajax` 为真；第 3 步页面以 Ajax 提交）→ JSON `LegacyJson`；非 Ajax →
        安装向导跳转提示页（`JumpPage`）。INSTALL_LOCKED 为纯文本页。
      security: []
      x-security-note: |
        匿名入口（与 PHP 相同，安装前没有管理员）。边界由 INS-SEC-1～INS-SEC-5 保证：只在安装模式装配；install.lock 存在即关闭；只接受 POST 表单；
        必须持有第 3 步签发、绑定会话、一次性作废的 `__token__`（SameSite=Strict 会话 cookie 阻断跨站请求）；写库前在互斥区内复查安装锁。
      parameters:
        - name: step
