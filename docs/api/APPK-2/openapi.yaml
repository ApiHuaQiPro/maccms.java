  - { code: DBT_BACKUP_BOUND, http: 200, wire_code: 0, wire_msg: "该备份是未处理数据库操作的恢复点", meaning: 要删的备份被待处理还原记录绑定, trigger: "del 前缀等于 source_backup 或 auto_backup", retry: false, caller: 先处理（recover/我已处理）再删 }
  - { code: DBT_DEL_ERR, http: 200, wire_code: 0, wire_msg: "lang(del_err)", meaning: 删除失败, trigger: "B15 原样", retry: true, caller: 重试或部署方检查文件权限 }
  - { code: DBT_RUN_MISMATCH, http: 200, wire_code: 0, wire_msg: "运行记录已变化，请刷新页面", meaning: run 不等于当前记录, trigger: "recover/acknowledge 的 run 与当前记录不符", retry: false, caller: 刷新页面后按最新提示条操作 }
  - { code: DBT_RECOVER_NOT_ALLOWED, http: 200, wire_code: 0, wire_msg: "当前记录不能执行恢复", meaning: 非 DBT-3 待处理记录（含 RECOVERED、DBT-2）, trigger: "recover 状态检查", retry: false, caller: 按提示条操作 }
  - { code: DBT_AUTO_BACKUP_INVALID, http: 200, wire_code: 0, wire_msg: "自动备份缺失或校验不一致", meaning: auto_backup 不存在或 SHA-256 不符, trigger: "recover target=AUTO_BACKUP 预检", retry: false, caller: 改选重跑原备份，或由部署方处理 }
  - { code: DBT_RECOVERY_FAILED, http: 200, wire_code: 0, wire_msg: "恢复失败（附失败表与 SQLState）", meaning: RECOVERY_FAILED（仍待处理）, trigger: "recover 确定未生效", retry: true, caller: 排除原因后再次 recover }
  - { code: DBT_RECOVERY_UNKNOWN, http: 200, wire_code: 0, wire_msg: "恢复结果不确定", meaning: RECOVERY_UNKNOWN（仍待处理）, trigger: "recover 结果不确定", retry: true, caller: 排除原因后再次 recover }
  - { code: DBT_ACK_CONFIRM_REQUIRED, http: 200, wire_code: 0, wire_msg: "请勾选“接受当前数据”", meaning: 未恢复的待处理记录确认时未勾选, trigger: "acknowledge 且状态非 RECOVERED、accepted_as_is≠1", retry: false, caller: 勾选后再提交 }
  - { code: DBT_ACK_NOT_PENDING, http: 200, wire_code: 0, wire_msg: "当前没有待处理的数据库操作", meaning: 记录不在待处理, trigger: "acknowledge 时无记录或 DONE", retry: false, caller: 刷新页面 }
  # 计数
  - { code: COUNTER_SAVE_FAILED, http: 200, wire_code: 1002, wire_msg: "保存失败!：", meaning: 计数写入被数据库拒绝（如已到列上限）, trigger: "API-007（基线 D-B11-5）", retry: false, caller: 不重试 }
  # 定时任务
  - { code: TIMMING_FORBIDDEN, http: 403, wire_msg: "定时任务入口只接受本机请求或携带部署口令的请求，未执行任何任务（text/html，no-store）", meaning: 既无有效口令头也不是本机回环来源, trigger: "API-044 TimmingAccess.allowed 为假", retry: false, caller: 部署方配置口令或改由本机调用 }
  # 模板管理
  - { code: TPL_PARAM_ERR, http: 200, wire_code: 0, wire_msg: "lang(param_err) 后接 1 或 2（PHP 原样：1 = fpath 为空，2 = 路径不在 ./template 或越界）", meaning: 模板路径参数不合法, trigger: "template/info 打开或保存", retry: false, caller: 从模板列表重新进入 }
  - { code: TPL_EXT_NOT_ALLOWED, http: 200, wire_code: 0, wire_msg: "PHP Template.php:170 同款提示", meaning: 扩展名不在 html/htm/js/xml, trigger: "template/info 打开或保存（template/del 不检查扩展名，同 PHP）", retry: false, caller: 改用允许的扩展名 }
  - { code: TPL_NAME_REQUIRED, http: 200, wire_code: 0, wire_msg: "lang(validate/require_name)", meaning: 保存时文件名为空, trigger: "template/info POST 且 fname 为空", retry: false, caller: 填写文件名（Ajax data.__token__ 带新令牌） }
  - { code: TPL_DELETE_FAILED, http: 200, wire_code: 0, wire_msg: "TemplateFileService.delete 返回的提示（不含绝对路径）", meaning: 某个文件删除失败, trigger: "template/del 删除合规文件时出错", retry: true, caller: 检查文件权限后重试（幂等） }
  - { code: TPL_UNSAFE_CONTENT, http: 200, wire_code: 0, wire_msg: "lang(admin/template/php_safe_tip)", meaning: 内容命中 LEGACY_FILTER, trigger: "template/info 保存", retry: false, caller: 去掉被过滤的内容 }
  - { code: TPL_VERSION_CONFLICT, http: 200, wire_code: 0, wire_msg: "B15 版本冲突提示（原文不变）", meaning: 文件已被他人修改, trigger: "保存时 fversion 与当前文件不一致", retry: false, caller: 重新打开后合并修改 }
  # 安装
  - { code: INSTALL_TABLES_EXIST, http: 200, wire_code: 0, wire_msg: "已存在数据表", meaning: 目标库已有 mac_ 表, trigger: "INS-2 ②", retry: false, caller: 换空库 }
  - { code: INSTALL_SQL_HASH_MISMATCH, http: 200, wire_code: 0, wire_msg: "文件哈希不一致", meaning: install.sql 与内置 SHA-256 不符（含 CRLF 检出）, trigger: "INS-2 ③", retry: false, caller: 部署方用 LF 原文件替换 }
