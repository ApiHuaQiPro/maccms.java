openapi: 3.0.3
info:
  title: APPK-2 PHP 剩余功能迁移 Java —— 本期 HTTP 接口契约
  version: 1.0.0
  description: |
    Issue: APPK-2
    PRD: docs/prd/APPK-2.md（附表 docs/prd/APPK-2/）@ 8fa362c25b62b52ed5b16afd9eca7f6ccfcafb9f（v9）
    技术设计: docs/design/APPK-2/tech-design.md @ 20490951e1a9c880e975caee0c72c5e0e92120ed（v8，G1 PASS）
    UI 设计: docs/design/APPK-2/ @ 0910f7b5e12e779ad2b66f70823b16b601533cd2
    基线: release/APPK-2-php-template-migration @ a57e9cb2b94d3e500bea7dfe2c579daee093d969
    已关闭决策: OP-T4=a、OP-T5=a、OP-T6=b（Issue APPK-2 发起人确认评论 01a194e9-23e8-7682-8ae5-b7c5e19b0040），本契约只写所选答案
    状态: 可对接（待调度独立复核与后端契约评审）

    ## 范围
    本文件只登记技术设计里**改变 HTTP 可见行为**的接口（新增、恢复或改变状态码/响应体/响应头的入口）。
    技术设计内部的 Java 接口（`PhpTemplateRenderer`、`LegacySiteFiles.readTemplateAsset/tryExclusiveLock`、`DatabaseRuns` 等，
    设计 §6.3）不是 HTTP 接口，不在本文件重复；页面 HTML 正文以模板包原样输出为准（BR-11），由页面黄金对照（AC-5）验收，
    本文件不描述正文结构。

    | 分组 | API-ID | 来源 |
    | --- | --- | --- |
    | 前台：模板静态资源（OP-T5=a） | API-001 | 设计 §6.10、C-43、C-44、SEC-7 |
    | 前台：观看密码 ajax/pwd（OP-T4=a） | API-002 | 设计 §6.8 ALIGN-4、C-68、SEC-9 |
    | 前台：HTML 页通用响应头与 CSP（OP-T6=b） | API-003（横切，见 `x-cross-cutting`） | 设计 §6.8 ALIGN-5、§4.11、C-70、C-75 |
    | 前台：站点关闭 / 未匹配地址 / 搜索过快 / 计数接口 | API-004～API-007（横切 + API-007 计数接口） | 设计 §6.8 ALIGN-1、ALIGN-2、ALIGN-6、ALIGN-7 |
    | 后台：数据库工具（FR-9） | API-010～API-018 | 设计 §6.13 DBT-1～DBT-5、C-53、C-54、C-73 |
    | 后台：模板管理（FR-7） | API-020～API-023 | 设计 §6.1、§6.11、C-47～C-49 |
    | 后台：静态生成（FR-6） | API-024 | 设计 §6.2、§6.12、C-45、C-50 |
    | 后台：清理缓存（V9-001） | API-025 | 设计 §6.18 CACHE-3、C-52 |
    | 安装向导第 5 步（FR-10） | API-030 | 设计 §6.14 INS-1～INS-4、C-56 |
    | 在线采集 / 远程图片 / 定时采集（FR-11） | API-040～API-044 | 设计 §6.15 NET-1～NET-6、C-58～C-61 |

    ## 通用约定（与 PHP 线上格式兼容，偏离 multica-artifact-backend 通用 Error 骨架的说明）
    - 本期所有接口是旧 MacCMS（ThinkPHP 5.0）URL 的 Java 实现，响应必须与 PHP 一致（BR-3、BR-4、FR-12），
      所以**不使用** `{code: string, message, request_id}` 的通用错误体。`#/components/schemas/Error` 在本文件中定义为
      PHP 的跳转/提示 JSON（`code=0`），业务错误码以 `x-error-codes` 的 `code` 为契约标识，线上可区分的是 `msg` 文本（`wire_msg`）
      与 HTTP 状态；不回显 SQL 原文、文件路径、连接串。
    - 后台（`/{adminEntry}/…`，`adminEntry` = 配置 `maccms.admin.entry`，例如 `/admin.php`）：
      * 鉴权：管理员会话 cookie（B12，`AdminController` 每请求重读管理员，SEC-5）+ `admin_auth` 权限码 `<controller>/<action>`；
        未登录 → 302 到登录页；无权限 → PHP `no_auth` 提示。
      * 写操作只接受 POST，并校验表单令牌 `__token__`（缺失 → 非法请求；不一致 → 令牌错误，同 B12 `AdminForms.check`）。
        本期新增的 `database/recover`、`database/acknowledge` 同样要求 POST + `__token__`。
      * Ajax 判定：请求头 `X-Requested-With: XMLHttpRequest` 或参数 `_ajax` 为真。Ajax → `application/json; charset=utf-8`，
        正文 `{"code","msg","data","url","wait"}`（`code` 1 成功 / 0 失败，HTTP 200）；非 Ajax → PHP 跳转提示页（HTML，HTTP 200）。
      * 路由与 `.html` 后缀、参数来源（`input()` = 路由参数 + GET + POST 合并）沿用 B12 现有规则，本期不改。
    - 前台：路由沿用现有 `site` 控制器（`/index.php/<c>/<a>` 与无 `index.php` 的短地址两种写法）；HTML 页一律
      `text/html; charset=utf-8` 并带 API-003 的 CSP 头；ajax JSON 为 `application/json; charset=utf-8`，
      编码同 PHP `json_encode(…, JSON_UNESCAPED_UNICODE)`。
    - 幂等：本期接口均为 PHP 已有的表单/ajax 动作，不引入 `Idempotency-Key`。数据库工具的重复提交由 `dbtool.lock` 互斥与
      运行记录状态机约束（DBT-5 ④⑤），各操作的幂等性写在对应 operation 的 `x-idempotency`。
    - 示例数据均为虚构，域名一律 `example.com`。
  x-changelog:
    - version: 1.0.0
      date: 2026-11-01
      change: 首版。依据技术设计 v8 @ 20490951e1a9c880e975caee0c72c5e0e92120ed，覆盖 OP-T4=a、OP-T5=a、OP-T6=b 与数据库工具运行记录/锁/恢复动作。
      breaking: false
servers:
  - url: /
    description: 站点根（相对路径；前台与安装向导）

# 后台接口的 servers（Server Object 不支持 $ref，用 YAML 锚点复用）
x-admin-servers: &adminServers
  - url: "{adminEntry}"
    description: 后台入口（maccms.admin.entry）
    variables:
      adminEntry:
        default: /admin.php
        description: 部署配置 MACCMS_ADMIN_ENTRY 的值

tags:
  - name: site
    description: 前台（`maccms.site.enabled=true` 时装配）
  - name: admin-database
    description: 后台数据库工具（FR-9）
  - name: admin-template
    description: 后台模板管理（FR-7）
  - name: admin-make
    description: 后台静态生成（FR-6）
  - name: admin-collect
    description: 后台在线采集、远程图片（FR-11）
  - name: install
    description: 安装向导（FR-10）
  - name: api
    description: api.php 入口

x-cross-cutting:
  - x-api-id: API-003
    summary: 前台 HTML 页通用响应头与 CSP（OP-T6=b）
    x-trace: [FR-5, AC-5, AC-17, ALIGN-5, DEC-11, OP-T6, V-32]
    applies-to: 前台所有返回 HTML 的响应——全部页面控制器、跳转/提示页（JumpPages）、站点关闭页、404 页、验证码页、浏览器提示页、站点异常页（SitePageResponses 是唯一出口，C-70）
    headers:
      Content-Type: "text/html; charset=utf-8（常量只用 SiteRequests.HTML_UTF8）"
      Content-Security-Policy: "object-src 'none'; base-uri 'self'; frame-ancestors 'self'（逐字，唯一来源 C-75 SiteSecurityHeaders.frontPolicy()，恒有值，没有过渡值）"
    rules:
      - 所有前台 HTML 页都发同一条 CSP，不再有会员页 nonce、播放器 frame 策略（PlayerFramePolicy）、支付网关 form-action 变体。
      - CSP 不限制脚本：模板内联脚本（如 public/jump.html 倒计时）、player.js 的 document.write、支付网关自动提交表单都能运行（V-32 ⑥）。
      - 站点不能被其他源用 iframe 嵌入（frame-ancestors 'self'）；同源嵌入允许。
      - 非 HTML 响应（ajax JSON、RSS/地图 XML、/template/** 静态资源、/api/v1/**）不加该头；RSS/地图与 ajax 的 Content-Type 按 PHP 控制器（PRE-2 基线记录值）。
      - 缓存头按 SitePageResponses 的 CacheMode（NO_CACHE / NO_STORE）与 Vary 规则（C-70、§4.11 方案 E）；本期不改缓存头取值。
  - x-api-id: API-004
    summary: 站点关闭（ALIGN-1）
    x-trace: [FR-5, AC-5, ALIGN-1, CMP-3]
    before: 503 + Retry-After + jte 关闭页
    after: 状态码与页面按 PHP `public/close`（Base.php:77），即 HTTP 200 + 模板包 public/close 原样输出；不再发 Retry-After
  - x-api-id: API-005
    summary: 前台未匹配地址（ALIGN-2）
    x-trace: [FR-5, AC-5, ALIGN-2, F-D2]
    before: JSON 404「接口不存在」
    after: |
      除 /api/v1/**、/api.php/**、后台入口之外的未匹配站点路径 → PHP `_empty` → `page_error`：HTTP 404 +
      `public/<app.page_404>`（配置为空时 `public/jump`）的模板输出（HTML，带 API-003 头）；模板缺失 → “模板文件不存在”页（TemplateNotFoundPage）。
      /api/v1/** 的未匹配地址仍返回原 JSON 404，不变。
  - x-api-id: API-006
    summary: 搜索过快（ALIGN-6）
    x-trace: [FR-5, AC-5, ALIGN-6]
    before: 429 + Retry-After + jte 提示页
    after: PHP `check_search`：HTTP 200 + `public/jump` 错误提示，msg = lang('search_frequently') + search_timespan + lang('seconds')；无 Retry-After；计时规则（只算第 1 页、被拒也刷新）不变

paths:
  # ───────────────────────────── 前台 ─────────────────────────────
  /template/{dir}/{assetPath}:
    get:
      tags: [site]
      operationId: getTemplateAsset
      x-api-id: API-001
      x-trace: [FR-1, FR-5, AC-5, AC-17, DEC-8, SEC-7, OP-T5, V-18]
      summary: 读取模板包静态资源（白名单，OP-T5=a）
      description: |
        PHP 由 Web 服务器直接返回 template/ 下的文件；Java 由 `TemplateAssetController`（C-43）提供，放行规则只在
        `LegacySiteFiles.readTemplateAsset`（C-44）一处实现。

        **放行条件（全部满足才 200，否则一律 404，不区分原因、不回显路径）**
        1. `{dir}` 是站点根 `template/` 下实际存在的子目录（不限 default_pc/default_wap，跟随配置）。
        2. `{assetPath}` 的第一段是 `css`、`js`、`images`、`ads` 之一，其后至少还有一段文件名（可有多级子目录）。
        3. 扩展名（按小写比较）在白名单：`css js png jpg jpeg gif ico svg webp woff woff2 ttf eot swf`；
           `php` 及 `html htm ini txt`、无扩展名一律拒绝（SEC-7：与 PHP 的已确认安全差异，PHP 会原样返回 `.html` 模板源码与 `info.ini`）。
        4. 路径段不含 `..`、`.`、空段、反斜杠、`:`、空字节、控制字符；规范化后的真实路径在 `<站点根>/template/` 内
           （中间目录是符号链接且解析后出 template/ 或出站点根 → 拒绝）；最终文件按 NOFOLLOW_LINKS 打开，本身是符号链接、目录、非普通文件 → 拒绝。
        5. 文件大小不超过实现上限 `maxBytes`（超出 → 404）。
        只读：不建目录、不写文件、不改时间。只在 `maccms.site.enabled=true` 时装配；未装配时该路径走 API-005 的 404。
      security: []
      x-security-note: 公开静态资源（模板 CSS/JS/图片/广告脚本），与 PHP 站点相同无需登录；安全边界由放行条件保证。
      parameters:
        - $ref: "#/components/parameters/TemplateDir"
        - $ref: "#/components/parameters/TemplateAssetPath"
        - name: If-Modified-Since
          in: header
          required: false
          schema: { type: string, maxLength: 64 }
          description: HTTP 日期；文件修改时间不晚于该值 → 304
      responses:
        "200":
          description: 文件原始字节
          headers:
            Content-Type:
              description: 按扩展名固定表（见 `components.x-template-asset-content-types`），不按内容嗅探
              schema: { type: string }
            Last-Modified:
              description: 文件修改时间（HTTP 日期）
              schema: { type: string }
            Content-Length:
              schema: { type: integer, minimum: 0 }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "304":
          description: 未修改（If-Modified-Since 条件成立），无正文
        "404":
          description: 不放行（任一放行条件不满足）或文件不存在；正文同 API-005 的前台 404 页，不含路径信息
          content:
            text/html:
              schema: { type: string }
      x-error-codes-ref: [TEMPLATE_ASSET_NOT_FOUND]
    head:
      tags: [site]
      operationId: headTemplateAsset
      x-api-id: API-001
      x-trace: [FR-5, AC-5, AC-17, SEC-7, V-18]
      summary: 模板静态资源 HEAD（规则同 GET，无正文）
      security: []
      x-security-note: 同 GET
      parameters:
        - $ref: "#/components/parameters/TemplateDir"
        - $ref: "#/components/parameters/TemplateAssetPath"
      responses:
        "200": { description: 头部同 GET 200，无正文 }
        "304": { description: 未修改 }
        "404": { description: 同 GET 404，无正文 }

  /index.php/ajax/pwd:
    get:
      tags: [site]
      operationId: checkWatchPassword
      x-api-id: API-002
      x-trace: [FR-5, AC-5, AC-17, ALIGN-4, SEC-9, OP-T4, V-30]
      summary: 观看/播放/下载/文章密码校验（恢复 PHP ajax/pwd，保留 PasswordAttempts，OP-T4=a）
      description: |
        恢复 PHP `Ajax::pwd`（Ajax.php:400-456），基线 Java 此地址返回 404、改用签名 cookie 的表单校验（随 C-68 移除调用点）。
        短地址 `/ajax/pwd` 与 `.html` 后缀按现有前台路由同样受理，行为相同。参数来源同 PHP `$this->_param`/`input('param.')`
        （路由 + GET + POST 合并），所以 GET 与 POST 等价。

        **判定顺序（逐条按 PHP，第一个命中即返回，HTTP 恒为 200）**
        1. 参数校验：`id` 为空、`pwd` 为空、`mid` ∉ {1,2}、`type` ∉ {1,4,5} → 1001（PHP `empty()` 语义：`"0"` 视为空）。
        2. 本会话已通过同一 `mid-type-id` → 1002。
        3. 会话 `last_pwd` 距今 < 5 秒 → 1003；**每次进入这一步都刷新 `last_pwd`（含被拒的调用）**，同 `mac_get_time_span`。
        4. （OP-T4=a / SEC-9）`PasswordAttempts.tryAcquire(用途, id)` 不通过 → 1003（与第 3 步相同的 JSON），不查库。
           限流口径沿用基线常量：同一“用途 + 内容 id”每 60 秒最多 10 次，全站合计每秒最多 30 次，键数上限 10000（不记录 IP、会话或密码）。
           与 PHP 的差异只在“哪一次请求得到 1003”，判 `排除-SEC-9`。
        5. 取数：`mid=1` 查视频（`vod_status` 等过滤同 PHP `Vod::infoData`），失败 → 1011；`mid=2` 查文章，失败 → 1021；
           `msg` 为模型返回的消息。
        6. 比对：`mid=1,type=1` 比 `vod_pwd` → 不符 1012；`type=4` 比 `vod_pwd_play` → 1013；`type=5` 比 `vod_pwd_down` → 1014；
           `mid=2` 比 `art_pwd`（不看 type）→ 1022。比较为 PHP `!=` 弱比较语义（ZValue 规则，数字串按数值比较）。
        7. 通过：会话写 `mid-type-id = '1'`，返回 `{"code":1,"msg":"ok"}`。
        “已通过”与 `last_pwd` 存进程内会话（SessionStore），不进库、不参与页面对照。前端（模板包 JS）据 `code==1` 刷新页面，
        页面控制器按会话“已通过”放行详情/播放/下载内容。
      security: []
      x-security-note: 观看密码本身就是游客的访问凭证，与 PHP 相同无需登录；频率由第 3、4 步限制。
      parameters:
        - $ref: "#/components/parameters/PwdMid"
        - $ref: "#/components/parameters/PwdType"
        - $ref: "#/components/parameters/PwdId"
        - $ref: "#/components/parameters/PwdValue"
      responses:
        "200":
          description: PHP JSON（成功或任一业务错误码，见 `x-error-codes` 1001～1022）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PwdResult" }
              examples:
                ok: { value: { code: 1, msg: ok } }
                frequently: { value: { code: 1003, msg: "<lang index/pwd_frequently>" } }
                wrong: { value: { code: 1012, msg: "<lang pass_err>" } }
      x-error-codes-ref: [PWD_PARAM_ERR, PWD_ALREADY_PASSED, PWD_TOO_FREQUENT, PWD_VOD_NOT_FOUND, PWD_VOD_WRONG, PWD_VOD_PLAY_WRONG, PWD_VOD_DOWN_WRONG, PWD_ART_NOT_FOUND, PWD_ART_WRONG]
      x-idempotency: 非幂等（刷新 last_pwd、消耗 PasswordAttempts 配额、通过时写会话）；客户端不得自动重试。
    post:
      tags: [site]
      operationId: checkWatchPasswordPost
      x-api-id: API-002
      x-trace: [FR-5, AC-5, AC-17, ALIGN-4, SEC-9, OP-T4, V-30]
      summary: 观看密码校验（POST，与 GET 等价）
      security: []
      x-security-note: 同 GET
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/PwdForm" }
      responses:
        "200":
          description: 同 GET
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PwdResult" }
      x-error-codes-ref: [PWD_PARAM_ERR, PWD_ALREADY_PASSED, PWD_TOO_FREQUENT, PWD_VOD_NOT_FOUND, PWD_VOD_WRONG, PWD_VOD_PLAY_WRONG, PWD_VOD_DOWN_WRONG, PWD_ART_NOT_FOUND, PWD_ART_WRONG]
      x-idempotency: 同 GET

  /index.php/ajax/{counter}:
    post:
      tags: [site]
      operationId: postCounter
      x-api-id: API-007
      x-trace: [FR-5, FR-12, AC-5, AC-14, ALIGN-7]
      summary: 计数接口 hits/digg/score/referer 一律返回 PHP JSON（ALIGN-7）
      description: |
        基线 Java 对非 ajax 的 POST 返回 jte 提示页（D-B11-10）；jte 表单随页面组删除后，按 PHP（Ajax.php:152-460 各方法 `return json(...)`）
        **无论是否 ajax 一律返回 JSON**，参数、判定与 JSON 字段不变（仍由 `SiteCounterActions` 处理，BR-4）。GET 同样受理（PHP 不区分方法）。
        `verify_check` 非 ajax 的输出按 PRE-2 基线记录的 PHP 实际值，附表 C 对应行由 T-FR12 判定，本契约不预设。
        短地址 `/ajax/{counter}` 同样受理。
      security: []
      x-security-note: 游客计数接口，与 PHP 相同公开；频率与去重规则沿用基线实现。
      parameters:
        - name: counter
          in: path
          required: true
          schema: { type: string, enum: [hits, digg, score, referer] }
      responses:
        "200":
          description: PHP JSON（字段同基线 ajax 分支），Content-Type application/json; charset=utf-8
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyJson" }

  # ───────────────────────────── 后台：数据库工具 ─────────────────────────────
  /database/index:
    servers: *adminServers
    get:
      tags: [admin-database]
      operationId: adminDatabaseIndex
      x-api-id: API-010
      x-trace: [FR-9, AC-11, DBT-5, V-31]
      summary: 数据库工具页（表列表 / group=import 备份列表）加载时做一次不等待的中断判定并显示运行记录提示条
      description: |
        列表内容与 B15 相同（`group=import` → 备份列表，否则表列表）。本期新增：
        1. 页面加载先调用 `DatabaseRuns.probe()`：对 `application/data/backup/database/dbtool.lock` 做一次不等待的取锁（DBT-5 ⑥(a)、⑩）。
           - 拿不到锁 → 页面显示“执行中”，**不出现任何操作按钮**（含 recover / 我已处理 / 导出 / 还原 / 优化 / 修复 / 删除）。
