        (a) 分卷齐全（`count($list) === $last[0]`，否则 `admin/database/file_damage`）；(b) 全部分卷可读、`.gz` 可解压；
        (c) 全部语句按 `mac_parse_sql` 切分完成，还原表集合（备份中 DROP TABLE/CREATE TABLE/INSERT INTO 出现过的全部表）都在 26 张白名单内；
        (d) 站点已关闭（`site.site_status=0`）；(e) 自动备份目录存在且可写；另：`backup.lock` 存在 → `admin/database/lock_check`。
