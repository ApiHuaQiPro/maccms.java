      description: |
        输入当作**一整段**处理，不切分、不逐条执行。判定顺序（前一步命中即返回，后续不执行）：
        0. 校验 `__token__`（同 PHP `validate('Token')`，ADM-4 A 类）→ 失败 FORM_TOKEN_INVALID。
        1. `trim`（PHP 语义）；为空 → 不执行，返回 `run_ok`（code=1）。把 `{pre}` 替换为表前缀。
        2. **PHP 跳过判定（SEC-8，逐字照搬 Database.php:252-263）**：副本转小写、`/\*.*?\*/`（跨行）换空格、`--` 至行尾换空格、压缩空白并 trim；
           以 `select` 开头，或含 `outfile`/`dumpfile`/`load_file` 之一 → 不发送，返回 `run_ok`（code=1，与 PHP 文本相同）。
           例：`SELECT 1; INSERT …` 整段跳过。
        3. **多语句**：词法扫描（单引号/双引号/反引号字符串及其中 `\` 转义，`--`、`#`、`/* */` 注释），第一个不在字符串与注释中的 `;`
           之后还有非空白非注释内容 → 不发送，DBT_SQL_MULTI_STATEMENT。末尾单个 `;` 允许并原样发送。
        4. **AC-11 结构保护**：同一词法去注释（出现 `/*!` 版本注释 → 视为不可识别并拒绝），首个关键字只允许 INSERT/UPDATE/DELETE，
           其他（REPLACE、WITH、`(`、DROP、TRUNCATE、ALTER、CREATE 等）→ 不发送，DBT_SQL_STRUCTURE_REFUSED。
        5. 取锁（DBT_LOCKED）→ 中断判定 → 状态检查（待处理/RECOVERED → DBT_PENDING）→ 写 `RUNNING`（op=SQL）→ 整段一次 `Statement.execute`
           （allowMultiQueries=false、自动提交、不重试）。
        6. 结果：成功 → `DONE` outcome=OK，返回 `run_ok`（不展示结果集）；确定未生效 → `DONE` outcome=FAILED，DBT_SQL_FAILED（附 SQLState 分类）；
           结果不确定 → 状态 `UNKNOWN`（待处理），DBT_SQL_UNKNOWN + 核对步骤。提示不回显 SQL 原文。非 Ajax 失败时页面保留输入框原文。
        与 PHP 的差异只有：AC-11 拒绝、多语句与失败时的提示文字、运行记录与锁（DBT-5 ⑧）。
        失败分类（DBT-5 ③）：SQLState `42xxx` 或单值 INSERT 的非连接/非中止类服务端错误 → 确定未生效；
        SQLState `08xxx`、客户端错误码 2000～2999、1028/1053/1317/1927/3024、SQLTimeoutException、非 SQL 异常，
        或多行语句（UPDATE/DELETE/多值 INSERT/INSERT…SELECT）出错 → 结果不确定。
      security: [{ adminSession: [] }]
      x-permission: database/sql
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/SqlForm" }
      responses:
        "200": { $ref: "#/components/responses/AdminAction" }
        "302": { $ref: "#/components/responses/AdminUnauthenticated" }
        "403": { $ref: "#/components/responses/AdminSourceRejected" }
      x-error-codes-ref: [FORM_TOKEN_INVALID, DBT_SQL_MULTI_STATEMENT, DBT_SQL_STRUCTURE_REFUSED, DBT_LOCKED, DBT_PENDING, DBT_SQL_FAILED, DBT_SQL_UNKNOWN, ADMIN_UNAUTHENTICATED, ADMIN_PERMISSION_DENIED, ADMIN_SOURCE_REJECTED, INPUT_LIMIT_EXCEEDED]
