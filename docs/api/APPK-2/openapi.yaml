      description: |
        入口、参数与页面同基线安装向导（PHP `install/controller/Index.php` `index($step)`）；只有第 5 步行为变化（INS-2）：
        1. 用第 3 步填写、存于 `MACCMS_DEPLOY_CONFIG` 的账号开连接（只在本请求内使用，用后关闭）；
