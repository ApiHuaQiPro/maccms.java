  /database/recover:
    servers: *adminServers
    post:
      tags: [admin-database]
      operationId: adminDatabaseRecover
      x-api-id: API-017
      x-trace: [FR-9, AC-11, DBT-5, REV-11, V-31]
      x-csrf-class: A
      summary: 新增：对 DBT-3 待处理记录执行恢复（只能使用本次运行绑定的自动备份或原备份；POST + __token__，A 类）
      description: |
        PHP 无此动作。只接受 POST；**GET 请求** → 不校验令牌、不取锁、不执行，DBT_METHOD_NOT_ALLOWED。入参只有 `run` 与 `target`，**不接受文件名**。

        **处理顺序**（前一步不通过即返回，记录不变、0 条语句）：
        1. 令牌 → FORM_TOKEN_INVALID；`run` 或 `target` 缺失/不合 schema → DBT_METHOD_NOT_ALLOWED 同款 `lang(param_err)`（code=0）。
        2. 取 `dbtool.lock`（不等待）→ 拿不到 → DBT_LOCKED（另一个 recover、还原、删除、导出或执行 SQL 正在持锁；**并发的两次 recover 只有一个能进入**）。
        3. 锁内中断判定（⑩）：若记录为 `RECOVERING`（上一次 recover 的进程已死）→ 先唯一改写为 `RECOVERY_INTERRUPTED`（ERROR 日志），再继续。
        4. `run` 等于当前记录的 `run` → 否则 DBT_RUN_MISMATCH（页面过期；刷新后按最新提示条操作）。
        5. 状态检查：op=IMPORT 且 state ∈ {FAILED, UNKNOWN, INTERRUPTED, RECOVERY_FAILED, RECOVERY_UNKNOWN, RECOVERY_INTERRUPTED} → 继续；
           `RECOVERED`、`DONE`、无记录、op≠IMPORT（含 DBT-2 的 UNKNOWN/INTERRUPTED）→ DBT_RECOVER_NOT_ALLOWED。
        6. 站点已关闭 → 否则 DBT_SITE_NOT_CLOSED。
        7. target=AUTO_BACKUP：`auto_backup` 存在且各分卷 SHA-256 与记录相符 → 否则 DBT_AUTO_BACKUP_INVALID；
           target=SOURCE：原备份分卷齐全可读 → 否则 DBT_FILE_DAMAGE；随后 DBT-3 预检 (a)～(c)（DBT_FILE_DAMAGE / DBT_TABLE_NOT_ALLOWED）。
        **执行**：记录改 `RECOVERING`（保留原失败信息，`recovery.attempt` +1，`recovery.target`=本次目标）并落盘，按 DBT-3 同一流程逐表还原，
        **不再做自动备份**，全程持锁。
        **结果**（每种只有一个终态）：成功 → `RECOVERED`（仍是待处理；返回 code=1 `admin/database/import_ok`，`data` 为 `ImportResult`，state=RECOVERED）；
        确定未生效 → `RECOVERY_FAILED`（DBT_RECOVERY_FAILED）；结果不确定 → `RECOVERY_UNKNOWN`（DBT_RECOVERY_UNKNOWN）；
        进程中途退出 → 无 HTTP 响应，下一个持锁者记 `RECOVERY_INTERRUPTED`（attempt 不变，`x-interrupt-transitions` 第 6 行，V-31 ⑯）。
      security: [{ adminSession: [] }]
      x-permission: database/import
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/RecoverForm" }
      responses:
        "200": { $ref: "#/components/responses/AdminAction" }
        "302": { $ref: "#/components/responses/AdminUnauthenticated" }
        "403": { $ref: "#/components/responses/AdminSourceRejected" }
      x-error-codes-ref: [DBT_METHOD_NOT_ALLOWED, FORM_TOKEN_INVALID, DBT_LOCKED, DBT_RUN_MISMATCH, DBT_RECOVER_NOT_ALLOWED, DBT_SITE_NOT_CLOSED, DBT_AUTO_BACKUP_INVALID, DBT_FILE_DAMAGE, DBT_TABLE_NOT_ALLOWED, DBT_RECOVERY_FAILED, DBT_RECOVERY_UNKNOWN, ADMIN_UNAUTHENTICATED, ADMIN_PERMISSION_DENIED, ADMIN_SOURCE_REJECTED]
      x-idempotency: |
        按记录状态区分（DBT-5 ⑤、V-31 ⑤～⑧），不是“任何时候重复提交结果相同”：
        - 预检拒绝（步骤 1～7）：记录与数据都不变，可修正原因后重新提交。
        - 失败或不确定状态（FAILED、UNKNOWN、INTERRUPTED、RECOVERY_FAILED、RECOVERY_UNKNOWN、RECOVERY_INTERRUPTED）：可再次 recover（用新令牌）；
          同一 target 在无并发写入时数据结果相同（每表先清空再插入），每次 attempt +1。
        - 成功进入 `RECOVERED` 后：再次 recover → DBT_RECOVER_NOT_ALLOWED，数据不变；只能 acknowledge（API-018）离开待处理。
