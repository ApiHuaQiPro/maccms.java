openapi: 3.0.3
info:
  title: APPK-2 PHP 剩余功能迁移 Java —— 本期 HTTP 接口契约
  version: 1.1.0
  description: |
    Issue: APPK-2
    PRD: docs/prd/APPK-2.md（附表 docs/prd/APPK-2/）@ 8fa362c25b62b52ed5b16afd9eca7f6ccfcafb9f（v9）
    技术设计: docs/design/APPK-2/tech-design.md @ 20490951e1a9c880e975caee0c72c5e0e92120ed（v8，G1 PASS）
    UI 设计: docs/design/APPK-2/ @ 0910f7b5e12e779ad2b66f70823b16b601533cd2
    基线: release/APPK-2-php-template-migration @ a57e9cb2b94d3e500bea7dfe2c579daee093d969
    状态: 可对接（v1.1.0，回应后端契约评审第 1 轮 REV-API-1～4、REV-DB-1、REV-SEC-1、REV-TRACE-1；待调度独立复核与后端契约复审）

    ## 上游决策台账（REV-TRACE-1：唯一决策来源与覆盖关系）
    上游三份文件对 OP-15、OP-16 的状态写法不同：PRD v9 的 BR-8、§14 仍写“待确认”（KPI-4=2，关闭前不得 G0/G1/派工）；UI v1 写 OP-16=a 并引用
    技术设计 v2；技术设计 v8 元数据写 OP-15 已由 v2 关闭、§2 写“不补缺页（OP-16 a）”。本契约**不以 PRD v9 的“待确认”文字为依据**，按下表的
    Issue 记录取唯一值；覆盖关系由 G0 路由单（下表第 3 行）授权——该评论在范围确认后登记 OP-15、OP-16 均已关闭，并据此放行评审版流程。

    | # | 决策 | 唯一取值 | 生效依据（Issue APPK-2 评论 / 提交） | 覆盖的上游文字 |
    | --- | --- | --- | --- | --- |
    | 1 | OP-15 模板目录与配置 | DEC-3、PATH-1～PATH-4（桌面 `template/default_pc/html/`、手机 `template/default_wap/html/`；`path_tpl`=`/template/<template_dir>/`；`path_ads`=`/template/<template_dir>/ads/`） | 技术设计 v2 `ebd7aa60ae968229997221d3086b45ddb4fa67e1` 独立复核 + 架构复审 PASS；v8 元数据声明 v2 的 DEC/PATH 内容不变 | PRD v9 BR-8、§14 OP-15“待确认”；UI v1 对“技术设计 v2”的引用即指同一 PATH 取值 |
    | 2 | OP-16 缺页补不补 | a：本期不补；模板包缺的页面按 PHP“模板文件不存在”输出（BR-12），不新增模板文件 | 发起人确认评论 `01a193ca-869e-7572-96d8-ce92e22f596b`（“确认 OP-16 a：本期不补”） | PRD v9 BR-8、§14 OP-16“待确认”、KPI-4=2 |
    | 3 | 范围确认与 OP-15/16 关闭登记 | PRD v9 `8fa362c2` 范围有效；OP-15、OP-16 已关闭 | 发起人范围确认 `01a1945f-4598-7b5f-b46d-e5faf16acdb0`；G0 路由单 `01a1946d-8fa6-7e07-bb97-cf089646614c` | PRD v9 BR-8 的“关闭前不得 G0/G1/派工”门禁（已满足） |
    | 4 | OP-T4 / OP-T5 / OP-T6 | a / a / b | 发起人确认评论 `01a194e9-23e8-7682-8ae5-b7c5e19b0040`；技术设计 v8 已收敛为唯一实现 | 技术设计 v7 及更早版本的 a/b 双分支 |

    契约内凡涉及上述决策的位置（API-001 目录与放行、API-005 缺页、API-020～API-024 后台模板路径与静态生成目录）均只写上表取值，并在 `x-trace`
    中标出 OP-15 / OP-16。若今后任一决策改选，须发起人在 Issue 另行确认、上游修订后，本契约再升版本。PRD 正文状态文字的同步属于上游文档维护，不影响本契约口径。

    ## 范围
    本文件只登记技术设计里**改变 HTTP 可见行为**的接口（新增、恢复或改变状态码/响应体/响应头的入口）。
    技术设计内部的 Java 接口（`PhpTemplateRenderer`、`LegacySiteFiles.readTemplateAsset/tryExclusiveLock`、`DatabaseRuns` 等，
    设计 §6.3）不是 HTTP 接口，不在本文件重复；页面 HTML 正文以模板包原样输出为准（BR-11），由页面黄金对照（AC-5）验收，
    本文件不描述正文结构。

    | 分组 | API-ID | 来源 |
    | --- | --- | --- |
    | 前台：模板静态资源（OP-T5=a） | API-001 | 设计 §6.10、C-43、C-44、SEC-7 |
    | 前台：观看密码 ajax/pwd（OP-T4=a） | API-002 | 设计 §6.8 ALIGN-4、C-68、SEC-9 |
    | 前台：HTML 页通用响应头与 CSP（OP-T6=b） | API-003（横切，见 `x-cross-cutting`） | 设计 §6.8 ALIGN-5、§4.11、C-70、C-75 |
    | 前台：站点关闭 / 未匹配地址 / 搜索过快 / 计数接口 | API-004～API-007（横切 + API-007 计数接口） | 设计 §6.8 ALIGN-1、ALIGN-2、ALIGN-6、ALIGN-7 |
    | 后台：数据库工具（FR-9） | API-010～API-018 | 设计 §6.13 DBT-1～DBT-5、C-53、C-54、C-73 |
    | 后台：模板管理（FR-7） | API-020～API-023 | 设计 §6.1、§6.11、C-47～C-49 |
    | 后台：静态生成（FR-6） | API-024 | 设计 §6.2、§6.12、C-45、C-50 |
    | 后台：清理缓存（V9-001） | API-025 | 设计 §6.18 CACHE-3、C-52 |
    | 安装向导第 5 步（FR-10） | API-030 | 设计 §6.14 INS-1～INS-4、C-56 |
    | 在线采集 / 远程图片 / 定时采集（FR-11） | API-040～API-044 | 设计 §6.15 NET-1～NET-6、C-58～C-61 |

    ## 通用约定（与 PHP 线上格式兼容，偏离 multica-artifact-backend 通用 Error 骨架的说明）
    - 本期所有接口是旧 MacCMS（ThinkPHP 5.0）URL 的 Java 实现，响应必须与 PHP 一致（BR-3、BR-4、FR-12），
      所以**不使用** `{code: string, message, request_id}` 的通用错误体。`#/components/schemas/Error` 在本文件中定义为
      PHP 的跳转/提示 JSON（`code=0`），业务错误码以 `x-error-codes` 的 `code` 为契约标识，线上可区分的是 `msg` 文本（`wire_msg`）
      与 HTTP 状态；不回显 SQL 原文、文件路径、连接串。
    - 后台（`/{adminEntry}/…`，`adminEntry` = 配置 `maccms.admin.entry`，例如 `/admin.php`）。以下 ADM-1～ADM-5 对本文件**每一个**后台
      operation 生效，各 operation 的 `responses` 用 `$ref` 引用公共响应，不再逐条重复文字：
      * ADM-1 处理顺序（基线 `AdminController.handle`，本期不改）：控制器不存在 → 404 → 来源校验 SRC-1（不通过 → `ADMIN_SOURCE_REJECTED`）
        → 未登录或管理员已停用/改密/删除 → **302**，`Location: <adminEntry>/admin/index/login.html`，空正文（`ADMIN_UNAUTHENTICATED`，
        Ajax 请求同样 302）→ 无 `x-permission` 权限 → HTTP 200 PHP 失败体 `lang(permission_denied)`=“您没有权限访问此页面”
        （`ADMIN_PERMISSION_DENIED`，Ajax 为 JSON，非 Ajax 为跳转提示页）→ 进入各 operation。
      * ADM-2 Ajax 判定：请求头 `X-Requested-With: XMLHttpRequest`（不分大小写）或参数 `_ajax` 为 PHP 真值。
        - 动作类 operation 的 200：Ajax → `application/json; charset=utf-8`，正文 `LegacyJson`（成功 `code=1`；失败 `Error`，`code=0`）；
          非 Ajax → `text/html; charset=utf-8` 的 PHP 跳转提示页（`AdminJumpPage`：成功/失败图标 + `msg` + 跳转地址 + 3 秒等待；
          失败时跳转地址为“返回上一页”）。两种形态携带同一 `msg` 文本，状态码都是 200。
        - 页面类 operation（GET 打开页面）的 200：非 Ajax → 整页 HTML；Ajax → 整页 HTML 的 JSON 字符串（B12 `AdminResponses.page`）。
      * ADM-3 来源校验（CSRF 第一道，基线 D-B12-3，SRC-1）：除登录页、框架页的 GET 外，所有后台请求（GET 与 POST）都要求
        `Sec-Fetch-Site` ∈ {same-origin, none}；没有该头时 `Origin`（没有则取 `Referer` 的源）必须等于后台源。不通过 → `ADMIN_SOURCE_REJECTED`：
        Ajax 为 HTTP 200 JSON `{"code":0,"msg":"非法请求","data":"","url":"","wait":3}`，非 Ajax 为 HTTP 403 提示页（标题“跳转提示”，正文“非法请求”）。
        SRC-2（本契约补定，只对下面 ADM-4 的 B 类无令牌写操作）：三个来源头都缺失时同样按 `ADMIN_SOURCE_REJECTED` 拒绝，不执行
        （基线对“三个头都缺失”放行，B 类写操作不再放行）。后台页面自身的请求一定带其中之一：现代浏览器发 `Sec-Fetch-Site`；
        后台响应头 `Referrer-Policy: same-origin` 保证同源请求带 `Referer`。
      * ADM-4 写操作的 CSRF 分类（逐项见 `x-csrf-policy`，**无遗漏**：本文件中每个有副作用的后台 operation 都属于 A 或 B 之一）：
        - **A 类 = 只接受 POST + 必填表单令牌 `__token__`**：`database/sql`（POST）、`database/import`、`database/recover`、`database/acknowledge`、
          `template/info`（POST 保存）。令牌由对应页面 GET 签发（隐藏字段 `__token__`），按 B12 `AdminForms.check` 校验并**一次性作废**：
          缺失或为空 → `FORM_TOKEN_INVALID`（`lang(illegal_request)`=“非法请求”）；与会话不一致或已用过 → `FORM_TOKEN_INVALID`
          （`lang(token_err)`=“请不要重复提交表单”）。令牌校验在取锁、读运行记录、读文件之前，失败时什么都不做。
          用 GET 访问只接受 POST 的 A 类动作 → 不校验令牌、不执行，返回各 operation 写明的固定失败体。
        - **B 类 = 方法与入参同 PHP / B15、不带表单令牌**：`database/optimize`、`database/repair`、`database/export`、`database/del`、`template/del`、
          `index/clear`、`make/*`、`collect/api`、`collect/timing`、`images/sync`。理由：技术设计 v8（G1 PASS）对这些入口规定“入参与 JSON 结构不变 /
          同 PHP / 同 B15”（C-54、DBT-1、DBT-4、§6.11、§6.12、§6.15），且旧后台公共脚本 `static/js/admin_common.js` 以 `$.get(href)` 无令牌调用
          （`.j-tr-del` 第 283-297 行、`.j-ajax` 第 304-315 行），加令牌须同时改页面与公共脚本，超出设计边界。B 类的 CSRF 防护 = SRC-1 + SRC-2
          + 会话 cookie `SameSite=Strict` + `x-permission` 权限码；登记为 `CSRF-EX-1`（见 `x-csrf-policy`），不是对风险的接受：跨站与同站其他子域发起的请求
          由 `Sec-Fetch-Site`/`Origin`/`Referer` 拒绝，三者都缺失的请求由 SRC-2 拒绝。
      * ADM-5 路由与 `.html` 后缀、参数来源沿用 B12：`input()` = 查询串 + POST 表单 + 路由参数（`/name/value` 段）合并，**后者覆盖前者**
        （路由参数 > POST 表单 > 查询串）。各 operation 只声明本期客户端应使用的位置；其他位置的同名参数按此合并规则生效。
    - 前台：路由沿用现有 `site` 控制器（`/index.php/<c>/<a>` 与无 `index.php` 的短地址两种写法）；HTML 页一律
      `text/html; charset=utf-8` 并带 API-003 的 CSP 头；ajax JSON 为 `application/json; charset=utf-8`，
      编码同 PHP `json_encode(…, JSON_UNESCAPED_UNICODE)`。
    - 幂等：本期接口均为 PHP 已有的表单/ajax 动作，不引入 `Idempotency-Key`。数据库工具的重复提交由 `dbtool.lock` 互斥与
      运行记录状态机约束（DBT-5 ④⑤），各操作的幂等性写在对应 operation 的 `x-idempotency`。
    - 示例数据均为虚构，域名一律 `example.com`。
  x-changelog:
    - version: 1.0.0
      date: 2026-11-01
      change: 首版。依据技术设计 v8 @ 20490951e1a9c880e975caee0c72c5e0e92120ed，覆盖 OP-T4=a、OP-T5=a、OP-T6=b 与数据库工具运行记录/锁/恢复动作。
      breaking: false
    - version: 1.1.0
      date: 2026-11-01
      change: |
        回应后端契约评审第 1 轮（评论 01a19544-71f2-785c-89ca-77f26f43c728）：
        REV-API-1 API-007、API-016、API-021 增加 GET operation，API-020 增加 GET（编辑页）operation，方法集合与基线 Java 路由、PHP 一致；
        REV-API-2 写操作分 A 类（POST + 必填 __token__）/ B 类（同 PHP 无令牌，SRC-1 + 新增 SRC-2 来源校验），`x-csrf-policy` 逐项登记；
        API-011/012 由 v1.0.0 误写的“POST + __token__”更正为 B 类 GET/POST（旧页面按钮以 GET 无令牌调用，C-54 不改 export 页）；
        REV-API-3 API-016 的 id 位置按 input() 合并规则写全（GET 查询串；POST 表单或查询串）；
        REV-API-4 所有后台动作 200 同时声明 JSON 与 HTML 跳转页，公共响应 302 / 403 / 无权限；
        REV-DB-1 API-017 幂等性改为按状态描述，补处理顺序、锁、run 匹配、GET 结果；
        REV-SEC-1 API-044 删除匿名空 security 对象，补 403 固定正文，声明 GET/POST；
        REV-TRACE-1 新增“上游决策台账”，OP-15/OP-16 取 Issue 记录的唯一值并同步 x-trace；
        另更正 API-021 错误码（同 PHP：不合规路径静默跳过，恒返回 del_ok）、API-014 GET 与空 id 的错误码分离。
      breaking: false
      breaking-note: 尚无实现与调用方；变更只放宽请求方法或更正描述，使契约与 PHP / 基线一致。
servers:
  - url: /
    description: 站点根（相对路径；前台与安装向导）

# 后台接口的 servers（Server Object 不支持 $ref，用 YAML 锚点复用）
x-admin-servers: &adminServers
  - url: "{adminEntry}"
    description: 后台入口（maccms.admin.entry）
    variables:
      adminEntry:
        default: /admin.php
        description: 部署配置 MACCMS_ADMIN_ENTRY 的值

tags:
  - name: site
    description: 前台（`maccms.site.enabled=true` 时装配）
  - name: admin-database
    description: 后台数据库工具（FR-9）
  - name: admin-template
    description: 后台模板管理（FR-7）
  - name: admin-make
    description: 后台静态生成（FR-6）
  - name: admin-collect
    description: 后台在线采集、远程图片（FR-11）
  - name: install
    description: 安装向导（FR-10）
  - name: api
    description: api.php 入口

x-cross-cutting:
  - x-api-id: API-003
    summary: 前台 HTML 页通用响应头与 CSP（OP-T6=b）
    x-trace: [FR-5, AC-5, AC-17, ALIGN-5, DEC-11, OP-T6, V-32]
    applies-to: 前台所有返回 HTML 的响应——全部页面控制器、跳转/提示页（JumpPages）、站点关闭页、404 页、验证码页、浏览器提示页、站点异常页（SitePageResponses 是唯一出口，C-70）
    headers:
      Content-Type: "text/html; charset=utf-8（常量只用 SiteRequests.HTML_UTF8）"
      Content-Security-Policy: "object-src 'none'; base-uri 'self'; frame-ancestors 'self'（逐字，唯一来源 C-75 SiteSecurityHeaders.frontPolicy()，恒有值，没有过渡值）"
    rules:
      - 所有前台 HTML 页都发同一条 CSP，不再有会员页 nonce、播放器 frame 策略（PlayerFramePolicy）、支付网关 form-action 变体。
      - CSP 不限制脚本：模板内联脚本（如 public/jump.html 倒计时）、player.js 的 document.write、支付网关自动提交表单都能运行（V-32 ⑥）。
      - 站点不能被其他源用 iframe 嵌入（frame-ancestors 'self'）；同源嵌入允许。
      - 非 HTML 响应（ajax JSON、RSS/地图 XML、/template/** 静态资源、/api/v1/**）不加该头；RSS/地图与 ajax 的 Content-Type 按 PHP 控制器（PRE-2 基线记录值）。
      - 缓存头按 SitePageResponses 的 CacheMode（NO_CACHE / NO_STORE）与 Vary 规则（C-70、§4.11 方案 E）；本期不改缓存头取值。
  - x-api-id: API-004
    summary: 站点关闭（ALIGN-1）
    x-trace: [FR-5, AC-5, ALIGN-1, CMP-3]
    before: 503 + Retry-After + jte 关闭页
    after: 状态码与页面按 PHP `public/close`（Base.php:77），即 HTTP 200 + 模板包 public/close 原样输出；不再发 Retry-After
  - x-api-id: API-005
    summary: 前台未匹配地址（ALIGN-2）
    x-trace: [FR-5, AC-5, ALIGN-2, F-D2, OP-16, BR-12]
    before: JSON 404「接口不存在」
    after: |
      除 /api/v1/**、/api.php/**、后台入口之外的未匹配站点路径 → PHP `_empty` → `page_error`：HTTP 404 +
      `public/<app.page_404>`（配置为空时 `public/jump`）的模板输出（HTML，带 API-003 头）；模板缺失 → “模板文件不存在”页（TemplateNotFoundPage）。
      OP-16=a（上游决策台账第 2 行）：模板包缺的页面不补，任何前台页面的模板文件不存在时都输出同一“模板文件不存在”页（BR-12），
      消息中的目录取 PATH-3（`/template/<template_dir>/<html_dir>/`），与 PHP `think_exception.tpl` 的输出按 PRD 附表 B/F 对照。
      /api/v1/** 的未匹配地址仍返回原 JSON 404，不变。
  - x-api-id: API-006
    summary: 搜索过快（ALIGN-6）
    x-trace: [FR-5, AC-5, ALIGN-6]
    before: 429 + Retry-After + jte 提示页
    after: PHP `check_search`：HTTP 200 + `public/jump` 错误提示，msg = lang('search_frequently') + search_timespan + lang('seconds')；无 Retry-After；计时规则（只算第 1 页、被拒也刷新）不变

paths:
  # ───────────────────────────── 前台 ─────────────────────────────
  /template/{dir}/{assetPath}:
    get:
      tags: [site]
      operationId: getTemplateAsset
      x-api-id: API-001
      x-trace: [FR-1, FR-5, AC-5, AC-17, DEC-3, DEC-8, PATH-2, PATH-4, SEC-7, OP-15, OP-T5, V-18]
      summary: 读取模板包静态资源（白名单，OP-T5=a）
      description: |
        PHP 由 Web 服务器直接返回 template/ 下的文件；Java 由 `TemplateAssetController`（C-43）提供，放行规则只在
        `LegacySiteFiles.readTemplateAsset`（C-44）一处实现。

        **放行条件（全部满足才 200，否则一律 404，不区分原因、不回显路径）**
        1. `{dir}` 是站点根 `template/` 下实际存在的子目录（不限 default_pc/default_wap，跟随配置）。模板引用的 URL 前缀按 OP-15（上游决策台账第 1 行）：
           `{$maccms.path_tpl}`=`/template/<template_dir>/`（PATH-2），`{$maccms.path_ads}`=`/template/<template_dir>/ads/`（PATH-4），
           所以官方包的 `{$maccms.path_tpl}css/style.css` 请求的是 `/template/default_pc/css/style.css`；`html/` 子目录下的模板源码不在第 2 条的放行目录内。
        2. `{assetPath}` 的第一段是 `css`、`js`、`images`、`ads` 之一，其后至少还有一段文件名（可有多级子目录）。
