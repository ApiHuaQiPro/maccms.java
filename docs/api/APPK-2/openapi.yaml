          x-route-value: "数值等于 5（PHP 宽松比较）"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/InstallStep5Form" }
            examples:
              ok: { value: { account: admin, password: "Example123", install_dir: "/", initdata: "1", __token__: "0123456789abcdef0123456789abcdef" } }
      responses:
        "200":
          description: Ajax → JSON（成功 `code=1`；失败 `Error`）；非 Ajax → 安装向导跳转提示页；已安装 → INSTALL_LOCKED 纯文本页
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LegacyJson"
                  - $ref: "#/components/schemas/Error"
              examples:
                ok: { value: { code: 1, msg: "系统安装成功，欢迎您使用苹果CMS建站", data: "", url: "/admin.php", wait: 3 } }
                token: { value: { code: 0, msg: "非法访问", data: "", url: "", wait: 3 } }
                tables: { value: { code: 0, msg: "已存在数据表", data: "", url: "", wait: 3 } }
            text/html:
              schema: { type: string, description: 安装向导跳转提示页，或 INSTALL_LOCKED 固定文本 }
        "500":
          description: 未预期异常或表单超过 1 MiB（同基线 InstallEndpoint）：固定“系统错误”页，不含异常细节
