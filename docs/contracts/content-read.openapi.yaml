        - $ref: '#/components/parameters/OrderDesc'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Level'
        - $ref: '#/components/parameters/Letter'
        - name: sex
          in: query
          required: false
          description: 性别 actor_sex，精确匹配（旧 sex）。文本参数通用规则见 info.description。
          schema: {type: string, maxLength: 1, pattern: '^(?:[^\s,\x00-\x1F\x7F-\x9F\uD800-\uDFFF\uFFFD](?:[^,\x00-\x1F\x7F-\x9F\uD800-\uDFFF\uFFFD]*[^\s,\x00-\x1F\x7F-\x9F\uD800-\uDFFF\uFFFD])?)?$'}
        - name: area
          in: query
          required: false
          description: 地区 actor_area，精确匹配（旧 area，新版单值）。
          schema: {type: string, maxLength: 20, pattern: '^(?:[^\s,\x00-\x1F\x7F-\x9F\uD800-\uDFFF\uFFFD](?:[^,\x00-\x1F\x7F-\x9F\uD800-\uDFFF\uFFFD]*[^\s,\x00-\x1F\x7F-\x9F\uD800-\uDFFF\uFFFD])?)?$'}
        - name: starSign
          in: query
