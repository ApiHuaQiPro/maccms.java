  /api/v1/actors:
    get:
      tags: [content]
      operationId: listActors
      summary: 【1.2.0】演员分页列表
      description: |
        返回 actor_status=1 且所属演员分类可见的演员。`categoryId` 规则同文章列表。排序白名单同视频列表（不含旧 rnd、in），
        默认 `time` 倒序，再按 `id` 同方向排序。
      parameters:
        - $ref: '#/components/parameters/CategoryId'
