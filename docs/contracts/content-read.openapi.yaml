openapi: 3.0.3
info:
  title: MacCMS 内容只读接口（首批）
  version: 1.1.0
  description: |
    MacCMS 重构首批对外接口（MACC-4）：视频分类、视频分页列表、视频公开详情元数据、健康检查。
    1.1.0（MACC-18，方案 docs/architecture/09-content-search-filter-plan.md，以下简称"09 方案"）在
    `GET /api/v1/videos` 上向后兼容地增加 6 个可选搜索/筛选参数（keyword、area、lang、year、level、classes），
    其余路径、所有响应 schema 与错误码不变。

    本文件是前后端契约，后端实现位于 backend/ 的 content 模块，HTTP 契约测试
    （backend/src/test/java/com/maccms/backend/content/ContentApiContractTest.java）逐字段比对响应与本文件中的 schema。
    修改接口必须同时修改本文件和测试，规则见 docs/architecture/02-agent-development-rules.md。

    通用约定：
    - 只有 GET；所有响应为 `application/json; charset=UTF-8`。
    - 所有字段都会输出，不省略：字符串缺省为 `""`，数字缺省为 `0`，不会出现 `null`。
    - 文本字段原样返回库内值（可能含后台录入时转义过的 HTML 实体）；图片字段可能是相对路径、完整 URL
      或旧系统的 `mac://` 前缀，地址规范化不在本批范围。
    - 时间字段是 Unix 时间戳（秒，整数），与旧库存储一致。
    - 未声明的查询参数会被忽略；值为空字符串的参数按"未传"处理。
    - 访问者一律按旧系统的游客（会员组 group_id=1）身份判定可见性；本批不识别登录态。
    - 本批不提供：播放/下载地址与授权、观看密码校验、收费/积分、会员、Provide 资源站协议、采集、后台写入、
      全文检索/相关度排序、演员/导演/标签等其他搜索条件、文章/专题/演员等其他内容类型。

    参数取值的约定（1.1.0 起写明，1.0.0 的既有参数行为不变）：
    - 每个参数的 schema（maxLength、pattern、minimum/maximum）**直接作用于原始解码值**——查询串按
      application/x-www-form-urlencoded 解码**一次**后的字符串（`+` 为空格，不再二次解码）。服务端**不做任何裁剪或改写**。
    - 原始解码值为空字符串时按"未传"处理，不做 schema 校验（integer 参数无法在 schema 中表达这一点，以本条为准）。
    - integer 参数（categoryId、page、pageSize、level）的 minimum/maximum **只约束数值**；原始字符串另有词法约束：
      只含 ASCII 数字、最多 10 个字符（允许前导 0），如 `00000000009` 数值为 9 但长度 11 → 400。
    - pattern 按 OpenAPI 3.0 规定的 ECMA-262 方言解释；maxLength 按 Unicode 码点计。由于 U+FFFF 以上字符被禁用，两种计数一致。
    - 既有参数重复出现时与 1.0.0 相同：各值以逗号连接后按原规则校验（如 `page=1&page=2` → 400 page）。
    - 既有参数或未声明参数的百分号编码不是合法 UTF-8 时，与 1.0.0 相同，整个请求被容器拒绝并返回 500 `INTERNAL_ERROR`；
      只有 1.1.0 新参数的非法编码返回 400（见下）。

    1.1.0 新参数的通用规则（09 方案第 4 节）：
    - 禁用字符：U+0000–U+001F、U+007F–U+009F、U+D800–U+DFFF（U+FFFF 以上字符或非法 UTF-8 的残留）、U+FFFD。
      查询串中非法 UTF-8 的百分号编码（如 `keyword=%FF`、`keyword=%`）同样 → 400（field 为该参数）。
    - 空白字符 W = ECMAScript `\s`（U+0009–U+000D、U+0020、U+00A0、U+1680、U+2000–U+200A、U+2028、U+2029、U+202F、U+205F、U+3000、U+FEFF）。
      文本参数首尾不得为 W 字符（因此仅含空白的值也 → 400）；中间的空白原样保留。去首尾空白由调用方（如 SSR 页面）负责。
    - 每个新参数最多出现一次，重复出现（含空值，如 `area=&area=`）→ 400。area、lang、classes 含半角逗号 `,` → 400（不支持多值）；
      keyword 中的逗号是字面字符（与旧 wd 一致）。
    - 校验顺序：既有 5 个参数（不变）→ keyword → area → lang → year → level → classes；每个参数内依次为
      重复 → 空串（未传）→ 搜索开关（keyword/classes）→ 禁用字符/非法 UTF-8 → 逗号 → 首尾空白 → 长度 → 格式（year；level 为
      先词法：只含 ASCII 数字且 ≤ 10 个字符，再数值：1..9，两步失败的文案相同）。
      只报第一个错误，fieldErrors 只有一项，message 为固定文案，不回显输入。参数错误（400）先于分类可见性检查（404）。
    - 输入 → 结果对照（与 09 方案第 4.4 节同表）：
      | 原始解码值 | keyword | area/lang/classes | year | level |
      | "" | 未传 | 未传 | 未传 | 未传 |
      | "   "（仅空白） | 400 首尾空白 | 400 首尾空白 | 400 年份格式 | 400 整数 |
      | " 2020" / "2020 " | 400 首尾空白 | 400 首尾空白 | 400 年份格式 | 400 整数 |
      | "a b" | 原样匹配 | 原样匹配 | 400 年份格式 | 400 整数 |
      | "a,b" | 字面匹配 | 400 多值 | 400 年份格式 | 400 整数 |
      | 超长 | 400 长度 | 400 长度 | 400 年份格式 | 400 整数 |
      | "09" | 原样匹配 | 原样匹配 | 400 年份格式 | 9 |
      | "0000000009"（10 位） | 原样匹配 | 原样匹配（lang 恰好 10 个码点，未超限） | 400 年份格式 | 9 |
      | "00000000009"（11 位） | 原样匹配 | area/classes 原样匹配；lang 400 长度 | 400 年份格式 | 400 整数（词法长度） |
      | "0" | 原样匹配 | 字面值 0 | 400 年份格式 | 400 整数 |
      | %FF（非法 UTF-8） | 400 字符 | 400 字符 | 400 年份格式 | 400 整数 |
    - 值原样比较，不做实体编码/解码以外的任何改写：不截断、不做大小写或全半角转换、不做 Unicode 规范化；
      大小写与尾随空格是否敏感由旧表列的排序规则（utf8_general_ci，不敏感）决定。
    - 所有条件之间为 AND；可见性（vod_status=1、分类可见、游客列表权限）与 1.0.0 相同，任何条件都不能扩大可见范围。
    - 包含匹配（keyword、classes）中的 `%`、`_`、`!` 按字面匹配，反斜线也是普通字符；用户输入从不作为列名、排序表达式或 SQL 片段。
    - 1.0.0 下被忽略的同名参数（如误传的 `keyword=x`）从 1.1.0 起生效；旧站参数名（wd、tid、by、class 等）仍属未声明参数，
      继续被忽略，不做别名。

    运行开关与成本控制（09 方案第 6 节）：
    - 后端开关 `maccms.content.search.enabled`（默认 **false**）控制包含匹配参数 keyword、classes；关闭时传入非空值 → 400。
      精确匹配参数 area、lang、year、level 不受该开关影响。
    - 带任一新参数的 count/分页语句有服务端执行时限（MAX_EXECUTION_TIME 3000 ms）；带 keyword/classes 的请求另有进程内
      并发上限 `maccms.content.search.max-concurrent`（默认 4，不排队）。超时或超过并发上限时返回 503 `SERVICE_UNAVAILABLE`，
      响应体与数据库不可用时逐字相同。不带新参数的请求不受这两项影响。
servers:
  - url: http://127.0.0.1:18280
    description: 本机开发（默认端口，见 backend/README.md）
tags:
  - name: content
    description: 视频分类与视频公开元数据（只读）
  - name: ops
    description: 运维
paths:
  /api/v1/video-categories:
    get:
      tags: [content]
      operationId: listVideoCategories
      summary: 视频分类树
      description: |
        返回公开可见的视频分类（mac_type.type_mid=1），按树形组织。一个分类可见，当且仅当：
        1. `type_status=1`；
        2. 游客组对该分类有"列表"权限（group_type 包含该分类，且 group_popedom 中权限位 1 非空）——
           后端开关 `maccms.content.enforce-guest-popedom=false` 时跳过此条；
        3. 上级分类同样可见（上级不可见的子分类不出现）。

        同级排序：`sort` 升序，再按 `id` 升序。没有可见分类时 `items` 为空数组。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/videos:
    get:
      tags: [content]
      operationId: listVideos
      summary: 视频分页列表（可按分类、关键字与筛选条件查询）
      description: |
        返回已审核（vod_status=1）且所属分类可见（规则同 /api/v1/video-categories）的视频；1.1.0 起可加搜索/筛选条件
        （参数取值与校验规则见 info.description）。

        - 传 `categoryId` 时，结果包含该分类及其可见的直接子分类下的视频（同 1.0.0）。分类不存在或不可见时返回 404
          `CATEGORY_NOT_FOUND`（与是否带其他条件无关）。
        - 新条件与 `categoryId` 之间为 AND。count 与分页查询使用同一组条件（共享 SQL 片段）。
        - 既有参数 categoryId、sort、order、page、pageSize 的 schema 与描述沿用 1.0.0；带新条件时它们的取值、默认值、
          上限与错误文案都不变。
        - 不带任何新参数时，SQL、响应、排序、分页与错误与 1.0.0 完全相同。
        - 排序：按 `sort` 字段，`order` 方向，再按视频 `id` 同方向排序，带条件时同样保证分页稳定（同 1.0.0）。
        - `page` 超过总页数时返回 200，`items` 为空数组，`total`/`totalPages` 仍为实际值（同 1.0.0）。
        - 列表项字段与 1.0.0 相同，不含正文、播放/下载地址、观看密码、积分、会员信息。
      parameters:
        - name: categoryId
          in: query
          required: false
          description: 分类 ID（mac_type.type_id）。
          schema:
            type: integer
            minimum: 1
            maximum: 65535
        - name: keyword
          in: query
          required: false
          description: |
            【1.1.0，受 maccms.content.search.enabled 控制】关键字，包含匹配（旧 vod/search 的 wd，
            application/common/model/Vod.php:462-468）。命中条件：`vod_name`、`vod_sub`、`vod_en` 任一列包含该关键字
            （字段集合固定，对应仓库配置 `search_vod_rule='vod_en|vod_sub'`，application/extra/maccms.php:70；
            线上取值待核实，见 09 方案决策 D1）。
            关键字含 `& " ' < >` 时，另以其 HTML 实体形式（`&amp; &quot; &#039; &lt; &gt;`）各匹配一次，两者为 OR，
            兼容以 mac_filter_xss（application/common.php:1222-1225）转义后存库的值；输入中本来就有的实体不解码。
            schema 作用于原始解码值（不裁剪）：空串 = 未传；否则最多 64 个码点，首尾不得为空白字符，不得含禁用字符；
            允许半角逗号，按字面匹配（与旧 wd 一致，不拆分多值）。
          schema:
            type: string
            maxLength: 64
            pattern: '^(?:[^\s\x00-\x1F\x7F-\x9F\uD800-\uDFFF\uFFFD](?:[^\x00-\x1F\x7F-\x9F\uD800-\uDFFF\uFFFD]*[^\s\x00-\x1F\x7F-\x9F\uD800-\uDFFF\uFFFD])?)?$'
          example: 合成影片
        - name: area
          in: query
          required: false
          description: |
            【1.1.0】地区，精确匹配 `vod_area`（旧 application/common/model/Vod.php:299-301）。候选值可取自分类的
            `extend.area`（CategoryExtend，逗号分隔）。schema 作用于原始解码值（不裁剪）：空串 = 未传；否则单值，
            最多 20 个码点（列宽 varchar(20)，application/install/sql/install.sql:713），首尾不得为空白字符，
            不得含半角逗号或禁用字符。
          schema:
            type: string
            maxLength: 20
            pattern: '^(?:[^\s,\x00-\x1F\x7F-\x9F\uD800-\uDFFF\uFFFD](?:[^,\x00-\x1F\x7F-\x9F\uD800-\uDFFF\uFFFD]*[^\s,\x00-\x1F\x7F-\x9F\uD800-\uDFFF\uFFFD])?)?$'
          example: 大陆
        - name: lang
          in: query
          required: false
          description: |
            【1.1.0】语言，精确匹配 `vod_lang`（旧 application/common/model/Vod.php:302-304）。schema 作用于原始解码值
            （不裁剪）：空串 = 未传；否则单值，最多 10 个码点（varchar(10)，application/install/sql/install.sql:714），
            首尾不得为空白字符，不得含半角逗号或禁用字符。
          schema:
            type: string
            maxLength: 10
            pattern: '^(?:[^\s,\x00-\x1F\x7F-\x9F\uD800-\uDFFF\uFFFD](?:[^,\x00-\x1F\x7F-\x9F\uD800-\uDFFF\uFFFD]*[^\s,\x00-\x1F\x7F-\x9F\uD800-\uDFFF\uFFFD])?)?$'
          example: 国语
        - name: year
          in: query
          required: false
          description: |
            【1.1.0】年份，精确匹配 `vod_year`（按字符串比较；旧 application/common/model/Vod.php:183-186,296-298）。
            schema 作用于原始解码值（不裁剪）：空串 = 未传；否则必须恰为 4 位 ASCII 数字，带首尾空白、全角数字、
            旧站的 `YYYY-YYYY` 区间写法均 → 400（message "必须是 4 位数字年份"）。
          schema:
            type: string
            pattern: '^(?:[0-9]{4})?$'
          example: '2020'
        - name: level
          in: query
          required: false
          description: |
            【1.1.0】推荐等级，精确匹配 `vod_level`（旧 application/common/model/Vod.php:290-295；URL 中经 intval 只能是单值）。
            解析规则与 1.0.0 的 page/pageSize 相同（VideoListQuery.parseInt）。不传表示不筛选（等级 0 不能单独筛选）。
            schema 的 minimum/maximum 只约束数值 1..9；**原始字符串额外约束**（schema 未覆盖）按以下顺序校验：
            1. 原始解码值为空串 → 未传；
            2. 词法：只含 ASCII 数字且最多 10 个字符（允许前导 0），否则 400；
            3. 数值：按十进制取值须在 1..9，否则 400。
            2、3 失败的 message 都是"必须是 1 到 9 之间的整数"。三步合起来等价于原始字符串匹配
            `x-maccms-raw-pattern`（最多 9 个前导 0 加一个 1–9 数字；空串 = 未传）。
            例：`9`、`09`、`0000000009` → 9；`00000000009`（数值 9，长度 11）→ 400；`0`、`10` → 400；
            ` 9`、`+9`、`9.0`、`all` → 400。
          schema:
            type: integer
            minimum: 1
            maximum: 9
          x-maccms-raw-pattern: '^(?:0{0,9}[1-9])?$'
          example: 9
        - name: classes
          in: query
          required: false
          description: |
            【1.1.0，受 maccms.content.search.enabled 控制】扩展分类（剧情类型），包含匹配 `vod_class`（与旧
            `vod_class LIKE '%值%'` 语义一致，application/common/model/Vod.php:475-477；例如 `动作` 也会命中 `动作冒险`）。
            与响应字段 `classes`、CategoryExtend.classes 同名。schema 作用于原始解码值（不裁剪）：空串 = 未传；
            否则单值，最多 32 个码点，首尾不得为空白字符，不得含半角逗号或禁用字符。
          schema:
            type: string
            maxLength: 32
            pattern: '^(?:[^\s,\x00-\x1F\x7F-\x9F\uD800-\uDFFF\uFFFD](?:[^,\x00-\x1F\x7F-\x9F\uD800-\uDFFF\uFFFD]*[^\s,\x00-\x1F\x7F-\x9F\uD800-\uDFFF\uFFFD])?)?$'
          example: 剧情
        - name: sort
          in: query
          required: false
          description: |
            排序字段，默认 `time`（更新时间）。对应旧库列：time=vod_time，time_add=vod_time_add，id=vod_id，
            score=vod_score，hits=vod_hits，hits_day/hits_week/hits_month=对应点击数，up=vod_up，down=vod_down，
            level=vod_level（推荐等级）。不支持旧系统的 rnd（随机）。
          schema:
            type: string
            enum: [time, time_add, id, score, hits, hits_day, hits_week, hits_month, up, down, level]
            default: time
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [desc, asc]
            default: desc
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始。
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: pageSize
          in: query
          required: false
          description: 每页条数。
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoPage'
              examples:
                filtered:
                  summary: keyword=合成影片&area=大陆&page=1&pageSize=1（合成数据）
                  value:
                    items:
                      - id: 9001
                        name: 合成影片甲
                        subTitle: ''
                        enName: hechengyingpianjia
                        letter: H
                        color: ''
                        category: {id: 1, name: 合成分类, enName: hechengfenlei, parentId: 0}
                        classes: 剧情
                        tag: ''
                        pic: upload/vod/synthetic.jpg
                        picThumb: ''
                        picSlide: ''
                        actor: 合成演员
                        director: 合成导演
                        blurb: 合成简介
                        remarks: 更新至10集
                        area: 大陆
                        lang: 国语
                        year: '2020'
                        version: ''
                        state: ''
                        serial: '10'
                        total: 20
                        finished: false
                        level: 0
                        copyright: false
                        score: 8.5
                        scoreNum: 12
                        hits: 100
                        hitsDay: 1
                        hitsWeek: 7
                        hitsMonth: 30
                        up: 3
                        down: 0
                        updatedAt: 1760000000
                        addedAt: 1750000000
                        detailPasswordRequired: false
                    page: 1
                    pageSize: 1
                    total: 3
                    totalPages: 3
                empty:
                  summary: 没有命中（200，不是 404）
                  value:
                    items: []
                    page: 1
                    pageSize: 20
                    total: 0
                    totalPages: 0
        '400':
          description: |
            参数不合法（code=INVALID_PARAMETER），fieldErrors 只含第一个出错的参数（校验顺序见 info.description）。
            新增的 400 情形只在带新参数时出现：重复、开关关闭时使用 keyword/classes、含禁用字符或非法 UTF-8、
            area/lang/classes 含逗号、首尾空白（含仅空白）、超长、year 格式不符、level 词法（非 ASCII 数字或原始字符串超过 10 个字符）或数值（不在 1..9）不符。message 为下列固定文案之一，不回显用户输入：
            参数不能重复 / 当前未开放关键字搜索 / 含不允许的字符 / 不支持多个取值 / 首尾不能有空白字符 /
            长度不能超过 N 个字符 / 必须是 4 位数字年份 / 必须是 1 到 9 之间的整数。
            既有参数的 400 与 1.0.0 相同（如 pageSize 越界）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPageSize:
                  summary: 既有参数越界（同 1.0.0）
                  value:
                    code: INVALID_PARAMETER
                    message: 请求参数不合法
                    fieldErrors:
                      - field: pageSize
                        message: 必须是 1 到 100 之间的整数
                duplicate:
                  summary: 同一新参数出现两次（含 area=&area=）
                  value:
                    code: INVALID_PARAMETER
                    message: 请求参数不合法
                    fieldErrors:
                      - field: area
                        message: 参数不能重复
                disabled:
                  summary: maccms.content.search.enabled=false 时使用非空 keyword
                  value:
                    code: INVALID_PARAMETER
                    message: 请求参数不合法
                    fieldErrors:
                      - field: keyword
                        message: 当前未开放关键字搜索
                badChar:
                  summary: keyword=%FF（非法 UTF-8）或含控制字符、U+FFFF 以上字符
                  value:
                    code: INVALID_PARAMETER
                    message: 请求参数不合法
                    fieldErrors:
                      - field: keyword
                        message: 含不允许的字符
                multiValue:
                  summary: lang 含半角逗号（首批不支持多值）
                  value:
                    code: INVALID_PARAMETER
                    message: 请求参数不合法
                    fieldErrors:
                      - field: lang
                        message: 不支持多个取值
                surroundingWhitespace:
                  summary: keyword 仅含空白，或首尾带空白（如 " 合成"）
                  value:
                    code: INVALID_PARAMETER
                    message: 请求参数不合法
                    fieldErrors:
                      - field: keyword
                        message: 首尾不能有空白字符
                tooLong:
                  summary: keyword 超过 64 个码点
                  value:
                    code: INVALID_PARAMETER
                    message: 请求参数不合法
                    fieldErrors:
                      - field: keyword
                        message: 长度不能超过 64 个字符
                badYear:
                  summary: year=2020-2022 或 year=%202020（首尾空白）
                  value:
                    code: INVALID_PARAMETER
                    message: 请求参数不合法
                    fieldErrors:
                      - field: year
                        message: 必须是 4 位数字年份
                badLevel:
                  summary: level=0 或 level=10（数值越界）
                  value:
                    code: INVALID_PARAMETER
                    message: 请求参数不合法
                    fieldErrors:
                      - field: level
                        message: 必须是 1 到 9 之间的整数
                levelTooManyDigits:
                  summary: level=00000000009（数值为 9，但原始字符串 11 个字符，超过词法上限 10，schema 的 minimum/maximum 不能表达）
                  value:
                    code: INVALID_PARAMETER
                    message: 请求参数不合法
                    fieldErrors:
                      - field: level
                        message: 必须是 1 到 9 之间的整数
        '404':
          description: 分类不存在或不可见（code=CATEGORY_NOT_FOUND），同 1.0.0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: CATEGORY_NOT_FOUND
                message: 分类不存在
                fieldErrors: []
        '503':
          description: |
            服务暂时不可用（code=SERVICE_UNAVAILABLE），响应体与 1.0.0 的数据库不可用逐字相同。新增两种触发原因：
            带任一新参数时单条语句超过服务端执行时限；带 keyword/classes 时包含匹配并发达到上限。
            客户端不应区分原因，可稍后重试。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: SERVICE_UNAVAILABLE
                message: 服务暂时不可用
                fieldErrors: []
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/videos/{id}:
    get:
      tags: [content]
      operationId: getVideo
      summary: 视频公开详情元数据
      description: |
        返回单个视频的公开元数据。**这不是播放授权**：不含播放/下载地址、试看、积分或会员信息。

        判定顺序：
        1. 视频不存在、未审核（vod_status≠1）、所属分类不可见、或游客组对该分类没有"详情"权限（权限位 2）
           → 404 `VIDEO_NOT_FOUND`（不区分原因，不暴露视频是否存在）；
        2. 视频设置了观看密码（vod_pwd 非空）→ 403 `VIDEO_PASSWORD_REQUIRED`，不返回任何视频字段；
        3. 视频标记版权（vod_copyright=1）且后端开关 `maccms.content.copyright-hides-detail=true`（默认）
           → 403 `VIDEO_COPYRIGHT_RESTRICTED`；
        4. 其他情况 → 200。
      parameters:
        - name: id
          in: path
          required: true
          description: 视频 ID（mac_vod.vod_id）。
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 4294967295
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoDetail'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '403':
          description: 需要观看密码（VIDEO_PASSWORD_REQUIRED）或因版权不提供详情（VIDEO_COPYRIGHT_RESTRICTED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: VIDEO_PASSWORD_REQUIRED
                message: 该视频详情需要观看密码
                fieldErrors: []
        '404':
          description: 视频不存在或不可见（code=VIDEO_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: VIDEO_NOT_FOUND
                message: 视频不存在
                fieldErrors: []
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /actuator/health:
    get:
      tags: [ops]
      operationId: health
      summary: 健康检查
      description: 只返回整体状态（含数据库连通性），不返回组件明细、版本或配置。数据库不可用时返回 503 与 DOWN。
      responses:
        '200':
          description: 服务与数据库可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: UP
        '503':
          description: 服务或数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: DOWN
components:
  responses:
    InvalidParameter:
      description: 参数不合法（code=INVALID_PARAMETER），fieldErrors 指出具体参数
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_PARAMETER
            message: 请求参数不合法
            fieldErrors:
              - field: pageSize
                message: 必须是 1 到 100 之间的整数
    ServiceUnavailable:
      description: 数据库暂时不可用（code=SERVICE_UNAVAILABLE）。/api/v1/videos 带 1.1.0 新参数时另有两种原因，见该操作的 503
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 未预期的服务器错误（code=INTERNAL_ERROR），不包含内部细节
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, fieldErrors]
      description: |
        统一错误响应。code 取值与 HTTP 状态：
        INVALID_PARAMETER=400，CATEGORY_NOT_FOUND=404，VIDEO_NOT_FOUND=404，VIDEO_PASSWORD_REQUIRED=403，
        VIDEO_COPYRIGHT_RESTRICTED=403，NOT_FOUND=404（路径不存在），METHOD_NOT_ALLOWED=405，
        SERVICE_UNAVAILABLE=503，INTERNAL_ERROR=500。前端应按 code 分支，message 仅供展示。
      properties:
        code:
          type: string
          enum: [INVALID_PARAMETER, CATEGORY_NOT_FOUND, VIDEO_NOT_FOUND, VIDEO_PASSWORD_REQUIRED,
                 VIDEO_COPYRIGHT_RESTRICTED, NOT_FOUND, METHOD_NOT_ALLOWED, SERVICE_UNAVAILABLE, INTERNAL_ERROR]
        message:
          type: string
        fieldErrors:
          type: array
          description: 仅 INVALID_PARAMETER 时非空。
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: 出错的参数名（如 page、pageSize、sort、order、categoryId、id；1.1.0 起另有 keyword、area、lang、year、level、classes）。
        message:
          type: string
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
    CategoryListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: 顶级分类（parentId=0），子分类在各自的 children 中。
          items:
            $ref: '#/components/schemas/Category'
    Category:
      type: object
      additionalProperties: false
      required: [id, name, enName, sort, parentId, title, keywords, description, logo, pic, extend, children]
      properties:
        id:
          type: integer
          description: mac_type.type_id
        name:
          type: string
          description: type_name
        enName:
          type: string
          description: type_en（拼音/英文别名）
        sort:
          type: integer
          description: type_sort
        parentId:
          type: integer
          description: type_pid，顶级为 0
        title:
          type: string
          description: type_title（SEO 标题）
        keywords:
          type: string
          description: type_key（SEO 关键词）
        description:
          type: string
          description: type_des（SEO 描述）
        logo:
          type: string
          description: type_logo
        pic:
          type: string
          description: type_pic
        extend:
          $ref: '#/components/schemas/CategoryExtend'
        children:
          type: array
          description: 可见的子分类，排序规则同上；没有时为空数组。
          items:
            $ref: '#/components/schemas/Category'
    CategoryExtend:
      type: object
      additionalProperties: false
      required: [classes, area, lang, year, star, director, state, version]
      description: |
        type_extend（JSON）中供前台筛选的候选值，原样返回逗号分隔字符串；JSON 缺失、无法解析或缺键时为 ""。
        classes 对应 JSON 键 class。
      properties:
        classes: {type: string}
        area: {type: string}
        lang: {type: string}
        year: {type: string}
        star: {type: string}
        director: {type: string}
        state: {type: string}
        version: {type: string}
    CategoryRef:
      type: object
      additionalProperties: false
      required: [id, name, enName, parentId]
      properties:
        id: {type: integer}
        name: {type: string}
        enName: {type: string}
        parentId: {type: integer}
    VideoPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VideoSummary'
        page:
          type: integer
          description: 本次请求的页码（回显）
        pageSize:
          type: integer
          description: 本次请求的每页条数（回显）
        total:
          type: integer
          format: int64
          description: 满足条件的视频总数
        totalPages:
          type: integer
          format: int64
          description: ceil(total / pageSize)，total=0 时为 0
    VideoSummary:
      type: object
      additionalProperties: false
      required: [id, name, subTitle, enName, letter, color, category, classes, tag, pic, picThumb, picSlide,
                 actor, director, blurb, remarks, area, lang, year, version, state, serial, total, finished,
                 level, copyright, score, scoreNum, hits, hitsDay, hitsWeek, hitsMonth, up, down, updatedAt,
                 addedAt, detailPasswordRequired]
      properties:
        id: {type: integer, format: int64, description: vod_id}
        name: {type: string, description: vod_name}
        subTitle: {type: string, description: vod_sub（副标题/别名）}
        enName: {type: string, description: vod_en}
        letter: {type: string, description: vod_letter（首字母）}
        color: {type: string, description: vod_color（标题颜色）}
        category:
          $ref: '#/components/schemas/CategoryRef'
        classes: {type: string, description: vod_class（扩展分类，逗号分隔）}
        tag: {type: string, description: vod_tag}
        pic: {type: string, description: vod_pic}
        picThumb: {type: string, description: vod_pic_thumb}
        picSlide: {type: string, description: vod_pic_slide}
        actor: {type: string, description: vod_actor}
        director: {type: string, description: vod_director}
        blurb: {type: string, description: vod_blurb（简介）}
        remarks: {type: string, description: vod_remarks（备注，如"更新至10集"）}
        area: {type: string, description: vod_area}
        lang: {type: string, description: vod_lang}
        year: {type: string, description: vod_year}
        version: {type: string, description: vod_version}
        state: {type: string, description: vod_state}
        serial: {type: string, description: vod_serial（连载数）}
        total: {type: integer, description: vod_total（总集数）}
        finished: {type: boolean, description: vod_isend=1}
        level: {type: integer, description: vod_level（推荐等级 0-9）}
        copyright: {type: boolean, description: vod_copyright=1}
        score: {type: number, description: vod_score（一位小数）}
        scoreNum: {type: integer, description: vod_score_num}
        hits: {type: integer}
        hitsDay: {type: integer}
        hitsWeek: {type: integer}
        hitsMonth: {type: integer}
        up: {type: integer, description: vod_up（顶）}
        down: {type: integer, description: vod_down（踩）}
        updatedAt: {type: integer, format: int64, description: vod_time（Unix 秒）}
        addedAt: {type: integer, format: int64, description: vod_time_add（Unix 秒）}
        detailPasswordRequired:
          type: boolean
          description: 视频设置了观看密码，详情接口会返回 403 VIDEO_PASSWORD_REQUIRED。密码本身从不返回。
    VideoDetail:
      type: object
      additionalProperties: false
      required: [id, name, subTitle, enName, letter, color, category, classes, tag, pic, picThumb, picSlide,
                 actor, director, writer, behind, blurb, remarks, pubdate, area, lang, year, version, state, tv,
                 weekday, duration, serial, total, finished, level, copyright, score, scoreAll, scoreNum,
                 doubanId, doubanScore, hits, hitsDay, hitsWeek, hitsMonth, up, down, updatedAt, addedAt, content]
      description: 视频公开元数据。不包含播放/下载地址、观看密码、积分、试看、会员组、模板、来源地址等字段。
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        subTitle: {type: string}
        enName: {type: string}
        letter: {type: string}
        color: {type: string}
        category:
          $ref: '#/components/schemas/CategoryRef'
        classes: {type: string}
        tag: {type: string}
        pic: {type: string}
        picThumb: {type: string}
        picSlide: {type: string}
        actor: {type: string}
        director: {type: string}
        writer: {type: string, description: vod_writer（编剧）}
        behind: {type: string, description: vod_behind（幕后）}
        blurb: {type: string}
        remarks: {type: string}
        pubdate: {type: string, description: vod_pubdate（上映日期，原样字符串）}
        area: {type: string}
        lang: {type: string}
        year: {type: string}
        version: {type: string}
        state: {type: string}
        tv: {type: string, description: vod_tv（电视频道）}
        weekday: {type: string, description: vod_weekday（节目周期）}
        duration: {type: string, description: vod_duration（时长）}
        serial: {type: string}
        total: {type: integer}
        finished: {type: boolean}
        level: {type: integer}
        copyright: {type: boolean}
        score: {type: number}
        scoreAll: {type: integer}
        scoreNum: {type: integer}
        doubanId: {type: integer, format: int64}
        doubanScore: {type: number}
        hits: {type: integer}
        hitsDay: {type: integer}
        hitsWeek: {type: integer}
        hitsMonth: {type: integer}
        up: {type: integer}
        down: {type: integer}
        updatedAt: {type: integer, format: int64}
        addedAt: {type: integer, format: int64}
        content:
          type: string
          description: vod_content，后台录入的原始 HTML。前端渲染前必须做 HTML 白名单过滤。
