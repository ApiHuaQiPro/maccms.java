  /actuator/health:
    get:
      tags: [ops]
      operationId: health
      summary: 健康检查
      description: 只返回整体状态（含数据库连通性），不返回组件明细、版本或配置。数据库不可用时返回 503 与 DOWN。
      responses:
        '200':
          description: 服务与数据库可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: UP
        '503':
          description: 服务或数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: DOWN
components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: 【1.2.0】内容 ID（vod_id / art_id / topic_id / actor_id / role_id / website_id）。词法与范围同视频详情。
      schema: {type: integer, format: int64, minimum: 1, maximum: 4294967295}
    CategoryId:
      name: categoryId
      in: query
      required: false
      description: 【1.2.0】分类 ID（mac_type.type_id），规则同视频列表：包含该分类及其可见的直接子分类。
      schema: {type: integer, minimum: 1, maximum: 65535}
    CommonSort:
      name: sort
      in: query
      required: false
      description: 【1.2.0】排序字段（各模型 listCacheData 的 by，不含 rnd、in），默认 time。
      schema:
        type: string
        default: time
        enum: [time, time_add, id, score, hits, hits_day, hits_week, hits_month, up, down, level]
    OrderDesc:
      name: order
      in: query
      required: false
      description: 【1.2.0】排序方向，默认 desc。
      schema: {type: string, enum: [asc, desc], default: desc}
    Page:
      name: page
      in: query
      required: false
      description: 【1.2.0】页码，从 1 开始，默认 1。规则同视频列表。
      schema: {type: integer, minimum: 1, maximum: 1000, default: 1}
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 【1.2.0】每页条数，默认 20（旧 listCacheData 的 num 默认值）。规则同视频列表。
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Level:
      name: level
      in: query
      required: false
      description: 【1.2.0】推荐等级，精确匹配（旧 level；新版单值，不支持逗号多值与 all）。词法同视频列表的 level。
      schema: {type: integer, minimum: 1, maximum: 9}
    Letter:
      name: letter
      in: query
      required: false
      description: |
        【1.2.0】首字母（旧 letter）：单个 ASCII 字母或数字，或 `0-9`（匹配 10 个数字）。大小写不敏感（由旧表列排序规则决定，与旧版相同）。
        其他取值 → 400（message "必须是单个字母或数字，或 0-9"）。
      schema: {type: string, pattern: '^([A-Za-z0-9]|0-9)$'}
  responses:
    CategoryNotFound:
      description: 【1.2.0】分类不存在或不可见（code=CATEGORY_NOT_FOUND）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: CATEGORY_NOT_FOUND
            message: 分类不存在
            fieldErrors: []
    InvalidParameter:
      description: 参数不合法（code=INVALID_PARAMETER），fieldErrors 指出具体参数
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_PARAMETER
            message: 请求参数不合法
            fieldErrors:
              - field: pageSize
                message: 必须是 1 到 100 之间的整数
    ServiceUnavailable:
      description: 数据库暂时不可用（code=SERVICE_UNAVAILABLE）。/api/v1/videos 带 1.1.0 新参数时另有两种原因，见该操作的 503；1.2.0 的列表语句超过执行时限、专题按标签关联内容达到并发上限时同样返回该响应
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 未预期的服务器错误（code=INTERNAL_ERROR），不包含内部细节
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, fieldErrors]
      description: |
        统一错误响应。code 取值与 HTTP 状态：
        INVALID_PARAMETER=400，CATEGORY_NOT_FOUND=404，VIDEO_NOT_FOUND=404，VIDEO_PASSWORD_REQUIRED=403，
        VIDEO_COPYRIGHT_RESTRICTED=403，NOT_FOUND=404（路径不存在），METHOD_NOT_ALLOWED=405，
        SERVICE_UNAVAILABLE=503，INTERNAL_ERROR=500；1.2.0 新增 ARTICLE_NOT_FOUND=404、ARTICLE_PASSWORD_REQUIRED=403、
        ARTICLE_POINTS_REQUIRED=403、TOPIC_NOT_FOUND=404、ACTOR_NOT_FOUND=404、ROLE_NOT_FOUND=404、WEBSITE_NOT_FOUND=404。
        前端应按 code 分支，message 仅供展示。
      properties:
        code:
          type: string
          enum: [INVALID_PARAMETER, CATEGORY_NOT_FOUND, VIDEO_NOT_FOUND, VIDEO_PASSWORD_REQUIRED,
                 VIDEO_COPYRIGHT_RESTRICTED, ARTICLE_NOT_FOUND, ARTICLE_PASSWORD_REQUIRED, ARTICLE_POINTS_REQUIRED,
                 TOPIC_NOT_FOUND, ACTOR_NOT_FOUND, ROLE_NOT_FOUND, WEBSITE_NOT_FOUND, NOT_FOUND, METHOD_NOT_ALLOWED,
                 SERVICE_UNAVAILABLE, INTERNAL_ERROR]
        message:
          type: string
        fieldErrors:
          type: array
          description: 仅 INVALID_PARAMETER 时非空。
          items:
            $ref: '#/components/schemas/FieldError'
