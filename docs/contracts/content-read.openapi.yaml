  /api/v1/articles:
    get:
      tags: [content]
      operationId: listArticles
      summary: 【1.2.0】文章分页列表
      description: |
        返回已审核（art_status=1）且所属文章分类可见（规则同 `/api/v1/article-categories`）的文章。
        传 `categoryId` 时包含该分类及其可见的直接子分类；分类不存在或不可见 → 404 `CATEGORY_NOT_FOUND`。
        排序白名单同视频列表（旧 Art::listCacheData 的 by，不含 rnd），默认 `time` 倒序，再按 `id` 同方向排序。
        列表项不含正文、访问密码、积分。
      parameters:
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/CommonSort'
        - $ref: '#/components/parameters/OrderDesc'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Level'
        - $ref: '#/components/parameters/Letter'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticlePage'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/articles/{id}:
    get:
      tags: [content]
      operationId: getArticle
      summary: 【1.2.0】文章公开详情
      description: |
        判定顺序（旧 label_art_detail + Art::detail）：
        1. 文章不存在、未审核、所属分类不可见、或游客组对该分类没有"详情"权限（权限位 2）→ 404 `ARTICLE_NOT_FOUND`；
        2. 启用游客权限校验（`maccms.content.enforce-guest-popedom=true`，默认）且文章需要积分（art_points 或
           art_points_detail 大于 0）→ 403 `ARTICLE_POINTS_REQUIRED`（旧版显示扣积分确认页）；
        3. 文章设置了访问密码（art_pwd 非空）→ 403 `ARTICLE_PASSWORD_REQUIRED`；
        4. 其他情况 → 200。`pages` 为全部分页（旧 `$$$` 分页，mac_art_list），客户端自行分页显示。
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '403':
          description: 需要积分（ARTICLE_POINTS_REQUIRED）或访问密码（ARTICLE_PASSWORD_REQUIRED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: ARTICLE_PASSWORD_REQUIRED
                message: 该文章需要访问密码
                fieldErrors: []
        '404':
          description: 文章不存在或不可见（code=ARTICLE_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/topics:
    get:
      tags: [content]
      operationId: listTopics
      summary: 【1.2.0】专题分页列表
      description: |
        返回 topic_status=1 的专题（专题没有分类与权限位）。排序白名单同视频列表，默认 `time` 倒序，再按 `id` 同方向排序。
      parameters:
        - $ref: '#/components/parameters/CommonSort'
        - $ref: '#/components/parameters/OrderDesc'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Level'
        - $ref: '#/components/parameters/Letter'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicPage'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/topics/{id}:
    get:
      tags: [content]
      operationId: getTopic
      summary: 【1.2.0】专题公开详情（含关联视频与文章）
      description: |
        专题不存在或 topic_status≠1 → 404 `TOPIC_NOT_FOUND`。关联内容对应旧 Topic::infoData，按以下顺序**直接拼接**（重复项保留）：
        1. `topic_rel_vod` / `topic_rel_art` 中列出的 ID：已审核且所属分类可见，按更新时间倒序（再按 id 倒序），各最多 999 条；
        2. 仅当 `maccms.content.search.enabled=true`：`topic_tag` 按逗号拆开后在视频 `vod_tag` / 文章 `art_tag` 中包含匹配（字面匹配），
           同样的可见性、排序与上限。开关关闭时不执行这一步（只返回第 1 步的结果）。这一步与视频搜索共用并发上限，
           超过上限或执行超时 → 503 `SERVICE_UNAVAILABLE`。
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicDetail'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '404':
          description: 专题不存在或未审核（code=TOPIC_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
