# 默认配置不含任何数据库地址或凭证：缺少环境变量时启动直接失败，不会回落到任何默认库或 root 账号。
# 可用的环境变量见 backend/config/maccms-backend.env.example。
spring:
  application:
    name: maccms-backend
  datasource:
    url: ${MACCMS_DB_URL}
    username: ${MACCMS_DB_USERNAME}
    password: ${MACCMS_DB_PASSWORD}
    hikari:
      # 只读连接：Connector/J 会对会话执行 SET SESSION TRANSACTION READ ONLY，写语句会被 MySQL 拒绝
      read-only: true
      maximum-pool-size: ${MACCMS_DB_POOL_SIZE:10}
      connection-timeout: 5000
      pool-name: maccms-ro
  sql:
    init:
      # 不执行任何 schema/data 初始化脚本
      mode: never
  jackson:
    default-property-inclusion: always
  # 会员头像上传（B09，18 文档第 3.8 节）：旧版取 PHP upload_max_filesize（默认 2M）
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    arg-name-based-constructor-auto-mapping: true
    map-underscore-to-camel-case: false
    default-statement-timeout: 10

maccms:
  datasource:
    allow-root: ${MACCMS_DB_ALLOW_ROOT:false}
  # 可写数据源（B07，docs/architecture/12-write-infrastructure.md 第 2 节）：默认关闭，关闭时不创建任何可写连接，应用只读。
  # 与上面的只读连接池分开（连接池 maccms-rw，不是 DataSource Bean）；打开时地址、账号、密码必须经 MACCMS_WRITE_DB_* 单独提供，
  # 不沿用只读连接池的配置；地址须与 MACCMS_DB_URL 指向同一主机、端口与库名。只执行 WriteRegistry 登记的"模块 + 表 + 操作"。
  write:
    enabled: ${MACCMS_WRITE_ENABLED:false}
    url: ${MACCMS_WRITE_DB_URL:}
    username: ${MACCMS_WRITE_DB_USERNAME:}
    password: ${MACCMS_WRITE_DB_PASSWORD:}
    allow-root: ${MACCMS_WRITE_DB_ALLOW_ROOT:false}
    pool-size: ${MACCMS_WRITE_DB_POOL_SIZE:4}
  content:
    # 对齐 PHP 配置 user.status：1 时按游客组(group_id=1)的 group_type/group_popedom 判定分类与详情可见性
    enforce-guest-popedom: ${MACCMS_CONTENT_ENFORCE_GUEST_POPEDOM:true}
    # 对齐 PHP 配置 app.copyright_status==2（内容页跳转）：vod_copyright=1 的视频详情返回 403
    copyright-hides-detail: ${MACCMS_CONTENT_COPYRIGHT_HIDES_DETAIL:true}
    # 对齐 PHP 配置 user.art_points_type（B05）：1 按 art_points（整篇收费），0 按 art_points_detail（按页收费），留空按仓库值 1
    art-points-type: ${MACCMS_CONTENT_ART_POINTS_TYPE:}
    # 播放/下载授权（B05，docs/architecture/15-b05-readonly-pages.md 第 6 节），对齐旧 PHP 配置，留空按仓库值：
    # vod-points-type 对应 user.vod_points_type（1 每数据、0 每集）；trysee 对应 user.trysee（全局试看分钟数，0 关闭）；
    # copyright-status 对应 app.copyright_status（0..4，留空时按 copyright-hides-detail 取 2 或 1；设置时须与 copyright-hides-detail 一致）
    playback:
      vod-points-type: ${MACCMS_CONTENT_VOD_POINTS_TYPE:}
      trysee: ${MACCMS_CONTENT_TRYSEE:}
      copyright-status: ${MACCMS_CONTENT_COPYRIGHT_STATUS:}
    # 视频搜索（契约 1.1.0，docs/architecture/09-content-search-filter-plan.md 第 6.3-6.4 节）。只读本应用环境变量，不读取 PHP 配置。
    search:
      # 是否接受包含匹配参数 keyword、classes（true/false），默认关闭；area/lang/year/level 精确筛选不受影响。
      # 开启前须先完成 09 方案第 6.5 节的一次性合成库测量并经确认。
      enabled: ${MACCMS_CONTENT_SEARCH_ENABLED:false}
      # 带 keyword/classes 的请求同时执行的上限（1 到连接池大小减 1），超过即 503，不排队
      max-concurrent: ${MACCMS_CONTENT_SEARCH_MAX_CONCURRENT:4}
  # 会员账号（B09，docs/architecture/18-b09-member-account.md 第 7 节）：账号写入需要上面的可写数据源；关闭时会员入口返回 503。
  # upload-dir 为旧站根目录下 upload/ 的本地路径（头像写到其下 user/<id%10>/<id>.jpg，由部署层的 nginx 直接提供），留空时头像上传不可用。
  member:
    upload-dir: ${MACCMS_MEMBER_UPLOAD_DIR:}
  # 旧配置只读层（B02，docs/architecture/11-guards-and-legacy-config.md 第 4 节）：旧站 application 目录（含 extra/*.php、route.php），
  # 可以在仓库之外。留空表示未配置；只读解析 var_export 格式，不执行 PHP，不写回。不要指向线上目录。
  legacy-config:
    dir: ${MACCMS_LEGACY_CONFIG_DIR:}
  # 浏览器侧外部地址放行（B02，路线图第 1.3、4.2 节）：部署级参数，不是站点配置项。W1/W2 按旧版放行、默认打开，可设为 false 关闭
  # （关闭时页面不输出外部主机地址）；w1 播放器解析与外部脚本（输出在 B05 实现）；w2 外链图片与外部播放/下载地址；
  # w3 支付网关跳转（默认关闭，B24 前只能为 false）。
  browser-external:
    w1: ${MACCMS_BROWSER_EXTERNAL_W1:true}
    w2: ${MACCMS_BROWSER_EXTERNAL_W2:true}
    w3: ${MACCMS_BROWSER_EXTERNAL_W3:false}
  # 客户端 IP 解析（B06，D2 ④，docs/architecture/16-b06-misc-pages-provide.md 第 2 节）：部署级参数。默认只用连接对端；
  # trusted-proxies 为逗号分隔的 IP/CIDR，只有对端落在其中时才采用 header 指定的转发头（X-Forwarded-For 列表，或单值头
  # X-Real-IP/CF-Connecting-IP/True-Client-IP/Ali-CDN-Real-IP）。部署在 CDN/反向代理后面时必须填写代理出口网段，否则客户端 IP
  # 全部是代理地址；不要填 0.0.0.0/0 之类的宽网段（任何人都能伪造转发头）。
  client-ip:
    trusted-proxies: ${MACCMS_TRUSTED_PROXIES:}
    header: ${MACCMS_CLIENT_IP_HEADER:}
  # Provide 资源站接口（B06，docs/architecture/16-b06-misc-pages-provide.md 第 3 节）：默认关闭，关闭时不注册 /api.php/provide/**
  # 路由。打开后各模块再按旧配置 extra/maccms.php 的 api.<模块>.status 判定（仓库值全部关闭），未设置 maccms.legacy-config.dir 时
  # 全部输出 closed。charge=1 的白名单按 maccms.client-ip 解析客户端 IP。只读：detail_inc_hits 开启时也不写计数（B11）。
  openapi:
    enabled: ${MACCMS_OPENAPI_ENABLED:false}
  # site 服务端页面（MACC-9 骨架）：默认关闭，关闭时不注册任何 site 路由。
  # 启用时 name、base-url 必填并校验，缺失或不合法即启动失败（不回显取值）。规则见 docs/architecture/05-site-skeleton.md。
  # 设置了 maccms.legacy-config.dir 时，name、keywords、description、icp、logo-url、status、closed-message、url.*、image.* 按字段
  # 并入旧配置 extra/maccms.php（环境变量非空优先，启动时读一次，改了要重启；11 文档第 4.4 节）。base-url 不取旧配置，仍必填。
  # canonical 只用 base-url，不从 Host 头推断。
  site:
    enabled: ${MACCMS_SITE_ENABLED:false}
    name: ${MACCMS_SITE_NAME:}
    base-url: ${MACCMS_SITE_BASE_URL:}
    keywords: ${MACCMS_SITE_KEYWORDS:}
    description: ${MACCMS_SITE_DESCRIPTION:}
    icp: ${MACCMS_SITE_ICP:}
    logo-url: ${MACCMS_SITE_LOGO_URL:}
    # open / closed，留空时取旧配置 site_status，没有旧配置按 open
    status: ${MACCMS_SITE_STATUS:}
    closed-message: ${MACCMS_SITE_CLOSED_MESSAGE:}
    # canonical 301（D4）与点击计数（D5）未批准，只接受 false
    canonical-redirect: ${MACCMS_SITE_CANONICAL_REDIRECT:false}
    hit-counter-enabled: ${MACCMS_SITE_HIT_COUNTER_ENABLED:false}
    # SSR 搜索页（MACC-20，09 方案第 7 节）：true 时注册旧 vod/search 固定路径 + 查询串形式的页面，默认关闭（关闭时路由不存在）。
    # 关键字 wd、扩展分类 class 仍受 maccms.content.search.enabled 控制（关闭时搜索页对它们返回 400）。
    search:
      enabled: ${MACCMS_SITE_SEARCH_ENABLED:false}
    # 访问密码签名票据的部署密钥（B05，D-B05-3）：32～256 个可打印 ASCII 字符，只经环境变量提供、没有内置值；
    # 留空时播放/下载/文章密码页保持 403 并说明暂不支持在线验证。不要写进任何文件或日志。
    password-tickets:
      secret: ${MACCMS_SITE_PASSWORD_SECRET:}
    # 旧前台页面开关（B05）：ajax-page 对应 app.ajax_page（各模块 ajax_detail/ajax_show/ajax_search），show 对应 app.show
    # （各模块 show 筛选页）。true/false，留空取旧配置，没有旧配置按关闭（仓库值 0）。
    features:
      ajax-page: ${MACCMS_SITE_AJAX_PAGE:}
      show: ${MACCMS_SITE_SHOW:}
    # 旧站 URL 形态（MACC-14，对应旧 rewrite.status / rewrite.suffix_hide），只接受 true/false，留空时取旧配置，没有旧配置按 false；
    # pathinfo_depr 固定 /、不启用路由别名。规则见 docs/architecture/08-site-pages.md。
    url:
      rewrite: ${MACCMS_SITE_URL_REWRITE:}
      suffix-hide: ${MACCMS_SITE_URL_SUFFIX_HIDE:}
    # 图片地址（MACC-14，对应旧 upload.protocol/mode/remoteurl/img_key/img_api），校验见 06 文档第 4 节；
    # img-key 只接受字面域名多选一（不含量词、分组、字符类）。
    image:
      protocol: ${MACCMS_SITE_IMAGE_PROTOCOL:}
      mode: ${MACCMS_SITE_IMAGE_MODE:}
      remote-url: ${MACCMS_SITE_IMAGE_REMOTE_URL:}
      img-key: ${MACCMS_SITE_IMAGE_IMG_KEY:}
      img-api: ${MACCMS_SITE_IMAGE_IMG_API:}

server:
  port: ${MACCMS_SERVER_PORT:18280}
  address: ${MACCMS_SERVER_ADDRESS:127.0.0.1}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    whitelabel:
      enabled: false
  shutdown: graceful

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      # 不在响应中列出 liveness/readiness 分组
      probes:
        enabled: false
  info:
    env:
      enabled: false
