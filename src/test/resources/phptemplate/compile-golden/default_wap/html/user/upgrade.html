			我要升级
		</div>
	</div>
</div>

<div class="wrap list-top" style="border-top: 1px solid #ececec;">
	<span class="ml10">会员组：[<?php echo $obj['group']['group_name']; ?>] 积分：[<?php echo $obj['user_points']; ?>] 期限：<?php if($obj['group_id'] < 3): ?>[无限期]<?php else: ?>[<?php echo mac_day($obj['user_end_time']); ?>]<?php endif; ?></span>
</div>
<div class="information-w">
	<!--个人信息-->
	<form method="post" id="fm">
		<ul class="clearfix">
			<?php if(is_array($group_list) || $group_list instanceof /think/Collection || $group_list instanceof /think/Paginator): $i = 0; $__LIST__ = $group_list;if( count($__LIST__)==0 ) : echo "" ;else: foreach($__LIST__ as $key=>$vo): $mod = ($i % 2 );++$i;if($vo['group_id'] > 2 && $vo['group_status'] == 1): ?>
				<li class="no-bg"><span class="tit">会员组：<?php echo $vo['group_name']; ?></span><span></span></li>

				<li class="no-bg"><span class="tit"></span><span class="grade" data-id="<?php echo $vo['group_id']; ?>" data-name="<?php echo $vo['group_name']; ?>"  data-points="<?php echo $vo['group_points_week']; ?>" data-long="week">包周：<?php echo $vo['group_points_week']; ?>积分</span></li>
				<li class="no-bg"><span class="tit"></span><span class="grade" data-id="<?php echo $vo['group_id']; ?>" data-name="<?php echo $vo['group_name']; ?>"  data-points="<?php echo $vo['group_points_month']; ?>" data-long="month">包月：<?php echo $vo['group_points_month']; ?>积分</span></li>

			<?php endif; endforeach; endif; else: echo "" ;endif; ?>

		</ul>
	</form>
</div>


<!--loading start-->
<div class="loading_box"></div>
<!--loading end-->

<script>

	$(".go-back").click(function () {
		var ref = document.referrer;
		location.href=ref;
	});

	$('.grade').click(function(){
		var that=$(this);
		var group_id = that.attr('data-id');
		var group_name = that.attr('data-name');
		var long = that.attr('data-long');
		var points = that.attr('data-points');

		if(confirm('确定要升级到【'+group_name+'】吗,需要花费【'+points+'】积分')) {
			$.ajax({
				url: "<?php echo url('user/upgrade'); ?>",
				type: "post",
				dataType: "json",
				data: {group_id: group_id,long:long },
				beforeSend: function () {
					$("#btn_submit").css("background","#fd6a6a").val("loading...");
				},
				success: function (r) {
					alert(r.msg);
					if (r.code == 1) {
						location.reload();
					}
				},
				complete: function () {
					$("#btn_submit").css("background","#fa4646").val("提交");
				}
			});
		}
	});

</script>

</html>
