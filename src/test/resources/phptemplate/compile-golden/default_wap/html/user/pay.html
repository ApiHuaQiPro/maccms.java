<script>
	var codepay_type = '{maccms:foreach name=":explode(',',$config.codepay.type)"}<option value ="<?php echo $vo; ?>"><?php if($vo==1): ?>支付宝二维码<?php elseif($vo==2): ?>QQ钱包二维<?php elseif($vo==3): ?>微信二维码<?php endif; ?></option>{/maccms:foreach}';
	var zhapay_type ='{maccms:foreach name=":explode(',',$config.zhapay.type)"}<option value ="<?php echo $vo; ?>"><?php if($vo==1): ?>微信<?php elseif($vo==2): ?>支付宝<?php endif; ?></option> {/maccms:foreach}';

		else{
			$("#paytype_box").slideUp();

		$('#paytype').val( $(this).val() );
	});
